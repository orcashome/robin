@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#ECEFEC; --card:#FBF9F2; --ink:#15211C; --ink-soft:#5E6E67;
  --accent:#16704B; --accent-press:#10583B; --line:#D9DEDA; --rule:#E7E0CE; --danger:#9A3B34;
  --disp:'Fraunces',Georgia,'Times New Roman',serif;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
.kbx{ font-family:var(--ui); color:var(--ink); background:var(--paper); min-height:100vh;
  display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
.frame{ width:100%; max-width:480px; min-height:100vh; padding:22px 20px 40px; display:flex; flex-direction:column; }

.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; min-height:34px; }
.topbar-actions{ display:flex; gap:2px; }
.brand{ font-family:var(--disp); font-weight:600; font-size:22px; letter-spacing:-.01em; }
.brand small{ font-family:var(--ui); font-weight:500; font-size:11px; color:var(--ink-soft);
  display:block; letter-spacing:.14em; text-transform:uppercase; margin-top:-2px; }
.back-link{ background:none; border:none; color:var(--ink-soft); font-family:var(--ui);
  font-size:14px; cursor:pointer; padding:6px 4px; display:flex; align-items:center; gap:6px; }
.back-link:hover{ color:var(--ink); }

.h1{ font-family:var(--disp); font-size:28px; font-weight:500; letter-spacing:-.02em; margin:2px 0 2px; }
.sub{ color:var(--ink-soft); font-size:14px; margin-bottom:22px; }
.btn{ font-family:var(--ui); font-weight:500; font-size:15px; border-radius:12px; cursor:pointer;
  border:1px solid transparent; padding:13px 16px; transition:transform .08s ease, background .15s ease; }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); color:#fff; width:100%; }
.btn-primary:hover{ background:var(--accent-press); }
.btn-primary:disabled{ background:#B7C3BC; cursor:default; }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--ink-soft); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.deck{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px;
  margin-bottom:12px; cursor:pointer; transition:border-color .15s ease, transform .08s ease; }
.deck:hover{ border-color:var(--ink-soft); }
.deck:active{ transform:translateY(1px); }
.deck-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.deck-name{ font-family:var(--disp); font-size:19px; font-weight:500; }
.deck-due{ font-size:13px; color:var(--accent); font-weight:600; white-space:nowrap; }
.deck-due.zero{ color:var(--ink-soft); font-weight:500; }
.deck-meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
.minibar{ display:flex; gap:3px; margin-top:10px; height:5px; }
.minibar span{ flex:1; background:var(--line); border-radius:3px; }
.minibar span.on{ background:var(--accent); opacity:.75; }

.field{ width:100%; font-family:var(--ui); font-size:15px; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.field::placeholder{ color:#9CA8A2; }
.field:focus{ border-color:var(--accent); outline:none; }
.newdeck{ display:flex; gap:8px; margin-top:14px; }
.newdeck .btn{ padding:12px 16px; white-space:nowrap; }
.link-inline{ background:none; border:none; color:var(--accent); font-family:var(--ui);
  font-size:13px; font-weight:500; cursor:pointer; padding:10px 0 0; }
.link-inline:hover{ color:var(--accent-press); }

.strip{ display:flex; gap:6px; margin:6px 0 22px; }
.slot{ flex:1; background:#fff; border:1px solid var(--line); border-radius:10px 10px 6px 6px;
  padding:10px 4px 8px; text-align:center; position:relative; }
.slot.hasdue{ border-color:var(--accent); }
.slot-tab{ position:absolute; top:-1px; left:50%; transform:translateX(-50%);
  width:34%; height:4px; background:var(--line); border-radius:0 0 3px 3px; }
.slot.hasdue .slot-tab{ background:var(--accent); }
.slot-count{ font-family:var(--disp); font-size:20px; font-weight:500; line-height:1; }
.slot-label{ font-size:9.5px; color:var(--ink-soft); margin-top:5px; letter-spacing:.02em; }

.panel{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:22px; }
.panel-title{ font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:12px; }
.dual{ display:flex; flex-direction:column; gap:9px; }
.fieldrow{ display:flex; gap:8px; align-items:center; }
.fieldrow .field{ flex:1; }
.spk{ background:#fff; border:1px solid var(--line); border-radius:10px; width:44px; height:44px;
  flex-shrink:0; cursor:pointer; color:var(--accent); display:flex; align-items:center; justify-content:center; }
.spk:hover{ border-color:var(--accent); }
.spk:disabled{ color:#C7D0CB; cursor:default; }
.mic-row{ display:flex; align-items:center; gap:10px; margin-top:12px; }
.mic{ width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
  background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
  transition:transform .1s ease, background .15s ease; }
.mic:hover{ background:var(--accent-press); }
.mic:disabled{ background:#C3CDC7; cursor:default; }
.mic.live{ background:var(--danger); animation:pulse 1.3s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(154,59,52,.35);} 50%{ box-shadow:0 0 0 9px rgba(154,59,52,0);} }
.mic-hint{ font-size:12px; color:var(--ink-soft); line-height:1.45; }
.target-toggle{ display:flex; gap:6px; margin-bottom:11px; align-items:center; }
.chip{ font-size:12px; font-weight:500; padding:6px 11px; border-radius:20px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink-soft); }
.chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.lang-sel{ font-family:var(--ui); font-size:12px; border:1px solid var(--line); border-radius:8px;
  padding:6px 8px; color:var(--ink-soft); background:#fff; margin-left:auto; }

.share-ta{ width:100%; font-family:var(--ui); font-size:12px; color:var(--ink-soft); background:#F6F8F6;
  border:1px solid var(--line); border-radius:10px; padding:10px; resize:none; height:74px; word-break:break-all; }
.share-actions{ display:flex; gap:8px; margin-top:10px; }
.share-actions .btn{ flex:1; padding:11px; font-size:14px; }
.hint-err{ font-size:12px; color:var(--danger); margin-top:8px; }

.list-title{ font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin:4px 0 10px; }
.crow{ display:flex; align-items:center; gap:8px; padding:11px 4px; border-bottom:1px solid var(--line); }
.crow-front{ font-family:var(--disp); font-size:16px; font-weight:500; }
.crow-back{ font-size:13px; color:var(--ink-soft); }
.crow-spk{ background:none; border:none; color:#B7C3BC; cursor:pointer; padding:0 2px; }
.crow-spk:hover{ color:var(--accent); }
.crow-box{ font-size:10px; font-weight:600; color:var(--accent); border:1px solid var(--line);
  border-radius:6px; padding:2px 7px; margin-left:auto; white-space:nowrap; }
.crow-del{ background:none; border:none; color:#B7C3BC; cursor:pointer; font-size:18px; padding:0 4px; line-height:1; }
.crow-del:hover{ color:var(--danger); }

.study{ display:flex; flex-direction:column; min-height:100vh; }
.progress{ display:flex; gap:5px; margin:8px 0 26px; }
.pdot{ flex:1; height:4px; border-radius:2px; background:var(--line); }
.pdot.done{ background:var(--accent); }
.pdot.cur{ background:var(--ink); }
.cardstage{ flex:1; display:flex; align-items:center; justify-content:center; perspective:1400px; }
.flip{ width:100%; aspect-ratio:3/2; cursor:pointer; position:relative;
  transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
.flip.flipped{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
  background:var(--card); border:1px solid #E3DDCB;
  box-shadow:0 18px 40px -22px rgba(21,33,28,.5), 0 2px 0 #EFE9D8 inset;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;
  background-image:repeating-linear-gradient(var(--card) 0 30px, var(--rule) 30px 31px); }
.face .kicker{ position:absolute; top:16px; left:18px; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); }
.face-spk{ position:absolute; top:12px; right:14px; background:none; border:none; color:var(--ink-soft);
  cursor:pointer; padding:6px; border-radius:8px; }
.face-spk:hover{ color:var(--accent); }
.face-back{ transform:rotateY(180deg); }
.face .term{ font-family:var(--disp); font-size:30px; font-weight:500; letter-spacing:-.02em; line-height:1.15; }
.face .answer{ font-family:var(--disp); font-size:24px; font-weight:400; line-height:1.25; }
.tap-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:18px; min-height:18px; }
.rate-row{ display:flex; gap:10px; margin-top:18px; }
.rate-row .btn{ flex:1; display:flex; flex-direction:column; gap:2px; align-items:center; padding:11px; }
.rate-sub{ font-size:11px; font-weight:400; opacity:.85; }
.btn-again{ background:#fff; border:1px solid var(--line); color:var(--ink); }
.btn-again:hover{ border-color:var(--danger); color:var(--danger); }
.btn-good{ background:var(--accent); color:#fff; }
.btn-good:hover{ background:var(--accent-press); }

.study-top-right{ display:flex; align-items:center; gap:10px; }
.sound-btn{ background:none; border:1px solid var(--line); border-radius:20px; color:var(--ink-soft);
  font-family:var(--ui); font-size:12px; font-weight:500; cursor:pointer; padding:5px 10px; display:flex; gap:6px; align-items:center; }
.sound-btn.on{ border-color:var(--accent); color:var(--accent); }
.preview-note{ font-size:11px; color:var(--ink-soft); opacity:.85; margin-top:8px; line-height:1.4; }

.center-msg{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:12px; padding:40px 10px; }
.center-msg .big{ font-family:var(--disp); font-size:26px; font-weight:500; }
.center-msg .small{ color:var(--ink-soft); font-size:14px; max-width:290px; line-height:1.5; }

.feelcard{ width:100%; max-width:600px; aspect-ratio:3/2; border-radius:20px; border:1px solid #CFE3D8;
  background:linear-gradient(160deg,#EAF4EE,#F5FAF6); box-shadow:0 18px 40px -22px rgba(22,112,75,.45);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:28px; text-align:center; }
.feelcard .feeltext{ font-family:var(--disp); font-size:26px; font-weight:500; line-height:1.28; color:#14402E; letter-spacing:-.01em; }
.feelcard svg{ color:var(--accent); opacity:.9; }

.warmup-tile{ background:#fff; border:1px dashed var(--line); border-radius:16px; padding:14px 18px; margin:2px 0 12px; cursor:pointer; transition:border-color .15s ease; }
.warmup-tile:hover{ border-color:var(--accent); }
.warmup-tile .wt-title{ font-family:var(--disp); font-size:17px; font-weight:500; }
.warmup-tile .wt-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.lo-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:320px; margin:22px auto; width:100%; }
.lo-cell{ aspect-ratio:1; border-radius:14px; border:1px solid var(--line); background:var(--card); cursor:pointer; transition:background .15s ease, transform .08s ease, box-shadow .15s ease; }
.lo-cell.on{ background:var(--accent); border-color:var(--accent); box-shadow:0 8px 18px -8px rgba(22,112,75,.6); }
.lo-cell:active{ transform:scale(.96); }

.footer-pay{ margin-top:auto; padding-top:28px; text-align:center; font-size:12px; color:#9CA8A2; }

@media (min-width:700px){
  .frame{ max-width:720px; padding:32px 28px 52px; }
  .brand{ font-size:24px; }
  .h1{ font-size:34px; }
  .deck-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .deck-grid .deck{ margin-bottom:0; }
  .cardstage .flip{ max-width:600px; }
  .face .term{ font-size:36px; }
  .face .answer{ font-size:28px; }
}
@media (prefers-reduced-motion: reduce){ .flip{ transition:none } .mic.live{ animation:none } }
