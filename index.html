chts."],["Was macht man bei einem Zeckenbiss?","Zecke m\xF6glichst rasch mit einer Pinzette nah an der Haut herausziehen.","Nicht mit \xD6l oder Klebstoff ersticken \u2014 dann gibt sie eher Erreger ab. Danach die Stelle beobachten: Ein wandernder roter Ring ist ein Grund f\xFCr den Arztbesuch."],["Was tut man bei einem Insektenstich im Mund oder Rachen?","Sofort Notruf \u2014 Schwellungen k\xF6nnen die Atemwege verschlie\xDFen.","Bis Hilfe kommt: k\xFChlen, m\xF6glichst von au\xDFen und innen (Eis lutschen). Das ist einer der wenigen F\xE4lle, in denen ein Insektenstich lebensgef\xE4hrlich ist."],["Woran erkennt man eine Kreuzotter \u2014 und wie gef\xE4hrlich ist sie?","Am dunklen Zickzackband auf dem R\xFCcken; ihr Biss ist selten lebensgef\xE4hrlich.","Sie ist die einzige heimische Giftschlange, die man h\xE4ufiger antrifft, und sie bei\xDFt nur bei Bedrohung. Wichtig: ruhig bleiben, betroffenes Glied ruhigstellen, Arzt aufsuchen. Nicht aussaugen, nicht abbinden."],["Was gilt bei Gewitter drau\xDFen?","Freie Fl\xE4chen, B\xE4ume und Metall meiden, in die Hocke gehen, F\xFC\xDFe zusammen.","Am besten in ein Geb\xE4ude oder Auto. Drau\xDFen: kleine Auflagefl\xE4che, nicht flach hinlegen \u2014 der Strom breitet sich im Boden aus."],["Wie sch\xE4tzt man die Entfernung eines Gewitters?","Sekunden zwischen Blitz und Donner z\xE4hlen, durch drei teilen \u2014 das ergibt Kilometer.","Drei Sekunden entsprechen etwa einem Kilometer. Unter zehn Sekunden ist es zu nah, um im Freien zu bleiben."]])},{category:"Zum Staunen",subject:"Drau\xDFen zurechtkommen",name:"Wasser finden und trinkbar machen",flang:"de-DE",blang:"de-DE",cards:B([["Wie lange h\xE4lt ein Mensch ohne Wasser durch?","Meist etwa drei Tage.","Ohne Essen sind es Wochen. Deshalb gilt drau\xDFen immer: Wasser zuerst, Nahrung sp\xE4ter. Bei Hitze und Anstrengung kann es auch nur ein Tag sein."],["Was ist die zuverl\xE4ssigste Art, Wasser trinkbar zu machen?","Abkochen \u2014 einmal sprudelnd aufkochen gen\xFCgt.","Das t\xF6tet Bakterien, Viren und Parasiten. Eine Minute sprudelndes Kochen reicht; in gro\xDFer H\xF6he drei Minuten, weil Wasser dort schon bei niedrigerer Temperatur siedet."],["Was macht ein selbstgebauter Filter aus Sand und Kohle \u2014 und was nicht?","Er entfernt Schmutz und Tr\xFCbung, aber keine Krankheitserreger.","Das ist der h\xE4ufigste Irrtum. Filtern und Abkochen sind zwei verschiedene Dinge: erst filtern, damit das Wasser klar wird, dann abkochen, damit es sicher wird."],["Warum sollte man Wasser aus einem stehenden T\xFCmpel meiden?","Weil sich dort Keime stark vermehren.","Flie\xDFendes Wasser ist meist besser, oberhalb von Siedlungen und Weiden noch besser. Aber auch klares Bergwasser kann Erreger enthalten \u2014 ein totes Tier hundert Meter flussaufw\xE4rts sieht man nicht."],["Wie gewinnt man Wasser aus einer Pflanze?","Einen durchsichtigen Sack \xFCber einen belaubten Ast binden.","Die Pflanze verdunstet Wasser, es schl\xE4gt sich innen nieder und sammelt sich unten. Es geht langsam \u2014 ein paar Schluck am Tag \u2014 aber es ist sauberes Wasser."],["Ist Schnee essen eine gute Idee, wenn man Durst hat?","Nein \u2014 erst schmelzen lassen.","Schnee ist zu 90 Prozent Luft; man m\xFCsste sehr viel essen. Vor allem kostet das Schmelzen im Mund K\xF6rperw\xE4rme, und genau die braucht man bei K\xE4lte am dringendsten."],["Woran erkennt man in der Natur, dass Wasser in der N\xE4he ist?","An Tierspuren, Insektenschw\xE4rmen und gr\xFCner Vegetation.","Spuren laufen oft zusammen, je n\xE4her man dem Wasser kommt. Auch V\xF6gel fliegen morgens und abends zu Wasserstellen \u2014 meist niedrig und geradlinig."],["Warum sollte man Meerwasser nicht trinken?","Weil der K\xF6rper zum Ausscheiden des Salzes mehr Wasser braucht, als er bekommt.","Man dehydriert dadurch schneller als ohne. Aus demselben Grund ist auch Urin keine L\xF6sung."],["Was hilft, wenn man in der Sonne unterwegs ist und wenig Wasser hat?","In der Hitze rasten, in der K\xFChle gehen.","Nachts oder fr\xFCh morgens verliert man durch Schwitzen viel weniger. Und: nicht sparsam schlucken, sondern trinken, wenn man Durst hat \u2014 Wasser n\xFCtzt im K\xF6rper mehr als in der Flasche."],["Wie lange ist abgekochtes Wasser sicher?","So lange es abgedeckt bleibt und nichts hineinkommt.","Beim Umf\xFCllen in ein verschmutztes Gef\xE4\xDF ist die Arbeit zunichte. Deshalb: m\xF6glichst im selben Beh\xE4lter kochen und aufbewahren."]])},{category:"Zum Staunen",subject:"Drau\xDFen zurechtkommen",name:"W\xE4rme halten & Unterschlupf",flang:"de-DE",blang:"de-DE",cards:B([["Was ist die gr\xF6\xDFte Gefahr, wenn man drau\xDFen \xFCbernachten muss?","Ausk\xFChlen \u2014 schon bei Temperaturen deutlich \xFCber null.","Unterk\xFChlung passiert am h\xE4ufigsten zwischen 0 und 10 Grad, weil man sie untersch\xE4tzt. Nass und Wind zusammen k\xFChlen schneller aus als trockene K\xE4lte."],["Warum ist N\xE4sse gef\xE4hrlicher als K\xE4lte?","Nasse Kleidung leitet W\xE4rme viel schneller ab als trockene.","Wasser entzieht dem K\xF6rper W\xE4rme etwa f\xFCnfundzwanzigmal so schnell wie Luft. Deshalb gilt: trocken bleiben hat Vorrang vor warm anziehen."],["Warum sollte man beim Anstrengen eine Schicht ausziehen?","Damit man nicht durchschwitzt.","Schwei\xDF macht die Kleidung nass, und nass wird man in der Pause sofort kalt. Bergsteiger sagen: Lieber beim Gehen etwas frieren als danach."],["Was ist der wichtigste Teil eines Notlagers?","Die Isolierung nach unten.","Der Boden zieht mehr W\xE4rme aus dem K\xF6rper als die Luft. Laub, \xC4ste, ein Rucksack \u2014 Hauptsache eine dicke Schicht zwischen K\xF6rper und Erde. Eine Decke unter sich n\xFCtzt mehr als \xFCber sich."],["Warum ist ein kleiner Unterschlupf besser als ein gro\xDFer?","Weil man einen kleinen Raum mit K\xF6rperw\xE4rme w\xE4rmen kann.","Gerade gro\xDF genug zum Hineinkriechen. Ein gro\xDFer Unterstand bleibt kalt, egal wie gut er gebaut ist."],["\xDCber welchen K\xF6rperteil verliert man am meisten W\xE4rme?","\xDCber alles, was unbedeckt ist \u2014 meist Kopf und H\xE4nde.","Der oft geh\xF6rte Satz, man verliere die H\xE4lfte \xFCber den Kopf, stimmt nicht. Der Kopf ist einfach h\xE4ufig der einzige unbedeckte Teil \u2014 deshalb hilft eine M\xFCtze so viel."],["Was bedeutet \u201EZwiebelprinzip\u201C?","Mehrere d\xFCnne Schichten statt einer dicken.","Zwischen den Schichten steht Luft, und Luft isoliert. Au\xDFerdem kann man einzeln an- und ausziehen, wenn sich die Anstrengung \xE4ndert."],["Was tut man zuerst, wenn jemand unterk\xFChlt ist?","Vor Wind und N\xE4sse sch\xFCtzen, nasse Kleidung wechseln, warm einpacken.","Nicht abrupt aufw\xE4rmen, nicht kr\xE4ftig reiben, kein Alkohol \u2014 der weitet die Gef\xE4\xDFe und l\xE4sst noch mehr W\xE4rme entweichen. Warme, gezuckerte Getr\xE4nke helfen, wenn die Person klar ansprechbar ist."],["Wo baut man ein Notlager besser nicht?","In Senken, auf Bergr\xFCcken und unter toten \xC4sten.","In Senken sammelt sich kalte Luft, auf R\xFCcken bl\xE4st der Wind, tote \xC4ste fallen. Ein leichter Hang mit Windschutz ist meist die beste Wahl."],["Warum sind mehrere Menschen im Kalten besser dran als einer?","Weil sie sich gegenseitig w\xE4rmen.","Zusammenr\xFCcken bringt sp\xFCrbar mehr als jede Ausr\xFCstung, die man nicht dabeihat. Die Schw\xE4chsten kommen in die Mitte."]])},{category:"Zum Staunen",subject:"Sch\xE4tzfragen",name:"Wie gro\xDF, wie weit, wie viel?",flang:"de-DE",blang:"de-DE",cards:B([["Wie hoch ist der Eiffelturm?","Rund 330 Meter mit Antennen \u2014 etwa so hoch wie ein Haus mit 100 Stockwerken."],["Wie weit ist der Mond von der Erde entfernt?","Rund 384 000 km. Dazwischen h\xE4tten alle anderen Planeten des Sonnensystems nebeneinander Platz."],["Wie lange braucht das Sonnenlicht bis zur Erde?","Gut 8 Minuten. Erlischt die Sonne, merken wir es erst 8 Minuten sp\xE4ter."],["Wie hoch ist der Mount Everest?","8849 Meter \u2014 und er w\xE4chst jedes Jahr um wenige Millimeter weiter."],["Wie tief ist die tiefste Stelle im Meer?","Rund 11 000 Meter im Marianengraben. Der Everest h\xE4tte darin Platz und w\xE4re noch \xFCberflutet."],["Wie schnell dreht sich die Erde am \xC4quator?","Etwa 1670 km/h. Wir merken es nicht, weil sich alles mitdreht."],["Wie schnell bewegt sich die Erde auf ihrer Bahn um die Sonne (in km/h)?","Rund 107 000 km/h.","Das sind etwa 30 Kilometer pro Sekunde. Wir merken nichts davon, weil sich alles um uns herum genau gleich schnell mitbewegt \u2014 Luft, Meer, H\xE4user. Bewegung sp\xFCrt man nur, wenn sie sich \xE4ndert."],["Wie alt ist die Erde?","Etwa 4,5 Milliarden Jahre. Der Mensch gibt es davon nur die letzten Sekunden."],["Wie viele Menschen leben auf der Erde?","\xDCber 8 Milliarden \u2014 vor 200 Jahren war es noch nicht einmal eine."],["Wie oft schl\xE4gt ein Herz an einem Tag?","Rund 100 000 Mal."],["Wie lang w\xE4ren alle Blutgef\xE4\xDFe eines Menschen aneinandergelegt?","Etwa 100 000 Kilometer \u2014 zweieinhalbmal um die Erde."],["Wie viele Atemz\xFCge macht ein Mensch pro Tag?","Ungef\xE4hr 20 000."],["Wie viele Haare hat ein Mensch auf dem Kopf?","Rund 100 000. Etwa 100 davon fallen t\xE4glich aus und wachsen nach."],["Wie viele Zellen hat ein menschlicher K\xF6rper?","Etwa 30 Billionen \u2014 eine 3 mit 13 Nullen."],["Wie viel Prozent der Erdoberfl\xE4che ist Wasser?","Rund 71 Prozent. Davon sind aber 97 Prozent Salzwasser."],["Wie viel Wasser steckt in einem Kilo Rindfleisch?","Etwa 15 000 Liter, wenn man Futter und Aufzucht mitrechnet."],["Wie viele Bl\xFCten braucht eine Biene f\xFCr ein Glas Honig?","Rund zwei Millionen. Das Volk fliegt daf\xFCr eine Strecke wie dreimal um die Erde."],["Wie schnell f\xE4llt ein Regentropfen?","20 bis 30 km/h. Gr\xF6\xDFere Tropfen fallen schneller als kleine."],["Wie lange dauert ein Flug zum Mars?","Sechs bis neun Monate, je nachdem wie die Planeten zueinander stehen."],["Wie viele Sterne hat unsere Milchstra\xDFe?","Sch\xE4tzungen reichen von 100 bis 400 Milliarden."]])},{category:"Zum Staunen",subject:"Tiere",name:"Erstaunliches aus dem Tierreich",flang:"de-DE",blang:"de-DE",cards:B([["Warum ertrinkt ein Delfin nicht im Schlaf?","Es schl\xE4ft immer nur eine Gehirnh\xE4lfte. Die andere h\xE4lt wach und steuert das Auftauchen zum Atmen."],["Wie oft schl\xE4gt ein Kolibri pro Sekunde mit den Fl\xFCgeln?","Bis zu 80 Mal.","So schnell, dass man sie nicht mehr einzeln sieht \u2014 daher das Summen. Der Kolibri kann dadurch auf der Stelle stehen und sogar r\xFCckw\xE4rts fliegen. Sein Herz schl\xE4gt dabei \xFCber 1000 Mal pro Minute."],["Welche Tiere haben blaues Blut?","Tintenfische und Krebse. Ihr Sauerstofftr\xE4ger enth\xE4lt Kupfer statt Eisen."],["Warum sind Flamingos rosa?","Durch Farbstoffe aus Algen und kleinen Krebsen im Futter. Ohne diese Nahrung werden sie blass."],["Wie schwer ist die Zunge eines Blauwals?","So schwer wie ein ausgewachsener Elefant."],["Wie viele Z\xE4hnchen hat eine Schnecke?","\xDCber 10 000 winzige auf ihrer Raspelzunge \u2014 damit schabt sie Bl\xE4tter ab."],["Wie viel kann eine Ameise tragen?","Das Zehn- bis F\xFCnfzigfache ihres eigenen Gewichts."],["Warum l\xE4uft ein Gecko an einer Glasscheibe hoch?","Millionen feinster H\xE4rchen an den F\xFC\xDFen erzeugen winzige Anziehungskr\xE4fte \u2014 kein Klebstoff, reine Physik."],["Welches Tier kann sein Alter zur\xFCcksetzen?","Die Qualle Turritopsis dohrnii. Sie kann in ein fr\xFCheres Lebensstadium zur\xFCckkehren."],["Welches Tier ist das schnellste der Welt?","Der Wanderfalke \u2014 im Sturzflug \xFCber 300 km/h."],["Warum bekommt ein Specht keine Kopfschmerzen?","Sein Sch\xE4del federt den Aufprall ab, und das Zungenbein liegt wie ein Gurt um das Gehirn."],["Wie viele Muskeln hat ein Elefantenr\xFCssel?","Etwa 40 000. Damit kann er einen Baum umwerfen und eine Erdnuss aufheben."],["Wie lange kommt ein Kamel ohne Wasser aus?","Ein bis zwei Wochen. Danach trinkt es bis zu 100 Liter in wenigen Minuten."],["Warum leuchten Gl\xFChw\xFCrmchen?","Durch eine chemische Reaktion, die fast keine W\xE4rme erzeugt \u2014 kaltes Licht mit riesigem Wirkungsgrad."],["Wozu dienen die Streifen des Zebras?","Sie verwirren stechende Fliegen und l\xF6sen in der Herde die Umrisse des einzelnen Tieres auf."],["Wie gut riecht ein Eisb\xE4r?","Er wittert eine Robbe \xFCber einen Kilometer weit und sogar unter einer Eisschicht."],["K\xF6nnen K\xFChe Freundschaften schlie\xDFen?","Ja. Bei ihrer bevorzugten Partnerin sinkt messbar der Stresspegel."],["Welches Tier hat den gr\xF6\xDFten Augapfel?","Der Riesenkalmar \u2014 sein Auge ist so gro\xDF wie ein Fu\xDFball."],["Warum k\xF6nnen Katzen im Dunkeln so gut sehen?","Eine Spiegelschicht hinter der Netzhaut wirft das Licht ein zweites Mal zur\xFCck. Deshalb leuchten ihre Augen im Scheinwerfer."],["Wie verst\xE4ndigen sich Bienen \xFCber Futterpl\xE4tze?","Mit einem Schw\xE4nzeltanz. Richtung und Dauer verraten Winkel zur Sonne und Entfernung."]])},{category:"Zum Staunen",subject:"Alltag erkl\xE4rt",name:"Warum ist das eigentlich so?",flang:"de-DE",blang:"de-DE",cards:B([["Warum knallt es beim Gewitter?","Der Blitz heizt die Luft schlagartig auf \xFCber 20 000 Grad. Sie dehnt sich explosionsartig aus \u2014 das ist der Donner."],["Wie weit ist ein Gewitter entfernt?","Sekunden zwischen Blitz und Donner z\xE4hlen und durch 3 teilen. Das Ergebnis sind Kilometer."],["Warum ist Schnee wei\xDF, Eis aber durchsichtig?","Schnee besteht aus unz\xE4hligen kleinen Kristallen. Sie streuen alle Farben gleichm\xE4\xDFig zur\xFCck."],["Warum schwimmt ein Schiff aus Stahl?","Weil es mehr Wasser verdr\xE4ngt, als es selbst wiegt. Entscheidend ist die Form, nicht das Material."],["Warum sieht man im Winter den Atem?","Warme, feuchte Atemluft k\xFChlt schlagartig ab. Der Wasserdampf wird zu winzigen Tr\xF6pfchen."],["Warum kocht Wasser am Berg schon unter 100 Grad?","Weil der Luftdruck geringer ist. Das Ei braucht dort oben trotzdem l\xE4nger."],["Warum brennt Chili im Mund?","Der Stoff Capsaicin reizt genau jene Nerven, die sonst Hitze melden. Das Gehirn glaubt an Feuer."],["Was hilft besser gegen Sch\xE4rfe: Wasser oder Milch?","Milch. Capsaicin l\xF6st sich in Fett, nicht in Wasser \u2014 Wasser verteilt es nur."],["Warum weint man beim Zwiebelschneiden?","Die verletzte Zelle setzt eine Schwefelverbindung frei, die mit der Augenfl\xFCssigkeit einen Reizstoff bildet."],["Warum sind Seifenblasen bunt?","Licht spiegelt sich an Vorder- und R\xFCckseite der hauchd\xFCnnen Haut. Die Wellen \xFCberlagern sich und verst\xE4rken einzelne Farben."],["Warum fliegt ein Flugzeug?","Der Fl\xFCgel lenkt Luft nach unten ab. Als Gegenkraft dr\xFCckt es die Maschine nach oben."],["Warum wird ein geparktes Auto so hei\xDF?","Sonnenlicht kommt durch die Scheiben herein, die W\xE4rmestrahlung aber kaum wieder hinaus \u2014 Treibhauseffekt im Kleinen."],["Warum knacken Fingergelenke?","In der Gelenkfl\xFCssigkeit platzt ein Gasbl\xE4schen. Es dauert etwa 20 Minuten, bis es sich neu bildet."],["Warum wird manchen im Auto schlecht?","Das Gleichgewichtsorgan meldet Bewegung, die Augen im Innenraum melden Stillstand. Der Widerspruch macht \xFCbel."],["Warum ist Meerwasser salzig?","Fl\xFCsse l\xF6sen Salze aus Gestein und tragen sie ins Meer. Wasser verdunstet, das Salz bleibt und sammelt sich \xFCber Jahrmillionen."],["Woher kommt Schluckauf?","Das Zwerchfell zuckt unwillk\xFCrlich, die Stimmritze schnappt zu. Das typische Hicks ist dieses Zuschnappen."],["Warum werden Bl\xE4tter im Herbst bunt?","Der Baum holt das gr\xFCne Chlorophyll zur\xFCck. \xDCbrig bleiben gelbe und rote Farbstoffe, die vorher \xFCberdeckt waren."],["Warum sind Golfb\xE4lle nicht glatt?","Die Dellen halten die Luftstr\xF6mung am Ball und verkleinern den Sog dahinter. Er fliegt dadurch fast doppelt so weit wie ein glatter."],["Warum haben Flugzeugfenster runde Ecken?","An eckigen Ecken sammelt sich die Materialspannung. In den 1950ern f\xFChrte das zu Abst\xFCrzen \u2014 seither sind sie rund."],["Warum hallt es in einem leeren Zimmer?","Ohne M\xF6bel, Teppiche und Vorh\xE4nge wird der Schall von den kahlen W\xE4nden immer wieder zur\xFCckgeworfen."]])},{category:"Zum Staunen",subject:"Unglaublich",name:"Kaum zu glauben, aber wahr",flang:"de-DE",blang:"de-DE",cards:B([["Lebte Kleopatra n\xE4her an der Mondlandung oder am Bau der Cheops-Pyramide?","An der Mondlandung. Zwischen ihr und dem Pyramidenbau liegen mehr Jahre als zwischen ihr und uns."],["Wie lange dauert ein Tag auf der Venus?","L\xE4nger als ihr Jahr: 243 Erdtage Drehung gegen\xFCber 225 Tagen Umlauf um die Sonne."],["Warum ist Pluto kein Planet mehr?","Seit 2006 gilt er als Zwergplanet \u2014 er hat seine Umlaufbahn nicht von anderen Objekten freiger\xE4umt."],["Welches Land hat keinen einzigen dauerhaften Fluss?","Saudi-Arabien. Wasser kommt aus Brunnen und Meerwasserentsalzung."],["Wie viele Zeitzonen hat Russland?","Elf. Wenn im Westen die Schule beginnt, ist im Osten schon Abend."],["Welche Stadt hat mehr Br\xFCcken als Venedig und Amsterdam zusammen?","Hamburg \u2014 \xFCber 2500 St\xFCck."],["Wie alt ist das \xE4lteste noch existierende Unternehmen der Welt?","\xDCber 1400 Jahre. Eine japanische Baufirma wurde im Jahr 578 gegr\xFCndet."],["Welche Gem\xFCse sind botanisch eigentlich Fr\xFCchte?","Tomate, Gurke, Paprika, Zucchini und K\xFCrbis \u2014 alle enthalten Samen."],["Wie schnell wachsen Fingern\xE4gel?","Etwa 3,5 Millimeter im Monat. Zehenn\xE4gel brauchen f\xFCr dieselbe Strecke fast viermal so lang."],["Wie viel Zeit verschl\xE4ft ein Mensch im Leben?","Rund ein Drittel \u2014 bei 75 Jahren sind das etwa 25 Jahre."],["Wie oft schl\xE4gt ein Herz in einem ganzen Leben?","Etwa drei Milliarden Mal, ohne eine einzige Pause."],["Wie viel Gold wurde in der ganzen Menschheitsgeschichte gef\xF6rdert?","Alles zusammengeschmolzen erg\xE4be einen W\xFCrfel mit etwa 22 Metern Kantenl\xE4nge."],["Wie viel Rechenleistung hatte der Computer der Mondlandung?","Weniger als ein einfacher Taschenrechner heute. Er hatte etwa 64 Kilobyte Speicher."],["Wie schwer war das erste Mobiltelefon?","Fast ein Kilogramm, und der Akku hielt eine halbe Stunde Gespr\xE4ch."],["Woher hat die Achterbahn ihren Namen?","Fr\xFChe Bahnen waren als liegende Acht gebaut."],["Wie viele W\xF6rter hat die deutsche Sprache?","Der Duden f\xFChrt rund 150 000. Der gesamte Wortschatz wird auf mehrere Hunderttausend gesch\xE4tzt."],["Was passiert mit einem Menschen ohne Schwerkraft?","Er wird im All ein paar Zentimeter gr\xF6\xDFer, weil sich die Bandscheiben entspannen."],["Wie viel Prozent des menschlichen K\xF6rpers ist Wasser?","Etwa 60 Prozent bei Erwachsenen, bei Babys sogar rund 75."],["Warum sieht man auf alten Fotos niemanden lachen?","Die Belichtung dauerte Minuten. Ein L\xE4cheln so lange zu halten war unm\xF6glich."],["Wie lange gibt es die Kartoffel schon in Europa?","Erst seit dem 16. Jahrhundert. Davor kannte niemand hier Pommes oder Erd\xE4pfelsalat."]])},{category:"Zum Staunen",subject:"Knobeln",name:"Knobelfragen f\xFCr unterwegs",flang:"de-DE",blang:"de-DE",cards:B([["Zwei V\xE4ter und zwei S\xF6hne fahren fischen. Jeder f\xE4ngt einen Fisch, zusammen sind es drei. Wie geht das?","Es sind nur drei Personen: Gro\xDFvater, Vater und Sohn. Der Vater ist beides zugleich."],["Was wird nasser, je mehr es trocknet?","Das Handtuch."],["Ein Zug f\xE4hrt nach Norden, der Wind weht nach S\xFCden. In welche Richtung zieht der Rauch?","Gar nicht \u2014 es ist eine Elektrolok."],["Wie oft kann man 25 von 100 abziehen?","Genau einmal. Danach zieht man es von 75 ab."],["Ein Bauer hat 17 Schafe. Alle bis auf 9 laufen weg. Wie viele bleiben?","Neun. Die Frage klingt nur nach Rechnung."],["Was hat einen Hals, aber keinen Kopf?","Die Flasche."],["Was geht nach oben, kommt aber nie wieder herunter?","Das Alter."],["Was ist schwerer: ein Kilo Federn oder ein Kilo Blei?","Beides gleich schwer. Nur das Volumen ist v\xF6llig verschieden."],["F\xFCnf Maschinen brauchen 5 Minuten f\xFCr 5 Teile. Wie lange brauchen 100 Maschinen f\xFCr 100 Teile?","Auch 5 Minuten. Jede Maschine schafft ein Teil in 5 Minuten."],["Seerosen verdoppeln sich t\xE4glich. Nach 48 Tagen ist der See voll. Wann war er halb voll?","Am 47. Tag. Verdopplung hei\xDFt: der letzte Schritt macht die H\xE4lfte aus."],["Schl\xE4ger und Ball kosten zusammen 1,10 \u20AC. Der Schl\xE4ger kostet 1 \u20AC mehr als der Ball. Was kostet der Ball?","5 Cent. Bei 10 Cent w\xE4re die Differenz nur 90 Cent."],["Was geh\xF6rt dir, wird aber fast immer von anderen benutzt?","Dein Name."],["Wie viele Monate haben 28 Tage?","Alle zw\xF6lf \u2014 jeder Monat hat mindestens 28."],["Ein Arzt gibt dir drei Tabletten, alle halbe Stunde eine. Wie lange reichen sie?","Eine Stunde. Die erste nimmst du sofort."],["Was ist leichter als eine Feder, und trotzdem kann es niemand lange halten?","Der Atem."],["Vater und Sohn verungl\xFCcken. Der Chirurg sagt: Das ist mein Sohn, ich kann nicht operieren. Wie geht das?","Der Chirurg ist die Mutter. Die meisten stolpern nur \xFCber ihr eigenes Bild im Kopf."],["Was geht am Morgen auf vier Beinen, mittags auf zwei und abends auf drei?","Der Mensch: krabbelnd, gehend, und im Alter mit Stock. Das R\xE4tsel der Sphinx."],["Wie viele Geburtstage hat ein Mensch?","Genau einen. Alle weiteren sind Jahrestage davon."],["Was kann man nie zum Fr\xFChst\xFCck essen?","Mittag- und Abendessen."],["Ein Mann wohnt im zehnten Stock. Nach oben f\xE4hrt er nur bis zum siebten und geht den Rest. Au\xDFer wenn es regnet. Warum?","Er ist zu klein f\xFCr den obersten Knopf. Bei Regen hat er einen Schirm dabei."]])},{category:"Zum Staunen",subject:"Smalltalk",name:"Fakten f\xFCrs Smalltalk",flang:"de-DE",blang:"de-DE",cards:B([["Wie viele Herzen hat ein Krake?","Drei \u2014 zwei f\xFCr die Kiemen, eins f\xFCr den K\xF6rper."],["Welcher Planet dreht sich r\xFCckw\xE4rts?","Die Venus \u2014 die Sonne geht dort im Westen auf."],["Wie lange dauerte der k\xFCrzeste Krieg der Geschichte?","Rund 38 Minuten (England\u2013Sansibar, 1896)."],["Kann Honig schlecht werden?","Praktisch nie \u2014 er h\xE4lt \xFCber Jahrtausende."],["Wie viele Knochen hat ein erwachsener Mensch?","206."],["Bananen sind botanisch gesehen \u2026?","Beeren. Erdbeeren dagegen nicht."],["Welche Farbe hat ein Sonnenuntergang auf dem Mars?","Bl\xE4ulich."],["Wie alt kann ein Gr\xF6nlandhai werden?","\xDCber 250, wom\xF6glich 400 Jahre."],["Wie viele Sprachen gibt es weltweit?","Rund 7.000."],["Warum ist der Himmel blau?","Blaues Licht wird von der Luft am st\xE4rksten gestreut (Rayleigh-Streuung).","Sonnenlicht enth\xE4lt alle Farben. Die kurzen blauen Wellen prallen an den winzigen Luftteilchen ab und verteilen sich \xFCber den ganzen Himmel \u2014 deshalb kommt Blau aus allen Richtungen. Beim Sonnenuntergang nimmt das Licht einen l\xE4ngeren Weg durch die Luft, dann ist das Blau unterwegs schon weggestreut und Rot bleibt \xFCbrig."],["Wie schwer ist eine mittlere Sch\xF6nwetterwolke?","Mehrere hundert Tonnen Wasser."],["Welches Land hat die meisten Zeitzonen?","Frankreich \u2014 12, dank der \xDCberseegebiete."],["Wie schnell rennt ein Gepard?","Bis zu 100\u2013120 km/h."],["Was war zuerst da: die Uni Oxford oder das Aztekenreich?","Oxford \u2014 es lehrte schon um 1096."],["Wie viele Menschen haben heute Geburtstag?","Rund 21 Millionen (etwa 1/365 der Menschheit)."],["Welches Organ erneuert sich am schnellsten?","Die Darmschleimhaut \u2014 alle paar Tage."]])}],Je=[.4197,1.1869,3.0412,15.2441,7.1434,.6477,1.0007,.0674,1.6597,.1712,1.1178,2.0225,.0904,.3025,2.1214,.2498,2.9466],qg=-.5,Yg=19/81,Gv=.9,Qg=e=>Math.min(10,Math.max(1,e)),Uv=e=>Math.max(.1,Je[e-1]),Xg=e=>Qg(Je[4]-Math.exp(Je[5]*(e-1))+1),Cv=(e,n)=>Math.pow(1+Yg*e/n,qg),Hv=(e,n)=>Qg(Je[7]*Xg(4)+(1-Je[7])*(e-Je[6]*(n-3))),Lv=(e,n,t,i)=>{let a=i===2?Je[15]:1,r=i===4?Je[16]:1,s=Math.exp(Je[8])*(11-e)*Math.pow(n,-Je[9])*(Math.exp((1-t)*Je[10])-1)*a*r;return Math.max(.1,n*(1+s))},Ov=(e,n,t)=>{let i=Je[11]*Math.pow(e,-Je[12])*(Math.pow(n+1,Je[13])-1)*Math.exp((1-t)*Je[14]);return Math.max(.1,Math.min(i,n))},zg=e=>Math.min(3650,Math.max(1,Math.round(e/Yg*(Math.pow(Gv,1/qg)-1))));function wr(e,n,t){if(e.s==null){let u=Uv(n),c=Xg(n);return{s:u,d:c,intervalDays:zg(u)}}let i=Math.max(0,(t-(e.last||t))/Qt),a=Cv(i,e.s),r=Hv(e.d,n),s=n===1?Ov(e.d,e.s,a):Lv(e.d,e.s,a,n);return{s,d:r,intervalDays:zg(s)}}var cs=e=>!e.due||e.due<=Date.now(),oa="rueck",fd=(e,n)=>n===oa?e.rueck||{}:e,yg=(e,n)=>cs(fd(e,n)),Jg=e=>!!e&&(e.cards||[]).some(n=>n.flang&&n.blang&&n.flang!==n.blang),sd=e=>e&&e.beide&&Jg(e)?["vor",oa]:["vor"],kr=e=>(e.cards||[]).flatMap(n=>sd(e).map(t=>({karte:n,richtung:t,stand:fd(n,t)}))),Rg=e=>kr(e).filter(n=>cs(n.stand)).length;function Sg(e){if(e=Math.max(1,Math.round(e)),e===1)return"morgen";if(e<7)return`in ${e} Tagen`;if(e<30){let t=Math.round(e/7);return t<=1?"in 1 Woche":`in ${t} Wochen`}if(e<365){let t=Math.round(e/30);return t<=1?"in 1 Monat":`in ${t} Monaten`}let n=e/365;return n<1.5?"in 1 Jahr":`in ${Math.round(n)} Jahren`}function ha(e){return e.s==null?"neu":e.s<7?"lernend":e.s<30?"jung":e.s<180?"reif":"fest"}var ud=[{key:"frisch",label:"frisch",quellen:["neu","lernend"]},{key:"kommt",label:"sitzt langsam",quellen:["jung","reif"]},{key:"fest",label:"sitzt fest",quellen:["fest"]}],as=e=>ud.find(n=>n.quellen.includes(ha(e)))||ud[0],xg={frisch:0,kommt:1,fest:2};function jv(e){let n={v:1,name:e.name,cards:e.cards.map(t=>{let i={f:t.front,b:t.back,fl:t.flang,bl:t.blang};return t.warum&&(i.w=t.warum),i})};return"KBX1:"+btoa(encodeURIComponent(JSON.stringify(n)))}function Fv(e){let n=e.trim().replace(/^KBX1:/,""),t=JSON.parse(decodeURIComponent(atob(n)));return{id:Ve(),name:t.name||"Geteilte Kartei",cards:(t.cards||[]).map(i=>({id:Ve(),front:i.f,back:i.b,warum:i.w||"",flang:i.fl||"en-US",blang:i.bl||"de-DE",due:0}))}}var Zv=B([["Was sind Bloop Cards?","Lernkarten mit drei Seiten statt zwei: Frage, kurze Antwort \u2014 und dahinter eine Erkl\xE4rung, wenn man sie braucht.","Gew\xF6hnliche Karteikarten zwingen zur K\xFCrze: Steht auf der R\xFCckseite ein Absatz, pr\xFCft man nicht mehr ehrlich, ob man es wusste, sondern liest. Kurz muss die Antwort trotzdem sein \u2014 nur reicht Kurz nicht immer zum Verstehen. Die dritte Seite l\xF6st diesen Widerspruch: Die Antwort bleibt knapp und abrufbar, das Warum steht dahinter und erscheint nur auf Wunsch (nach oben wischen oder antippen)."],["Warum hei\xDFt die App Bloop?","Von Buddy und Loop \u2014 der Begleiter und die Schleife, in der eine Karte zur\xFCckkommt.","Wir nennen die Methode bloopen: Die Karten tauchen immer wieder auf, bis man sie kann. Den Namen gibt es \xFCbrigens wirklich \u2014 1997 zeichneten Messstationen im S\xFCdpazifik ein Ger\xE4usch auf, das lauter war als jedes bekannte Tier. Es stellte sich als Eisbeben heraus."],["Welche Daten sammelt die App \xFCber mein Kind?","Keine. Es gibt kein Konto, keine Anmeldung, keine Analytik und keinen Server, an den etwas ginge. Alles liegt im Speicher des Ger\xE4ts. Auch die Schriften liegen lokal \u2014 es geht nicht einmal eine Anfrage an Google hinaus."],["Wie finanziert sich das dann?","Auf der Erwachsenenseite: einmalig ein kleiner Betrag, dazu Patenschaften f\xFCr Schulen. Auf der Kinderseite flie\xDFt kein Geld und l\xE4uft keine Werbung. Kinder sind hier nicht die Ware."],["Was h\xE4lt ein Kind bei der Stange?","Nichts. Das ist Absicht. Keine Serien, keine Punkte, keine Abzeichen, keine Erinnerungen, die ein schlechtes Gewissen machen. Eine Einheit darf enden, und wer eine Woche nicht kommt, findet nichts Kaputtes vor."],["Ist das nicht naiv? Kinder brauchen doch Motivation.","Die Selbstbestimmungstheorie nennt drei Quellen: Autonomie, Kompetenz, Verbundenheit. Belohnungsschleifen bedienen keine davon \u2014 sie ersetzen sie. Wir setzen auf sichtbaren Fortschritt (Kompetenz) und darauf, dass das Kind Tempo und Reihenfolge selbst bestimmt (Autonomie)."],["Nach welchem Lernprinzip arbeitet sie?","Verteiltes Wiederholen mit aktivem Abruf. Ein Ged\xE4chtnismodell (FSRS) sch\xE4tzt f\xFCr jede Karte, wann sie zu verblassen beginnt, und legt sie kurz davor wieder vor. Der Effekt ist einer der am besten belegten der Lernforschung."],["Warum sieht mein Kind nicht, wie viel es noch aufholen m\xFCsste?","Weil ein Berg von 300 offenen Karten niemanden ans Lernen bringt. Eine Einheit ist auf 20 Karten gedeckelt. Gezeigt werden nur Zahlen, die wachsen k\xF6nnen \u2014 was fallen kann, bestraft die R\xFCckkehr."],["Kann mein Kind mit Fremden in Kontakt kommen?","Nein. Es gibt keinen Feed, keine Profile, kein Folgen, keine Nachrichten und keine Kommentare. Karteien lassen sich als Code weitergeben \u2014 an Menschen, die man kennt, und der Code wird au\xDFerhalb der App verschickt."],["Kann sie im Unterricht eingesetzt werden?","Ja. Eine Lehrkraft baut eine Kartei und gibt den Code an die Klasse. Es braucht keine Konten, keine Lizenzverwaltung und keine Einverst\xE4ndniserkl\xE4rungen f\xFCr die Datenverarbeitung \u2014 es findet keine statt."],["Wie steht es um Barrierefreiheit?","Alle Farbkombinationen sind auf 4,5:1 gepr\xFCft, in hell und dunkel. Bedienen geht per Tastatur, Beschriftungen sind f\xFCr Screenreader gesetzt, und wer im System weniger Bewegung eingestellt hat, bekommt keine Animationen."],["Was ist mit Kindern, die sich schwer konzentrieren?","Es gibt ein zuschaltbares gleichm\xE4\xDFiges Rauschen, das Umgebungsl\xE4rm \xFCberdeckt. Sonst: kurze Einheiten, eine Handlung pro Bildschirm, keine blinkenden Belohnungen, die den Faden zerrei\xDFen."],["Wo sind die Schw\xE4chen? Bitte ehrlich.","Drei. Erstens: Geht das Ger\xE4t verloren, sind die Karten weg \u2014 kein Konto hei\xDFt auch kein Backup. Zweitens: Wer die App gar nicht \xF6ffnet, wird an nichts erinnert; das ist gewollt, aber es ist eine Wette. Drittens: Verbundenheit, die dritte Motivationsquelle, ist kaum bedient \u2014 bewusst, weil jede Antwort darauf ein Netzwerk w\xE4re."],["F\xFCr welches Alter ist sie gedacht?","Zehn bis achtzehn. Das ist ehrlich gesagt eine gro\xDFe Spanne: Was Zehnj\xE4hrige ansprechend finden, wirkt auf Sechzehnj\xE4hrige kindisch. Deshalb der dunkle Modus und die Farbwahl \u2014 und deshalb ist das ein Punkt, an dem wir noch arbeiten."],["Was, wenn ich Ihnen widerspreche?","Dann interessiert uns das mehr als Zustimmung. Diese App wird von wenigen Leuten gebaut, ohne Marktforschungsabteilung. Fachlicher Widerspruch ist das Wertvollste, was wir bekommen k\xF6nnen."]]),Vv=[["Englisch","A1 \xB7 Alltag & H\xF6flichkeit"],["Mathematik","Terme & Gleichungen"],["Biologie","Verdauung & Ern\xE4hrung"]],Dg=()=>[...Vv.map(([n,t])=>Yn.find(i=>i.subject===n&&i.name===t)).filter(Boolean).map(n=>({id:Ve(),name:n.subject+" \xB7 "+n.name,recall:n.recall!==!1,cards:n.cards.map(t=>({id:Ve(),front:t.f,back:t.b,warum:t.w||"",flang:n.flang,blang:n.blang||"de-DE",due:0}))})),{id:Ve(),name:"F\xFCr Fachleute \xB7 Fragen & Antworten",recall:!1,resting:!0,cards:Zv.map(n=>({id:Ve(),front:n.f,back:n.b,warum:n.w||"",flang:"de-DE",blang:"de-DE",due:0}))}];function _v(){let[e,n]=(0,l.useState)([]);return(0,l.useEffect)(()=>{if(typeof window>"u"||!window.speechSynthesis)return;let i=()=>n(window.speechSynthesis.getVoices()||[]);return i(),window.speechSynthesis.onvoiceschanged=i,()=>{try{window.speechSynthesis.onvoiceschanged=null}catch{}}},[]),{speak:(0,l.useCallback)((i,a)=>{if(typeof window>"u"||!window.speechSynthesis||!i)return;window.speechSynthesis.cancel();let r=new SpeechSynthesisUtterance(i);r.lang=a||"de-DE";let s=(a||"de").slice(0,2).toLowerCase(),u=e.filter(d=>d.lang&&d.lang.toLowerCase().startsWith(s)),c=d=>/(google|natural|premium|enhanced|neural|siri)/i.test(d.name)?0:1;u.sort((d,b)=>c(d)-c(b)),u[0]&&(r.voice=u[0]),r.rate=.92,r.pitch=1,window.speechSynthesis.speak(r)},[e]),supported:typeof window<"u"&&!!window.speechSynthesis}}function qv(e,n){if(n==="white"){for(let d=0;d<e.length;d++)e[d]=Math.random()*2-1;return}if(n==="brown"){let d=0;for(let b=0;b<e.length;b++){let m=Math.random()*2-1;d=(d+.02*m)/1.02,e[b]=d*3.2}return}let t=0,i=0,a=0,r=0,s=0,
