 dreht das Vorzeichen: aus \u2212(\u22122) wird +2."],["Was bedeutet der Betrag |\u22129|?","9 \u2014 der Abstand zur Null. Ein Abstand ist nie negativ."],["Welche Zahl ist gr\xF6\xDFer: \u22128 oder \u22123?","\u22123. Bei negativen Zahlen ist die mit dem kleineren Betrag die gr\xF6\xDFere."],["(\u221212) : (\u22123) = ?","4. Gleiche Vorzeichen ergeben ein positives Ergebnis."],["(\u221212) : 3 = ?","\u22124. Verschiedene Vorzeichen ergeben ein negatives Ergebnis."],["Es hat 4 \xB0C und wird um 9 Grad k\xE4lter. Wie kalt ist es?","\u22125 \xB0C, denn 4 \u2212 9 = \u22125. Der Zahlenstrahl geht unter null weiter."],["Was ist die Gegenzahl von \u22122,5?","+2,5. Eine Zahl und ihre Gegenzahl ergeben zusammen immer 0."],["(\u22122)\xB3 = ?","\u22128. Drei Minus-Faktoren, also eine ungerade Anzahl \u2014 das Ergebnis bleibt negativ."],["(\u22122)\u2074 = ?","+16. Vier Minus-Faktoren, also eine gerade Anzahl \u2014 sie heben sich paarweise auf."],["Kontostand \u2212120 \u20AC, dann kommen 200 \u20AC rein. Wie steht es?","+80 \u20AC, denn \u2212120 + 200 = 80. Zuerst wird das Loch gef\xFCllt."],["Warum gilt a \u2212 b = a + (\u2212b)?","Subtrahieren hei\xDFt: die Gegenzahl addieren. So braucht man am Ende nur noch eine einzige Rechenart."],["Ordne der Gr\xF6\xDFe nach: \u22125; 0,5; \u22120,5; 5","\u22125 < \u22120,5 < 0,5 < 5. Je weiter links am Zahlenstrahl, desto kleiner."]])},{category:"3. Klasse Gymnasium",subject:"Mathematik",name:"Terme & Gleichungen",flang:"de-DE",blang:"de-DE",cards:_([["Was unterscheidet einen Term von einer Gleichung?","Ein Term ist ein Rechenausdruck wie 3x + 2. Eine Gleichung behauptet, dass zwei Terme gleich sind: 3x + 2 = 11."],["Fasse zusammen: 5a + 3b \u2212 2a + b","3a + 4b. Zusammenfassen darf man nur, was dieselbe Variable hat."],["Warum darf man 5a und 3b nicht addieren?","Weil es verschiedene Dinge sind \u2014 wie 5 \xC4pfel und 3 Birnen. Man kann sie nur nebeneinander stehen lassen."],["L\xF6se: 3x + 2 = 11","x = 3. Erst auf beiden Seiten \u22122, dann beide Seiten :3."],["Was ist mit dem Waage-Modell gemeint?","Eine Gleichung ist eine Waage im Gleichgewicht. Was du links tust, musst du rechts genauso tun, sonst kippt sie."],["L\xF6se: 4(x \u2212 2) = 12","x = 5. Entweder ausmultiplizieren zu 4x \u2212 8 = 12, oder gleich beide Seiten durch 4 teilen."],["Multipliziere aus: 3(2x + 5)","6x + 15. Der Faktor vor der Klammer trifft jeden Summanden darin."],["Hebe heraus: 6x + 9","3(2x + 3). Der gr\xF6\xDFte gemeinsame Faktor ist 3."],["Wo steckt der Fehler: 2x + 3x = 6x?","Falsch, richtig ist 5x. Beim Addieren z\xE4hlt man die St\xFCcke zusammen, man multipliziert sie nicht."],["Warum ist 2x + 3x = 5x, aber 2x \xB7 3x = 6x\xB2?","Beim Addieren bleibt es bei x-St\xFCcken. Beim Multiplizieren treffen auch die x aufeinander, daraus wird x\xB2."],["Setze x = \u22122 ein in 3x\xB2 \u2212 x","14. Denn 3 \xB7 4 = 12, und minus (\u22122) hei\xDFt plus 2."],["Wie pr\xFCfst du, ob deine L\xF6sung stimmt?","Einsetzen in die urspr\xFCngliche Gleichung. Kommt links und rechts dasselbe heraus, passt es."],["\xDCbersetze: Das Doppelte einer Zahl, vermindert um 5, ergibt 9.","2x \u2212 5 = 9, also x = 7. Erst den Text in Symbole \xFCbersetzen, dann rechnen."],["L\xF6se: x/4 = 7","x = 28. Beide Seiten mal 4 \u2014 Teilen macht man durch Malnehmen r\xFCckg\xE4ngig."]])},{category:"3. Klasse Gymnasium",subject:"Mathematik",name:"Prozent & Zinsen",flang:"de-DE",blang:"de-DE",cards:_([["Was bedeutet 1 %?","Ein Hundertstel, also 1 von 100 Teilen oder 0,01."],["25 % von 80 = ?","20. Denn 25 % ist ein Viertel, und 80 : 4 = 20."],["Wie berechnest du den Prozentwert allgemein?","Grundwert mal Prozentsatz durch 100. Beispiel: 200 \xB7 15 : 100 = 30."],["Ein Pulli kostet 60 \u20AC, es gibt 20 % Rabatt. Was zahlst du?","48 \u20AC. 20 % von 60 sind 12 \u20AC, also 60 \u2212 12."],["Wie rechnest du 20 % Rabatt in einem einzigen Schritt?","Mal 0,8 \u2014 du zahlst ja noch 80 %. Also 60 \xB7 0,8 = 48."],["Ein Preis steigt von 50 \u20AC auf 60 \u20AC. Um wie viel Prozent?","20 %. Die \xC4nderung von 10 \u20AC wird durch den ALTEN Wert geteilt: 10 : 50 = 0,2."],["Warum ist +10 % und danach \u221210 % nicht wieder der Startwert?","Weil sich der Grundwert \xE4ndert: 100 \u2192 110 \u2192 99. Prozente beziehen sich immer auf den aktuellen Wert."],["Was ist der Grundwert?","Das Ganze, also die 100 % \u2014 die Zahl, auf die sich der Prozentsatz bezieht."],["500 \u20AC zu 3 % pro Jahr. Wie viel Zinsen nach einem Jahr?","15 \u20AC, denn 500 \xB7 3 : 100."],["Wie viel Zinsen bringen 500 \u20AC zu 3 % nach 4 Monaten?","5 \u20AC. Der Jahreszins von 15 \u20AC mal 4/12, weil nur ein Drittel des Jahres vergangen ist."],["Was ist Zinseszins?","Die Zinsen bleiben liegen und werden selbst verzinst. Deshalb w\xE4chst Geld mit der Zeit schneller als gleichm\xE4\xDFig."],["Netto 200 \u20AC, dazu 19 % Mehrwertsteuer. Brutto?","238 \u20AC, denn 200 \xB7 1,19."],["Brutto 119 \u20AC bei 19 % Mehrwertsteuer. Wie hoch ist netto?","100 \u20AC. Achtung: nicht 19 % abziehen, sondern durch 1,19 teilen."],["Warum ergeben 20 % plus nochmal 20 % Rabatt nicht 40 %?","Der zweite Rabatt greift auf den bereits gesenkten Preis. Zusammen sind es 36 %."]])},{category:"3. Klasse Gymnasium",subject:"Mathematik",name:"Fl\xE4chen, K\xF6rper & Einheiten",flang:"de-DE",blang:"de-DE",cards:_([["Wie berechnest du die Fl\xE4che eines Dreiecks?","A = g \xB7 h : 2 \u2014 Grundlinie mal zugeh\xF6rige H\xF6he, halbiert."],["Warum steht in der Dreiecksformel das : 2?","Zwei gleiche Dreiecke ergeben zusammen genau ein Parallelogramm. Ein Dreieck ist also die H\xE4lfte davon."],["Rechteck 6 cm mal 4 cm \u2014 Fl\xE4che und Umfang?","A = 24 cm\xB2, Umfang = 20 cm. Fl\xE4che ist der Inhalt, Umfang die L\xE4nge des Randes."],["Was passiert mit der Fl\xE4che, wenn du beide Seiten verdoppelst?","Sie vervierfacht sich. Fl\xE4che w\xE4chst mit dem Quadrat des Faktors."],["Fl\xE4che eines Parallelogramms?","A = g \xB7 h. Wichtig: die H\xF6he steht senkrecht auf der Grundlinie, es ist nicht die schr\xE4ge Seite."],["Volumen eines Quaders?","V = L\xE4nge \xB7 Breite \xB7 H\xF6he, also Grundfl\xE4che mal H\xF6he."],["Volumen eines Prismas?","V = G \xB7 h \u2014 Grundfl\xE4che mal H\xF6he, egal welche Form die Grundfl\xE4che hat."],["Wie viele cm\xB3 sind 1 Liter?","1000 cm\xB3, das ist genau 1 dm\xB3 \u2014 ein W\xFCrfel mit 10 cm Kante."],["Wie viele cm\xB2 sind 1 m\xB2?","10 000 cm\xB2, denn 100 \xB7 100. Bei Fl\xE4chen z\xE4hlt der Umrechnungsfaktor doppelt."],["Oberfl\xE4che eines W\xFCrfels mit 5 cm Kante?","150 cm\xB2. Sechs Fl\xE4chen zu je 25 cm\xB2."],["Was ist der Unterschied zwischen Oberfl\xE4che und Volumen?","Die Oberfl\xE4che ist die Verpackung und wird in cm\xB2 gemessen, das Volumen ist der Inhalt in cm\xB3."],["Ein Becken misst 10 m \xB7 5 m \xB7 2 m. Wie viele Liter fasst es?","100 000 Liter. Das sind 100 m\xB3, und 1 m\xB3 entspricht 1000 Litern."],["Warum passt in einen W\xFCrfel mit doppelter Kante 8-mal so viel?","Weil das Volumen mit der dritten Potenz w\xE4chst: 2 \xB7 2 \xB7 2 = 8."]])},{category:"3. Klasse Gymnasium",subject:"Mathematik",name:"Proportionalit\xE4t & Dreisatz",flang:"de-DE",blang:"de-DE",cards:_([["Was hei\xDFt direkt proportional?","Doppelte Menge, doppelter Preis. Der Quotient aus beiden Gr\xF6\xDFen bleibt immer gleich."],["Was hei\xDFt indirekt proportional?","Doppelt so viele Arbeiter, halbe Zeit. Hier bleibt das Produkt der beiden Gr\xF6\xDFen gleich."],["3 kg \xC4pfel kosten 6 \u20AC. Was kosten 5 kg?","10 \u20AC. Erst auf 1 kg herunterrechnen (2 \u20AC), dann mal 5 \u2014 das ist der Dreisatz."],["4 Maler brauchen 6 Tage. Wie lange brauchen 3?","8 Tage. Die Arbeit umfasst 24 Manntage, geteilt durch 3 Maler."],["Woran erkennst du direkte Proportionalit\xE4t im Diagramm?","An einer Geraden, die durch den Ursprung geht."],["Ist der Zusammenhang von Alter und K\xF6rpergr\xF6\xDFe proportional?","Nein. Mit 20 ist niemand doppelt so gro\xDF wie mit 10. Gemeinsames Wachsen hei\xDFt nicht proportional."],["Ma\xDFstab 1 : 50 000 \u2014 3 cm auf der Karte sind wie viel in echt?","1,5 km, denn 3 \xB7 50 000 cm = 150 000 cm."],["Ein Rezept ist f\xFCr 4 Personen, du kochst f\xFCr 6. Womit multiplizierst du?","Mit 1,5 \u2014 jede Zutat mal 1,5."],["10 K\xFChe fressen einen Heuhaufen in 8 Tagen. Wie lange brauchen 20?","4 Tage. Mehr K\xFChe, weniger Zeit \u2014 indirekt proportional."],["Was bleibt bei indirekter Proportionalit\xE4t konstant?","Das Produkt der beiden Gr\xF6\xDFen, zum Beispiel Arbeiter mal Tage."],["Wie erkennst du beim Dreisatz, ob du mal oder geteilt rechnest?","Frag dich, ob das Ergebnis gr\xF6\xDFer oder kleiner werden muss. Bei indirekter Proportionalit\xE4t dreht sich die Rechnung um."],["Warum ist \u201Eje mehr, desto mehr\u201C noch keine Proportionalit\xE4t?","Proportional hei\xDFt: doppelt so viel f\xFChrt zu exakt doppelt so viel. Sonst w\xE4chst es nur irgendwie mit."]])},{category:"3. Klasse Gymnasium",subject:"Mathematik",name:"Statistik & Diagramme lesen",flang:"de-DE",blang:"de-DE",cards:_([["Was ist das arithmetische Mittel?","Der Durchschnitt: alle Werte addieren und durch die Anzahl teilen."],["Was ist der Median?","Der Wert genau in der Mitte, wenn man alle Werte der Gr\xF6\xDFe nach ordnet."],["Warum ist der Median oft aussagekr\xE4ftiger als der Durchschnitt?","Ein einziger Ausrei\xDFer zieht den Durchschnitt stark hoch, den Median dagegen kaum."],["Noten 1, 2, 2, 3, 5 \u2014 wie hoch ist der Mittelwert?","2,6. Die Summe ist 13, geteilt durch 5 Werte."],["Noten 1, 2, 2, 3, 5 \u2014 wie hoch ist der Median?","2. Es ist der dritte von f\xFCnf geordneten Werten."],["Was ist der Modus?","Der Wert, der am h\xE4ufigsten vorkommt."],["Was ist die Spannweite?","Gr\xF6\xDFter Wert minus kleinster Wert."],["Wof\xFCr eignet sich ein Kreisdiagramm?","F\xFCr Anteile an einem Ganzen. Alle Sektoren zusammen ergeben 100 %."],["Wof\xFCr eignet sich ein Liniendiagramm?","F\xFCr Entwicklungen \xFCber die Zeit."],["Wie kann ein Diagramm t\xE4uschen, ohne zu l\xFCgen?","Wenn die senkrechte Achse nicht bei null beginnt, wirken winzige Unterschiede riesig."],["Was ist eine relative H\xE4ufigkeit?","Ein Anteil statt einer Anzahl: 5 von 20 sind 0,25, also 25 %."],["Warum sagt \u201Edurchschnittlich 1,5 Kinder\u201C nichts \xFCber eine echte Familie?","Der Durchschnitt ist eine Rechengr\xF6\xDFe. Es gibt keine Familie mit einem halben Kind."]])},{category:"3. Klasse Gymnasium",subject:"Physik",name:"Strom, Spannung & Widerstand",flang:"de-DE",blang:"de-DE",cards:_([["Was flie\xDFt in einem Stromkreis eigentlich?","Elektronen. Sie sind schon im Draht vorhanden und werden von der Quelle nur in Bewegung gesetzt."],["Warum leuchtet eine Lampe sofort, obwohl Elektronen langsam sind?","Weil sich der Ansto\xDF fast mit Lichtgeschwindigkeit durch den Draht fortpflanzt \u2014 wie bei einer vollen Wasserleitung, die sofort spritzt."],["Was beschreibt die Spannung U?","Den Antrieb, gemessen in Volt. Bildlich: der H\xF6henunterschied, der das Wasser flie\xDFen l\xE4sst."],["Was beschreibt die Stromst\xE4rke I?","Wie viel Ladung pro Sekunde flie\xDFt, gemessen in Ampere. Bildlich: die Wassermenge pro Sekunde."],["Was beschreibt der Widerstand R?","Wie stark der Draht den Strom bremst, gemessen in Ohm. Bildlich: ein enges Rohr."],["Wie lautet das ohmsche Gesetz?","U = R \xB7 I. Mehr Spannung treibt mehr Strom, mehr Widerstand bremst ihn."],["12 V liegen an 4 \u03A9 an. Wie gro\xDF ist die Stromst\xE4rke?","3 A, denn I = U : R = 12 : 4."],["Was ist der Unterschied zwischen Reihen- und Parallelschaltung?","In Reihe flie\xDFt derselbe Strom durch alle Bauteile. Parallel liegt an allen dieselbe Spannung."],["Warum gehen bei einer alten Lichterkette alle Lampen aus, wenn eine kaputt ist?","Sie sind in Reihe geschaltet. Ein Defekt unterbricht den einzigen Weg f\xFCr den Strom."],["Warum sind Steckdosen im Haus parallel geschaltet?","Damit an jedem Ger\xE4t die vollen 230 V anliegen und ein Ger\xE4t abgeschaltet werden kann, ohne die anderen zu st\xF6ren."],["Wozu dient eine Sicherung?","Sie unterbricht den Kreis, wenn zu viel Strom flie\xDFt \u2014 sonst w\xFCrden die Leitungen hei\xDF und k\xF6nnten brennen."],["Warum ist ein Kurzschluss gef\xE4hrlich?","Der Strom nimmt den Weg fast ohne Widerstand. Die Stromst\xE4rke schie\xDFt hoch, die Leitung erhitzt sich schlagartig."],["Was ist elektrische Leistung?","P = U \xB7 I, gemessen in Watt. Sie sagt, wie viel Energie pro Sekunde umgesetzt wird."],["Warum sind Leiter aus Metall, Isolatoren aus Kunststoff?","In Metallen sind Elektronen frei beweglich, in Kunststoffen sind sie fest an ihre Atome gebunden."]])},{category:"3. Klasse Gymnasium",subject:"Physik",name:"Magnetismus & Elektromagnetismus",flang:"de-DE",blang:"de-DE",cards:_([["Welche Pole hat jeder Magnet?","Immer einen Nord- und einen S\xFCdpol. Einen einzelnen Pol gibt es nicht."],["Was passiert, wenn du einen Stabmagneten in der Mitte zerbrichst?","Du bekommst zwei vollst\xE4ndige Magnete mit je zwei Polen \u2014 nicht einen Nord- und einen S\xFCdteil."],["Welche Pole ziehen sich an?","Ungleiche Pole ziehen sich an, gleiche sto\xDFen sich ab."],["Welche Stoffe sind magnetisch?","Eisen, Nickel und Kobalt. Aluminium und Kupfer zum Beispiel nicht."],["Wo zeigt die Nordnadel des Kompasses hin?","Zum geografischen Nordpol \u2014 dort liegt physikalisch ein magnetischer S\xFCdpol, denn Gegenpole ziehen sich an."],["Was entsteht rund um einen stromdurchflossenen Draht?","Ein Magnetfeld. Strom und Magnetismus geh\xF6ren untrennbar zusammen."],["Wie verst\xE4rkt man einen Elektromagneten?","Mehr Windungen, mehr Stromst\xE4rke, und ein Eisenkern in der Spule."],["Was ist der gro\xDFe Vorteil eines Elektromagneten?","Man kann ihn ein- und ausschalten und seine St\xE4rke regeln \u2014 ein Dauermagnet ist immer an."],["Wo steckt im Alltag ein Elektromagnet?","In T\xFCrklingel, Lautsprecher, Elektromotor, Festplatte und im Schrottplatz-Kran."],["Was ist ein Magnetfeld?","Der Raum um einen Magneten, in dem seine Kraft wirkt. Feldlinien laufen au\xDFen von Nord nach S\xFCd."],["Warum sch\xFCtzt uns das Erdmagnetfeld?","Es lenkt geladene Teilchen der Sonne ab. Sichtbar wird das als Polarlicht."],["Wie funktioniert ein Elektromotor im Kern?","Ein Magnetfeld st\xF6\xDFt und zieht eine stromdurchflossene Spule, die sich dadurch dreht."]])},{category:"3. Klasse Gymnasium",subject:"Physik",name:"W\xE4rme, Energie & Aggregatzust\xE4nde",flang:"de-DE",blang:"de-DE",cards:_([["Was ist Temperatur im Teilchenmodell?","Ein Ma\xDF daf\xFCr, wie schnell sich die Teilchen bewegen. Hei\xDF hei\xDFt schnell."],["Was ist der Unterschied zwischen W\xE4rme und Temperatur?","Temperatur ist ein Zustand, W\xE4rme ist \xFCbertragene Energie. Eine Badewanne mit 40 \xB0C enth\xE4lt viel mehr W\xE4rme als eine Tasse mit 40 \xB0C."],["Warum dehnen sich Stoffe beim Erw\xE4rmen aus?","Die Teilchen bewegen sich heftiger und brauchen mehr Platz."],["Warum haben Br\xFCcken Dehnungsfugen?","Damit sich das Material im Sommer ausdehnen kann, ohne dass die Konstruktion rei\xDFt."],["Nenne die drei Arten des W\xE4rmetransports.","W\xE4rmeleitung im Material, Konvektion durch str\xF6mende Luft oder Fl\xFCssigkeit, W\xE4rmestrahlung ohne Materie."],["Warum w\xE4rmt eine Thermoskanne so gut?","Das Vakuum verhindert Leitung und Konvektion, die verspiegelte Wand reflektiert die Strahlung."],["Was passiert beim Schmelzen im Teilchenmodell?","Die Teilchen l\xF6sen sich aus ihren festen Pl\xE4tzen und k\xF6nnen aneinander vorbeigleiten."],["Warum bleibt Eiswasser bei 0 \xB0C, obwohl man weiter heizt?","Die zugef\xFChrte Energie wird zum Schmelzen gebraucht, nicht zum Erw\xE4rmen. Erst wenn alles Eis weg ist, steigt die Temperatur."],["Warum ist Wasser als K\xFChlmittel so gut?","Es kann sehr viel Energie aufnehmen, bevor seine Temperatur merklich steigt."],["Was besagt die Energieerhaltung?","Energie geht nie verloren, sie wird nur umgewandelt \u2014 oft in W\xE4rme, die sich verteilt und schwer nutzbar wird."],["Warum ist eine Anomalie des Wassers lebenswichtig?","Wasser ist bei 4 \xB0C am dichtesten. Deshalb schwimmt Eis oben und Seen frieren nicht bis zum Grund durch."],["Warum f\xFChlt sich Metall k\xE4lter an als Holz bei gleicher Temperatur?","Metall leitet W\xE4rme schneller von der Hand weg. Gemessen sind beide gleich warm."]])},{category:"3. Klasse Gymnasium",subject:"Chemie (Vorschau)",name:"Teilchenmodell & Stoffe",flang:"de-DE",blang:"de-DE",cards:_([["Woraus bestehen alle Stoffe?","Aus winzigen Teilchen, die st\xE4ndig in Bewegung sind."],["Wie ordnen sich Teilchen in fest, fl\xFCssig und gasf\xF6rmig?","Fest: dicht und auf festen Pl\xE4tzen. Fl\xFCssig: dicht, aber beweglich. Gasf\xF6rmig: weit auseinander und schnell."],["Was ist ein Reinstoff?","Ein Stoff aus nur einer Teilchensorte, zum Beispiel destilliertes Wasser oder Kupfer."],["Was ist ein Gemisch?","Mehrere Stoffe nebeneinander, zum Beispiel Luft, Salzwasser oder Granit."],["Wie trennt man Salz von Wasser?","Durch Eindampfen. Das Wasser verdunstet, das Salz bleibt zur\xFCck."],["Wie trennt man Sand von Wasser?","Durch Filtrieren \u2014 die Sandk\xF6rner sind zu gro\xDF f\xFCr den Filter."],["Was ist der Unterschied zwischen physikalischer und chemischer \xC4nderung?","Physikalisch \xE4ndert sich nur die Form oder der Zustand. Chemisch entsteht ein neuer Stoff mit neuen Eigenschaften."],["Ist Kerzenwachs schmelzen physikalisch oder chemisch?","Physikalisch \u2014 es bleibt Wachs. Das Verbrennen der Flamme dagegen ist chemisch."],["Was ist ein Atom?","Der kleinste Baustein eines chemischen Elements."],["Woraus besteht ein Wassermolek\xFCl?","Aus zwei Wasserstoffatomen und einem Sauerstoffatom, kurz H\u2082O."],["Warum riecht man Parfum quer durch den Raum?","Weil die Teilchen sich von selbst verteilen. Das nennt man Diffusion."],["Was passiert bei einer Verbrennung grunds\xE4tzlich?","Ein Stoff reagiert mit Sauerstoff, dabei wird Energie frei und es entstehen neue Stoffe."]])},{category:"3. Klasse Gymnasium",subject:"Informatik & Medien",name:"Wie Computer denken",flang:"de-DE",blang:"de-DE",cards:_([["Warum rechnen Computer mit Nullen und Einsen?","Weil sich zwei Zust\xE4nde technisch sicher unterscheiden lassen: Strom flie\xDFt oder eben nicht."],["Welche Dezimalzahl ist bin\xE4r 1011?","11. Denn 8 + 0 + 2 + 1, die Stellen stehen f\xFCr 8, 4, 2, 1."],["Wie schreibt man 20 bin\xE4r?","10100, also 16 + 4."],["Wie viele Werte kann ein Byte annehmen?","256 \u2014 acht Bits mit je zwei M\xF6glichkeiten, also 2 hoch 8."],["Was ist ein Algorithmus?","Eine eindeutige Schritt-f\xFCr-Schritt-Anleitung, die zu einem Ergebnis f\xFChrt. Ein Kochrezept ist einer."],["Was ist eine Schleife?","Eine Anweisung, die wiederholt wird, solange eine Bedingung gilt."],["Was ist eine Variable?","Ein benannter Platz im Speicher, in dem ein Wert liegt, der sich \xE4ndern kann."],["Warum finden Computer in sortierten Listen so schnell?","Sie halbieren den Suchbereich immer wieder. Bei einer Million Eintr\xE4gen reichen rund 20 Schritte."],["Was passiert technisch, wenn du eine Website aufrufst?","Dein Ger\xE4t fragt einen Server nach Daten, der schickt sie in Paketen zur\xFCck, der Browser setzt daraus die Seite zusammen."],["Was ist eine IP-Adresse?","Die Hausnummer eines Ger\xE4ts im Netz, damit Datenpakete den Weg zur\xFCckfinden."],["Warum sind pers\xF6nliche Daten wertvoll?","Weil sich damit Verhalten vorhersagen und Werbung verkaufen l\xE4sst. Was einmal drau\xDFen ist, holt man nicht zur\xFCck."],["Was macht ein Passwort sicher?","L\xE4nge vor Kompliziertheit. Ein langer Satz schl\xE4gt ein kurzes Zeichenwirrwarr \u2014 und f\xFCr jeden Dienst ein eigenes."]])},{category:"3. Klasse Gymnasium",subject:"Biologie",name:"Verdauung & Ern\xE4hrung",flang:"de-DE",blang:"de-DE",cards:_([["Wozu dient die Verdauung \xFCberhaupt?","Sie zerlegt gro\xDFe Nahrungsbausteine so weit, dass sie ins Blut aufgenommen werden k\xF6nnen."],["Wo beginnt die Verdauung?","Im Mund. Z\xE4hne zerkleinern mechanisch, der Speichel spaltet bereits St\xE4rke."],["Warum schmeckt lange gekautes Brot s\xFC\xDF?","Ein Enzym im Speichel zerlegt St\xE4rke in Zucker \u2014 man schmeckt die Verdauung f\xF6rmlich."],["Was passiert im Magen?","Salzs\xE4ure t\xF6tet Keime und der Nahrungsbrei wird durchmischt. Erste Eiwei\xDFe werden gespalten."],["Warum verdaut sich der Magen nicht selbst?","Eine dicke Schleimschicht sch\xFCtzt die Magenwand vor der eigenen S\xE4ure."],["Wo wird das meiste aufgenommen?","Im D\xFCnndarm. Zotten und Mikrozotten vergr\xF6\xDFern die Oberfl\xE4che auf die Gr\xF6\xDFe einer Wohnung."],["Warum ist die Oberfl\xE4che im Darm so wichtig?","Je gr\xF6\xDFer die Fl\xE4che, desto mehr N\xE4hrstoffe k\xF6nnen gleichzeitig ins Blut \xFCbertreten."],["Welche Aufgabe hat der Dickdarm?","Er entzieht dem Rest Wasser und Salze. \xDCbrig bleibt der eingedickte Stuhl."],["Was macht die Leber im Stoffwechsel?","Sie ist das chemische Zentrallabor: speichert Zucker, baut Giftstoffe ab und produziert Gallenfl\xFCssigkeit."],["Wof\xFCr braucht der K\xF6rper Kohlenhydrate, Fette, Eiwei\xDFe?","Kohlenhydrate als schnellen Treibstoff, Fette als Energiespeicher und Zellbaustoff, Eiwei\xDFe als Baumaterial."],["Warum sind Ballaststoffe wichtig, obwohl sie nicht verdaut werden?","Sie halten den Darm in Bewegung und machen lange satt."],["Warum sind Vitamine lebensnotwendig?","Sie steuern Vorg\xE4nge im K\xF6rper und k\xF6nnen meist nicht selbst hergestellt werden."],["Was ist der Unterschied zwischen Hunger und Appetit?","Hunger ist ein k\xF6rperliches Signal bei Energiemangel, Appetit ist Lust auf etwas Bestimmtes."],["Warum sind Darmbakterien n\xFCtzlich?","Sie zerlegen Reste, bilden Vitamine und halten Krankheitserreger in Schach."]])},{category:"3. Klasse Gymnasium",subject:"Biologie",name:"Atmung & Blutkreislauf",flang:"de-DE",blang:"de-DE",cards:_([["Wozu atmen wir?","Um Sauerstoff aufzunehmen, mit dem die Zellen N\xE4hrstoffe verbrennen, und um Kohlendioxid loszuwerden."],["Wo findet der Gasaustausch statt?","In den Lungenbl\xE4schen. Ihre Wand ist so d\xFCnn, dass Gase direkt ins Blut \xFCbertreten."],["Wie gro\xDF ist die Austauschfl\xE4che der Lunge?","Rund 100 Quadratmeter \u2014 etwa eine gro\xDFe Wohnung, zusammengefaltet in den Brustkorb."],["Wie kommt die Luft \xFCberhaupt in die Lunge?","Das Zwerchfell senkt sich, der Brustraum wird gr\xF6\xDFer, der Unterdruck saugt Luft an."],["Warum ist Nasenatmung besser als Mundatmung?","Die Nase filtert, w\xE4rmt und befeuchtet die Luft."],["Welche Aufgabe haben die roten Blutk\xF6rperchen?","Sie transportieren Sauerstoff, gebunden an den roten Farbstoff H\xE4moglobin."],["Welche Aufgabe haben die wei\xDFen Blutk\xF6rperchen?","Sie sind die Abwehr und bek\xE4mpfen Krankheitserreger."],["Wozu dienen Blutpl\xE4ttchen?","Sie lassen das Blut an Wunden gerinnen."],["Was ist der Unterschied zwischen Arterie und Vene?","Arterien f\xFChren vom Herzen weg und haben dicke W\xE4nde, Venen f\xFChren zum Herzen hin und besitzen Klappen."],["Warum braucht das Blut in den Beinvenen Klappen?","Weil es gegen die Schwerkraft nach oben muss. Die Klappen verhindern das Zur\xFCcksacken."],["Was ist der kleine Kreislauf?","Der Lungenkreislauf: vom Herzen zur Lunge und mit Sauerstoff beladen zur\xFCck."],["Wie viele Kammern hat das menschliche Herz?","Vier: zwei Vorh\xF6fe und zwei Kammern."],["Warum ist Ausdauersport gut f\xFCrs Herz?","Das Herz wird kr\xE4ftiger und pumpt pro Schlag mehr Blut. Der Ruhepuls sinkt."],["Was macht Rauchen mit der Lunge?","Es l\xE4hmt die Flimmerh\xE4rchen, zerst\xF6rt Lungenbl\xE4schen und verkleinert die Austauschfl\xE4che dauerhaft."]])},{category:"3. Klasse Gymnasium",subject:"Biologie",name:"Nerven, Sinne & Immunsystem",flang:"de-DE",blang:"de-DE",cards:_([["Welche Aufgabe hat das Nervensystem?","Es nimmt Reize auf, verarbeitet sie und steuert die Reaktion des K\xF6rpers."],["Was ist ein Reflex?","Eine blitzschnelle Reaktion, die im R\xFCckenmark verschaltet wird, ohne den Umweg \xFCbers Gehirn."],["Warum ist der Reflex so schnell?","Weil der Weg kurz ist \u2014 der Denkapparat wird schlicht \xFCbersprungen."],["Wie entsteht ein Bild im Auge?","Die Linse b\xFCndelt Licht auf die Netzhaut, dort wandeln Sinneszellen es in Nervensignale um."],["Warum sehen wir in der D\xE4mmerung kaum Farben?","F\xFCr Farben sind die Zapfen zust\xE4ndig, die viel Licht brauchen. Im Dunkeln arbeiten nur die lichtempfindlichen St\xE4bchen."],["Wie funktioniert H\xF6ren?","Schall bringt das Trommelfell zum Schwingen, die Geh\xF6rkn\xF6chelchen verst\xE4rken, im Innenohr entstehen Nervensignale."],["Warum ist laute Musik \xFCber Kopfh\xF6rer riskant?","Zerst\xF6rte Sinneszellen im Innenohr wachsen nicht nach. Der H\xF6rverlust bleibt."],["Was ist ein Krankheitserreger?","Ein Bakterium, Virus oder Pilz, der im K\xF6rper Schaden anrichtet."],["Was ist der Unterschied zwischen Bakterien und Viren?","Bakterien sind selbstst\xE4ndige Lebewesen, Viren brauchen fremde Zellen zur Vermehrung."],["Warum helfen Antibiotika nicht gegen Grippe?","Antibiotika wirken gegen Bakterien. Grippe wird von Viren verursacht."],["Wie funktioniert eine Impfung?","Der K\xF6rper \xFCbt an einem harmlosen Teil des Erregers und legt Ged\xE4chtniszellen an. Im Ernstfall ist die Abwehr sofort da."],["Warum ist Fieber sinnvoll?","H\xF6here Temperatur bremst Erreger und beschleunigt die Abwehr. Nur sehr hohes Fieber wird gef\xE4hrlich."]])},{category:"3. Klasse Gymnasium",subject:"Biologie",name:"\xD6kologie & Stoffkreisl\xE4ufe",flang:"de-DE",blang:"de-DE",cards:_([["Was ist ein \xD6kosystem?","Ein Lebensraum samt aller Lebewesen darin und ihren Wechselwirkungen."],["Was sind Produzenten?","Pflanzen. Sie bauen mit Licht aus Wasser und CO\u2082 energiereiche Stoffe auf."],["Was sind Konsumenten?","Tiere, die sich von anderen Lebewesen ern\xE4hren, weil sie selbst nichts aufbauen k\xF6nnen."],["Was sind Destruenten und warum sind sie unverzichtbar?","Bakterien und Pilze zersetzen Totes zu Mineralstoffen. Ohne sie w\xE4re der Kreislauf unterbrochen."],["Wie lautet die Fotosynthese in Worten?","Kohlendioxid und Wasser werden mit Lichtenergie zu Traubenzucker und Sauerstoff."],["Warum ist die Fotosynthese die Grundlage fast allen Lebens?","Sie bindet Sonnenenergie in Nahrung und liefert nebenbei den Sauerstoff zum Atmen."],["Was ist eine Nahrungskette?","Die Reihe, wer wen frisst \u2014 von der Pflanze \xFCber den Pflanzenfresser zum Fleischfresser."],["Warum wird eine Nahrungskette nach oben hin schmaler?","Bei jedem Schritt geht der Gro\xDFteil der Energie als W\xE4rme verloren. Nur ein Bruchteil landet in der n\xE4chsten Stufe."],["Was ist ein Nahrungsnetz?","Die realistische Verkn\xFCpfung vieler Nahrungsketten, weil die meisten Tiere mehreres fressen."],["Was passiert, wenn ein Glied wegf\xE4llt?","Das Netz ger\xE4t aus dem Gleichgewicht: manche Arten vermehren sich stark, andere verschwinden."],["Was ist der Treibhauseffekt?","Gase in der Atmosph\xE4re halten W\xE4rmestrahlung zur\xFCck. Ohne ihn w\xE4re die Erde eisig, zu viel davon heizt sie auf."],["Warum ist Artenvielfalt wichtig?","Je mehr Arten, desto stabiler das System. F\xE4llt eine aus, k\xF6nnen andere die Rolle \xFCbernehmen."]])},{category:"3. Klasse Gymnasium",subject:"Geographie & Wirtschaft",name:"Europa: L\xE4nder, Hauptst\xE4dte, Gew\xE4sser",flang:"de-DE",blang:"de-DE",cards:_([["Hauptstadt von Frankreich?","Paris."],["Hauptstadt von Italien?","Rom."],["Hauptstadt von Spanien?","Madrid."],["Hauptstadt von Polen?","Warschau."],["Hauptstadt von Schweden?","Stockholm."],["Hauptstadt von Griechenland?","Athen."],["Hauptstadt von Portugal?","Lissabon."],["Hauptstadt von Ungarn?","Budapest."],["Hauptstadt der Niederlande?","Amsterdam \u2014 Regierungssitz ist allerdings Den Haag."],["Welche L\xE4nder grenzen an \xD6sterreich?","Acht: Deutschland, Tschechien, Slowakei, Ungarn, Slowenien, Italien, Schweiz, Liechtenstein."],["Welcher Fluss flie\xDFt durch Wien, Budapest und Belgrad?","Die Donau \u2014 der zweitl\xE4ngste Fluss Europas."],["In welches Meer m\xFCndet die Donau?","Ins Schwarze Meer."],["Welches Gebirge trennt Spanien von Frankreich?","Die Pyren\xE4en."],["Welcher Berg ist der h\xF6chste der Alpen?","Der Mont Blanc mit rund 4808 Metern."],["Welcher ist der h\xF6chste Berg \xD6sterreichs?","Der Gro\xDFglockner mit 3798 Metern."],["Welches Meer liegt zwischen Italien und Griechenland?","Das Adriatische und weiter s\xFCdlich das Ionische Meer."],["Was ist die Europ\xE4ische Union in einem Satz?","Ein Zusammenschluss von 27 Staaten mit gemeinsamem Binnenmarkt und teils gemeinsamer W\xE4hrung."],["Was bedeutet der Schengen-Raum?","Reisen zwischen den Mitgliedsstaaten ohne Grenzkontrollen."]])},{category:"3. Klasse Gymnasium",subject:"Geographie & Wirtschaft",name:"Klima, Zonen & Wirtschaft",flang:"de-DE",blang:"de-DE",cards:_([["Was ist der Unterschied zwischen Wetter und Klima?","Wetter ist der Zustand jetzt, Klima der Durchschnitt \xFCber Jahrzehnte."],["Warum ist es am \xC4quator w\xE4rmer als an den Polen?","Die Sonne steht dort steil, ihre Energie verteilt sich auf eine kleinere Fl\xE4che."],["Welche Klimazonen gibt es grob von S\xFCd nach Nord?","Tropisch, subtropisch, gem\xE4\xDFigt, kalt beziehungsweise polar."],["In welcher Klimazone liegt Mitteleuropa?","In der gem\xE4\xDFigten Zone mit vier ausgepr\xE4gten Jahreszeiten."],["Warum ist es in Irland milder als in Moskau, obwohl beide gleich weit n\xF6rdlich liegen?","Der Golfstrom bringt warmes Wasser nach Westeuropa."],["Wie ver\xE4ndert sich das Klima mit der H\xF6he?","Pro 100 H\xF6henmeter sinkt die Temperatur um etwa 0,6 Grad."],["Was ist die Baumgrenze?","Die H\xF6he, oberhalb derer es f\xFCr B\xE4ume zu kalt und zu windig ist."],["Was versteht man unter den drei Wirtschaftssektoren?","Prim\xE4r: Rohstoffe gewinnen. Sekund\xE4r: verarbeiten. Terti\xE4r: Dienstleistungen."],["In welchem Sektor arbeiten die meisten Menschen in \xD6sterreich?","Im terti\xE4ren Sektor, also bei Dienstleistungen."],["Was ist ein Ballungsraum?","Ein Gebiet mit sehr hoher Bev\xF6lkerungsdichte rund um eine gro\xDFe Stadt."],["Was bedeutet Globalisierung?","Waren, Geld, Menschen und Informationen bewegen sich weltweit \u2014 L\xE4nder werden voneinander abh\xE4ngig."],["Warum ist der Tourismus f\xFCr \xD6sterreich so wichtig?","Alpen und Kulturst\xE4dte bringen Einkommen und Arbeitspl\xE4tze, besonders in l\xE4ndlichen Regionen."]])},{category:"3. Klasse Gymnasium",subject:"Geschichte & Politik",name:"Entdeckungen & fr\xFChe Neuzeit",flang:"de-DE",blang:"de-DE",cards:_([["Was erfand Johannes Gutenberg um 1450?","Den Buchdruck mit beweglichen Lettern \u2014 Wissen wurde erstmals massenhaft verbreitbar."],["Warum war der Buchdruck so folgenreich?","B\xFCcher wurden billig, immer mehr Menschen lernten lesen, neue Ideen verbreiteten sich rasend schnell."],["Wer erreichte 1492 Amerika?","Christoph Kolumbus \u2014 er suchte den Seeweg nach Indien."],["Warum suchten Europ\xE4er neue Seewege?","Der Landweg nach Asien war teuer und blockiert. Gew\xFCrze, Seide und Gold lockten."],["Was bedeutet Kolonialismus?","Europ\xE4ische Staaten eroberten fremde Gebiete, beuteten sie aus und unterwarfen die Bev\xF6lkerung."],["Was war der Kolumbianische Austausch?","Pflanzen, Tiere und Krankheiten wanderten zwischen den Kontinenten. Kartoffel und Mais kamen nach Europa, Seuchen nach Amerika."],["Was ist die Renaissance?","Die Wiedergeburt antiker Ideen ab dem 15. Jahrhundert \u2014 der Mensch r\xFCckt ins Zentrum von Kunst und Wissenschaft."],["Wof\xFCr steht Leonardo da Vinci?","F\xFCr das Ideal des Universalgelehrten: Maler, Anatom, Ingenieur in einer Person."],["Was l\xF6ste Martin Luther 1517 aus?","Die Reformation. Seine Kritik am Ablasshandel spaltete die Kirche."],["Was war der Ablasshandel?","Der Verkauf von S\xFCndenerlass gegen Geld \u2014 f\xFCr Luther unvereinbar mit dem Glauben."],["Was \xE4nderte Kopernikus am Weltbild?","Nicht die Erde, sondern die Sonne steht im Mittelpunkt. Das ersch\xFCtterte die Stellung des Menschen im Kosmos."],["Was war der Drei\xDFigj\xE4hrige Krieg?","Ein Religions- und Machtkrieg 1618 bis 1648, der Mitteleuropa verw\xFCstete und die Bev\xF6lkerung stellenweise halbierte."]])},{category:"3. Klasse Gymnasium",subject:"Geschichte & Politik",name:"Absolutismus, Aufkl\xE4rung & Revolution",flang:"de-DE",blang:"de-DE",cards:_([["Was ist Absolutismus?","Ein K\xF6nig herrscht unbeschr\xE4nkt und begr\xFCndet seine Macht mit Gottes Willen."],["Wer sagte \u201EDer Staat bin ich\u201C?","Ludwig XIV. von Frankreich, der Sonnenk\xF6nig."],["Was ist die zentrale Idee der Aufkl\xE4rung?","Der Mensch soll seinen eigenen Verstand gebrauchen statt blind zu gehorchen."],["Was forderte Montesquieu?","Die Gewaltenteilung: Gesetzgebung, Regierung und Gerichte m\xFCssen getrennt sein."],["Welche Reformen brachte Maria Theresia?","Unter anderem die Schulpflicht ab 1774 und eine geordnete Verwaltung."],["Was tat Joseph II.?","Er schaffte die Leibeigenschaft ab und erlie\xDF das Toleranzpatent f\xFCr andere Konfessionen."],["Wann begann die Franz\xF6sische Revolution?","1789 mit dem Sturm auf die Bastille am 14. Juli."],["Welche drei Forderungen pr\xE4gten die Revolution?","Freiheit, Gleichheit, Br\xFCderlichkeit."],["Was waren die drei St\xE4nde vor der Revolution?","Klerus, Adel und der dritte Stand \u2014 letzterer stellte \xFCber 90 Prozent und zahlte fast alle Steuern."],["Warum kam es zur Revolution?","Hunger, Staatsbankrott und die Ungerechtigkeit der St\xE4ndeordnung trafen auf die Ideen der Aufkl\xE4rung."],["Was ist die Erkl\xE4rung der Menschen- und B\xFCrgerrechte?","Ein Dokument von 1789: Menschen sind frei und gleich an Rechten geboren."],["Wer war Napoleon Bonaparte?","Ein General, der sich 1804 zum Kaiser kr\xF6nte, halb Europa eroberte und dabei den Code Civil verbreitete."]])},{category:"3. Klasse Gymnasium",subject:"Geschichte & Politik",name:"Industrialisierung & Demokratie heute",flang:"de-DE",blang:"de-DE",cards:_([["Was war die Industrielle Revolution?","Der \xDCbergang von Handarbeit zu Maschinenarbeit ab etwa 1760 in England."],["Welche Erfindung war der Ausl\xF6ser?","Die Dampfmaschine \u2014 erstmals stand Energie unabh\xE4ngig von Wind, Wasser und Muskelkraft bereit."],["Wie ver\xE4nderte die Eisenbahn das Leben?","Waren und Menschen wurden schnell und billig transportiert. Entfernungen schrumpften gef\xFChlt."],["Was war die soziale Frage?","Fabrikarbeit brachte Elend: 14-Stunden-Tage, Kinderarbeit, Wohnungsnot, keine Absicherung."],["Wie reagierten die Arbeiter darauf?","Sie gr\xFCndeten Gewerkschaften und Parteien und erk\xE4mpften Arbeitszeitgrenzen und Versicherungen."],["Was ist Urbanisierung?","Die starke Wanderung vom Land in die St\xE4dte, weil dort Arbeit in den Fabriken lockte."],["Was bedeutet Demokratie w\xF6rtlich?","Herrschaft des Volkes, aus dem Griechischen."],["Was hei\xDFt Gewaltenteilung konkret in \xD6sterreich?","Parlament macht Gesetze, Regierung f\xFChrt sie aus, unabh\xE4ngige Gerichte sprechen Recht."],["Wer wird bei der Nationalratswahl gew\xE4hlt?","Die Abgeordneten des Nationalrats, also das Parlament."],["Ab welchem Alter darf man in \xD6sterreich w\xE4hlen?","Ab 16 Jahren \u2014 das ist im europ\xE4ischen Vergleich fr\xFCh."],["Was steht in einer Verfassung?","Die Grundregeln des Staates und die Grundrechte, die niemand einfach \xE4ndern darf."],["Warum sind freie Medien f\xFCr Demokratie wichtig?","Sie kontrollieren die M\xE4chtigen und erm\xF6glichen Meinungsbildung aus mehreren Quellen."]])},{category:"3. Klasse Gymnasium",subject:"Deutsch",name:"Grammatik: F\xE4lle, Zeiten, Satzglieder",flang:"de-DE",blang:"de-DE",cards:_([["Wie hei\xDFen die vier F\xE4lle mit Fragewort?","Nominativ (wer/was), Genitiv (wessen), Dativ (wem), Akkusativ (wen/was)."],["In welchem Fall steht \u201Edem Kind\u201C?","Im Dativ \u2014 Frage: wem?"],["Wie findest du das Subjekt im Satz?","Frage \u201EWer oder was tut etwas?\u201C \u2014 die Antwort ist das Subjekt."],["Was ist ein Pr\xE4dikat?","Der Satzkern aus Verbformen. Er sagt, was geschieht."],["Wie unterscheidest du Dativ- und Akkusativobjekt?","Dativ antwortet auf \u201Ewem?\u201C, Akkusativ auf \u201Ewen oder was?\u201C."],["Bilde das Perfekt von \u201Egehen\u201C (ich).","Ich bin gegangen \u2014 mit \u201Esein\u201C, weil es eine Ortsver\xE4nderung ist."],["Wann nimmt man \u201Ehaben\u201C, wann \u201Esein\u201C im Perfekt?","\u201ESein\u201C bei Bewegung und Zustandswechsel (ich bin gelaufen), sonst \u201Ehaben\u201C."],["Was dr\xFCckt das Plusquamperfekt aus?","Etwas, das noch vor einem anderen Vergangenen passiert ist: Ich hatte gegessen, bevor er kam."],["Was ist der Unterschied zwischen Aktiv und Passiv?","Aktiv: Der Hund bei\xDFt den Mann. Passiv: Der Mann wird gebissen \u2014 die Tat r\xFCckt in den Vordergrund."],["Was ist ein Nebensatz?","Ein Satz, der allein nicht stehen kann. Das gebeugte Verb rutscht ans Ende."],["Warum steht vor \u201Edass\u201C ein Komma?","Weil \u201Edass\u201C einen Nebensatz einleitet und Nebens\xE4tze abgetrennt werden."],["Was ist eine Konjunktion?","Ein Bindewort wie und, weil, obwohl. Es verkn\xFCpft S\xE4tze oder Satzteile."],["Wie erkennst du ein Adverb?","Es beschreibt n\xE4her, wie, wann oder wo etwas geschieht, und wird nicht dekliniert."],["Was ist der Konjunktiv II und wof\xFCr braucht man ihn?","Die M\xF6glichkeitsform: Ich h\xE4tte, ich w\xFCrde. F\xFCr W\xFCnsche, H\xF6flichkeit und Unwirkliches."]])},{category:"3. Klasse Gymnasium",subject:"Deutsch",name:"Rechtschreibung: die klassischen Stolpersteine",flang:"de-DE",blang:"de-DE",cards:_([["Wann schreibt man \u201Edas\u201C, wann \u201Edass\u201C?","\u201EDas\u201C wenn man dieses/welches einsetzen kann. Sonst \u201Edass\u201C als Bindewort."],["Probe: Ich wei\xDF, ___ du kommst.","dass \u2014 man kann nicht \u201Edieses\u201C einsetzen."],["Probe: Das Buch, ___ ich lese.","das \u2014 hier passt \u201Ewelches\u201C."],["Wann \u201Eseit\u201C, wann \u201Eseid\u201C?","\u201ESeit\u201C bei Zeit (seit gestern), \u201Eseid\u201C ist die Form von sein (ihr seid)."],["Wann \u201Ewider\u201C, wann \u201Ewieder\u201C?","\u201EWider\u201C hei\xDFt gegen (Widerspruch), \u201Ewieder\u201C hei\xDFt nochmal."],["Wann schreibt man ss, wann \xDF?","Nach kurzem Vokal ss (Fluss), nach langem Vokal oder Doppellaut \xDF (Fu\xDF, hei\xDF)."],["Was wird immer gro\xDFgeschrieben?","Nomen und alles, was wie ein Nomen gebraucht wird: das Laufen, etwas Sch\xF6nes."],["Signalw\xF6rter f\xFCr Gro\xDFschreibung?","Ein Artikel oder ein Wort wie etwas, nichts, viel davor: das Gute, nichts Neues."],["Wann schreibt man Zeitangaben gro\xDF?","Wenn sie Nomen sind: am Morgen, heute Abend. Klein bleibt: morgens, abends."],["Wie schreibt man: \u201EEs tut mir leid\u201C?","Getrennt und klein \u2014 leid ist hier kein Nomen."],["Wann setzt man ein Komma bei \u201Eund\u201C?","Meist gar nicht. Nur wenn ein Nebensatz dazwischenliegt, wird abgetrennt."],["Warum ist Zeichensetzung mehr als Kosmetik?","Sie steuert den Sinn: \u201EWir essen, Opa.\u201C gegen \u201EWir essen Opa.\u201C"]])},{category:"3. Klasse Gymnasium",subject:"Deutsch",name:"Texte & Stilmittel",flang:"de-DE",blang:"de-DE",cards:_([["Was ist eine Metapher?","Ein bildhafter Ausdruck ohne \u201Ewie\u201C: ein Meer aus Menschen."],["Was ist ein Vergleich?","Ein Bild mit \u201Ewie\u201C oder \u201Eals\u201C: stark wie ein B\xE4r."],["Was ist eine Personifikation?","Etwas Unbelebtes handelt wie ein Mensch: Der Wind fl\xFCstert."],["Was ist eine Alliteration?","Gleicher Anfangslaut bei aufeinanderfolgenden W\xF6rtern: Milch macht m\xFCde M\xE4nner munter."],["Was ist eine \xDCbertreibung, fachlich Hyperbel?","Bewusst ma\xDFlose Steigerung: Ich habe dir tausendmal gesagt \u2026"],["Was geh\xF6rt in eine Inhaltsangabe?","Pr\xE4sens, eigene Worte, nur das Wesentliche, keine w\xF6rtliche Rede, keine eigene Meinung."],["Woran erkennst du eine Argumentation?","Behauptung, Begr\xFCndung, Beispiel \u2014 die drei B."],["Was ist der Unterschied zwischen Erz\xE4hler und Autor?","Der Autor schreibt das Buch, der Erz\xE4hler ist die erfundene Stimme darin."],["Was ist ein Ich-Erz\xE4hler?","Eine Figur erz\xE4hlt aus ihrer Sicht und wei\xDF nur, was sie selbst erlebt."],["Was macht eine gute Einleitung aus?","Sie nennt Titel, Autor, Textsorte und das Thema in wenigen S\xE4tzen."],["Was ist eine Ballade?","Ein erz\xE4hlendes Gedicht mit Spannungsbogen \u2014 Handlung in Versform."],["Wozu dient ein Reimschema wie abab?","Es gibt dem Gedicht Rhythmus und Struktur; hier reimen sich Zeile 1 mit 3 und 2 mit 4."]])},{category:"3. Klasse Gymnasium",subject:"Englisch",name:"A2 \xB7 Unregelm\xE4\xDFige Verben",flang:"en-US",blang:"de-DE",cards:_([["go \u2014 went \u2014 gone","gehen"],["see \u2014 saw \u2014 seen","sehen"],["take \u2014 took \u2014 taken","nehmen"],["write \u2014 wrote \u2014 written","schreiben"],["speak \u2014 spoke \u2014 spoken","sprechen"],["buy \u2014 bought \u2014 bought","kaufen"],["bring \u2014 brought \u2014 brought","bringen"],["think \u2014 thought \u2014 thought","denken"],["find \u2014 found \u2014 found","finden"],["give \u2014 gave \u2014 given","geben"],["know \u2014 knew \u2014 known","wissen, kennen"],["drink \u2014 drank \u2014 drunk","trinken"],["begin \u2014 began \u2014 begun","beginnen"],["break \u2014 broke \u2014 broken","zerbrechen"],["choose \u2014 chose \u2014 chosen","w\xE4hlen"],["forget \u2014 forgot \u2014 forgotten","vergessen"],["understand \u2014 understood \u2014 understood","verstehen"],["leave \u2014 left \u2014 left","verlassen, gehen"],["win \u2014 won \u2014 won","gewinnen"],["become \u2014 became \u2014 become","werden"]])},{category:"3. Klasse Gymnasium",subject:"Englisch",name:"A2 \xB7 Zeiten richtig w\xE4hlen",flang:"de-DE",blang:"de-DE",cards:_([["Wann nimmt man das Present Perfect?","Wenn die Vergangenheit bis jetzt wirkt oder der Zeitpunkt egal ist: I have lost my key."],["Wann nimmt man das Past Simple?","Bei einem abgeschlossenen Zeitpunkt in der Vergangenheit: I lost my key yesterday."],["Signalw\xF6rter f\xFCr Present Perfect?","already, yet, just, ever, never, since, for."],["Signalw\xF6rter f\xFCr Past Simple?","yesterday, last week, in 2019, ago."],["Was ist der Unterschied: since oder for?","since nennt den Startpunkt (since 2020), for die Dauer (for two years)."],["Wann benutzt man das Present Progressive?","F\xFCr etwas, das gerade jetzt passiert: I am reading."],["Warum sagt man nicht \u201EI am knowing\u201C?","Verben des Denkens und F\xFChlens stehen nicht in der Verlaufsform."],["Wie bildet man das Going-to-Future?","am/is/are going to + Grundform \u2014 f\xFCr Geplantes: I am going to visit her."],["Wann nimmt man will?","F\xFCr spontane Entschl\xFCsse und Vorhersagen: I think it will rain."],["Wie bildet man das Past Progressive und wof\xFCr?","was/were + ing. F\xFCr einen laufenden Vorgang, in den etwas hineinplatzt: I was cooking when he called."],["\xDCbersetze: Ich habe ihn seit Montag nicht gesehen.","I haven't seen him since Monday."],["\xDCbersetze: Wir sind letztes Jahr nach Rom gefahren.","We went to Rome last year."],["Was ist der Unterschied: I have been to London / I have gone to London?","been to hei\xDFt, man war dort und ist zur\xFCck. gone to hei\xDFt, man ist noch dort."],["Wie bildet man Fragen im Past Simple?","Mit did und der Grundform: Did you see it? Das Verb bleibt unver\xE4ndert."]])},{category:"3. Klasse Gymnasium",subject:"Englisch",name:"A2 \xB7 Wortschatz Schule, Freizeit, Reisen",flang:"en-US",blang:"de-DE",cards:_([["timetable","Stundenplan"],["homework","Haus\xFCbung"],["subject","Unterrichtsfach"],["break","Pause"],["exam","Pr\xFCfung"],["to pass an exam","eine Pr\xFCfung bestehen"],["to fail","durchfallen"],["team sport","Mannschaftssport"],["hobby","Hobby"],["to hang out with friends","mit Freunden abh\xE4ngen"],["luggage","Gep\xE4ck"],["departure","Abfahrt, Abflug"],["arrival","Ankunft"],["return ticket","R\xFCckfahrkarte"],["accommodation","Unterkunft"],["abroad","im Ausland"],["to book a room","ein Zimmer buchen"],["crowded","\xFCberf\xFCllt"],["on time","p\xFCnktlich"],["delayed","versp\xE4tet"]])},{category:"3. Klasse Gymnasium",subject:"Franz\xF6sisch",name:"A1 \xB7 Verben \xEAtre, avoir, aller",flang:"fr-FR",blang:"de-DE",cards:_([["je suis","ich bin"],["tu es","du bist"],["il/elle est","er/sie ist"],["nous sommes","wir sind"],["vous \xEAtes","ihr seid / Sie sind"],["ils/elles sont","sie sind"],["j'ai","ich habe"],["tu as","du hast"],["il/elle a","er/sie hat"],["nous avons","wir haben"],["vous avez","ihr habt / Sie haben"],["ils/elles ont","sie haben"],["je vais","ich gehe"],["tu vas","du gehst"],["nous allons","wir gehen"],["ils vont","sie gehen"]])},{category:"3. Klasse Gymnasium",subject:"Franz\xF6sisch",name:"A1 \xB7 Schule & Alltag",flang:"fr-FR",blang:"de-DE",cards:_([["l'\xE9cole","die Schule"],["la classe","die Klasse"],["le professeur","der Lehrer"],["le cahier","das Heft"],["le livre","das Buch"],["le stylo","der Kugelschreiber"],["les devoirs","die Haus\xFCbungen"],["la r\xE9cr\xE9ation","die Pause"],["le sac \xE0 dos","der Rucksack"],["l'emploi du temps","der Stundenplan"],["aujourd'hui","heute"],["demain","morgen"],["hier","gestern"],["toujours","immer"],["souvent","oft"],["j'aime","ich mag"],["je n'aime pas","ich mag nicht"],["c'est facile","das ist leicht"],["c'est difficile","das ist schwierig"]])},{category:"3. Klasse Gymnasium",subject:"Latein",name:"1. Lernjahr \xB7 Grundwortschatz & Formen",flang:"de-DE",blang:"de-DE",cards:_([["servus, servi (m.)","der Sklave, der Diener"],["puella, puellae (f.)","das M\xE4dchen"],["templum, templi (n.)","der Tempel"],["amicus, amici (m.)","der Freund"],["vita, vitae (f.)","das Leben"],["terra, terrae (f.)","die Erde, das Land"],["videre","sehen"],["audire","h\xF6ren"],["dicere","sagen"],["venire","kommen"],["dare","geben"],["Wie lauten die sechs F\xE4lle im Lateinischen?","Nominativ, Genitiv, Dativ, Akkusativ, Ablativ, Vokativ."],["Woran erkennt man im Lateinischen den Fall?","An der Endung. Deshalb ist die Wortstellung viel freier als im Deutschen."],["Was bedeutet \u201Eamicus puellae\u201C?","Der Freund des M\xE4dchens \u2014 die Endung -ae zeigt hier den Genitiv."],["Welches deutsche Wort steckt in \u201Etemplum\u201C?","Tempel. Sehr viele Fremdw\xF6rter stammen direkt aus dem Lateinischen."],["Warum lohnt Latein f\xFCr andere Sprachen?","Franz\xF6sisch, Spanisch und Italienisch stammen davon ab, und im Englischen ist rund die H\xE4lfte des Wortschatzes lateinisch beeinflusst."]])},{category:"Zum Staunen",subject:"Sch\xE4tzfragen",name:"Wie gro\xDF, wie weit, wie viel?",flang:"de-DE",blang:"de-DE",cards:_([["Wie hoch ist der Eiffelturm?","Rund 330 Meter mit Antennen \u2014 etwa so hoch wie ein Haus mit 100 Stockwerken."],["Wie weit ist der Mond von der Erde entfernt?","Rund 384 000 km. Dazwischen h\xE4tten alle anderen Planeten des Sonnensystems nebeneinander Platz."],["Wie lange braucht das Sonnenlicht bis zur Erde?","Gut 8 Minuten. Erlischt die Sonne, merken wir es erst 8 Minuten sp\xE4ter."],["Wie hoch ist der Mount Everest?","8849 Meter \u2014 und er w\xE4chst jedes Jahr um wenige Millimeter weiter."],["Wie tief ist die tiefste Stelle im Meer?","Rund 11 000 Meter im Marianengraben. Der Everest h\xE4tte darin Platz und w\xE4re noch \xFCberflutet."],["Wie schnell dreht sich die Erde am \xC4quator?","Etwa 1670 km/h. Wir merken es nicht, weil sich alles mitdreht."],["Wie schnell rast die Erde um die Sonne?","Rund 107 000 km/h, also etwa 30 Kilometer pro Sekunde."],["Wie alt ist die Erde?","Etwa 4,5 Milliarden Jahre. Der Mensch gibt es davon nur die letzten Sekunden."],["Wie viele Menschen leben auf der Erde?","\xDCber 8 Milliarden \u2014 vor 200 Jahren war es noch nicht einmal eine."],["Wie oft schl\xE4gt ein Herz an einem Tag?","Rund 100 000 Mal."],["Wie lang w\xE4ren alle Blutgef\xE4\xDFe eines Menschen aneinandergelegt?","Etwa 100 000 Kilometer \u2014 zweieinhalbmal um die Erde."],["Wie viele Atemz\xFCge macht ein Mensch pro Tag?","Ungef\xE4hr 20 000."],["Wie viele Haare hat ein Mensch auf dem Kopf?","Rund 100 000. Etwa 100 davon fallen t\xE4glich aus und wachsen nach."],["Wie viele Zellen hat ein menschlicher K\xF6rper?","Etwa 30 Billionen \u2014 eine 3 mit 13 Nullen."],["Wie viel Prozent der Erdoberfl\xE4che ist Wasser?","Rund 71 Prozent. Davon sind aber 97 Prozent Salzwasser."],["Wie viel Wasser steckt in einem Kilo Rindfleisch?","Etwa 15 000 Liter, wenn man Futter und Aufzucht mitrechnet."],["Wie viele Bl\xFCten braucht eine Biene f\xFCr ein Glas Honig?","Rund zwei Millionen. Das Volk fliegt daf\xFCr eine Strecke wie dreimal um die Erde."],["Wie schnell f\xE4llt ein Regentropfen?","20 bis 30 km/h. Gr\xF6\xDFere Tropfen fallen schneller als kleine."],["Wie lange dauert ein Flug zum Mars?","Sechs bis neun Monate, je nachdem wie die Planeten zueinander stehen."],["Wie viele Sterne hat unsere Milchstra\xDFe?","Sch\xE4tzungen reichen von 100 bis 400 Milliarden."]])},{category:"Zum Staunen",subject:"Tiere",name:"Erstaunliches aus dem Tierreich",flang:"de-DE",blang:"de-DE",cards:_([["Warum ertrinkt ein Delfin nicht im Schlaf?","Es schl\xE4ft immer nur eine Gehirnh\xE4lfte. Die andere h\xE4lt wach und steuert das Auftauchen zum Atmen."],["Wie oft schl\xE4gt ein Kolibri mit den Fl\xFCgeln?","Bis zu 80 Mal pro Sekunde. Sein Herz schl\xE4gt dabei \xFCber 1000 Mal in der Minute."],["Welche Tiere haben blaues Blut?","Tintenfische und Krebse. Ihr Sauerstofftr\xE4ger enth\xE4lt Kupfer statt Eisen."],["Warum sind Flamingos rosa?","Durch Farbstoffe aus Algen und kleinen Krebsen im Futter. Ohne diese Nahrung werden sie blass."],["Wie schwer ist die Zunge eines Blauwals?","So schwer wie ein ausgewachsener Elefant."],["Wie viele Z\xE4hnchen hat eine Schnecke?","\xDCber 10 000 winzige auf ihrer Raspelzunge \u2014 damit schabt sie Bl\xE4tter ab."],["Wie viel kann eine Ameise tragen?","Das Zehn- bis F\xFCnfzigfache ihres eigenen Gewichts."],["Warum l\xE4uft ein Gecko an einer Glasscheibe hoch?","Millionen feinster H\xE4rchen an den F\xFC\xDFen erzeugen winzige Anziehungskr\xE4fte \u2014 kein Klebstoff, reine Physik."],["Welches Tier kann sein Alter zur\xFCcksetzen?","Die Qualle Turritopsis dohrnii. Sie kann in ein fr\xFCheres Lebensstadium zur\xFCckkehren."],["Welches Tier ist das schnellste der Welt?","Der Wanderfalke \u2014 im Sturzflug \xFCber 300 km/h."],["Warum bekommt ein Specht keine Kopfschmerzen?","Sein Sch\xE4del federt den Aufprall ab, und das Zungenbein liegt wie ein Gurt um das Gehirn."],["Wie viele Muskeln hat ein Elefantenr\xFCssel?","Etwa 40 000. Damit kann er einen Baum umwerfen und eine Erdnuss aufheben."],["Wie lange kommt ein Kamel ohne Wasser aus?","Ein bis zwei Wochen. Danach trinkt es bis zu 100 Liter in wenigen Minuten."],["Warum leuchten Gl\xFChw\xFCrmchen?","Durch eine chemische Reaktion, die fast keine W\xE4rme erzeugt \u2014 kaltes Licht mit riesigem Wirkungsgrad."],["Wozu dienen die Streifen des Zebras?","Sie verwirren stechende Fliegen und l\xF6sen in der Herde die Umrisse des einzelnen Tieres auf."],["Wie gut riecht ein Eisb\xE4r?","Er wittert eine Robbe \xFCber einen Kilometer weit und sogar unter einer Eisschicht."],["K\xF6nnen K\xFChe Freundschaften schlie\xDFen?","Ja. Bei ihrer bevorzugten Partnerin sinkt messbar der Stresspegel."],["Welches Tier hat den gr\xF6\xDFten Augapfel?","Der Riesenkalmar \u2014 sein Auge ist so gro\xDF wie ein Fu\xDFball."],["Warum k\xF6nnen Katzen im Dunkeln so gut sehen?","Eine Spiegelschicht hinter der Netzhaut wirft das Licht ein zweites Mal zur\xFCck. Deshalb leuchten ihre Augen im Scheinwerfer."],["Wie verst\xE4ndigen sich Bienen \xFCber Futterpl\xE4tze?","Mit einem Schw\xE4nzeltanz. Richtung und Dauer verraten Winkel zur Sonne und Entfernung."]])},{category:"Zum Staunen",subject:"Alltag erkl\xE4rt",name:"Warum ist das eigentlich so?",flang:"de-DE",blang:"de-DE",cards:_([["Warum knallt es beim Gewitter?","Der Blitz heizt die Luft schlagartig auf \xFCber 20 000 Grad. Sie dehnt sich explosionsartig aus \u2014 das ist der Donner."],["Wie weit ist ein Gewitter entfernt?","Sekunden zwischen Blitz und Donner z\xE4hlen und durch 3 teilen. Das Ergebnis sind Kilometer."],["Warum ist Schnee wei\xDF, Eis aber durchsichtig?","Schnee besteht aus unz\xE4hligen kleinen Kristallen. Sie streuen alle Farben gleichm\xE4\xDFig zur\xFCck."],["Warum schwimmt ein Schiff aus Stahl?","Weil es mehr Wasser verdr\xE4ngt, als es selbst wiegt. Entscheidend ist die Form, nicht das Material."],["Warum sieht man im Winter den Atem?","Warme, feuchte Atemluft k\xFChlt schlagartig ab. Der Wasserdampf wird zu winzigen Tr\xF6pfchen."],["Warum kocht Wasser am Berg schon unter 100 Grad?","Weil der Luftdruck geringer ist. Das Ei braucht dort oben trotzdem l\xE4nger."],["Warum brennt Chili im Mund?","Der Stoff Capsaicin reizt genau jene Nerven, die sonst Hitze melden. Das Gehirn glaubt an Feuer."],["Was hilft besser gegen Sch\xE4rfe: Wasser oder Milch?","Milch. Capsaicin l\xF6st sich in Fett, nicht in Wasser \u2014 Wasser verteilt es nur."],["Warum weint man beim Zwiebelschneiden?","Die verletzte Zelle setzt eine Schwefelverbindung frei, die mit der Augenfl\xFCssigkeit einen Reizstoff bildet."],["Warum sind Seifenblasen bunt?","Licht spiegelt sich an Vorder- und R\xFCckseite der hauchd\xFCnnen Haut. Die Wellen \xFCberlagern sich und verst\xE4rken einzelne Farben."],["Warum fliegt ein Flugzeug?","Der Fl\xFCgel lenkt Luft nach unten ab. Als Gegenkraft dr\xFCckt es die Maschine nach oben."],["Warum wird ein geparktes Auto so hei\xDF?","Sonnenlicht kommt durch die Scheiben herein, die W\xE4rmestrahlung aber kaum wieder hinaus \u2014 Treibhauseffekt im Kleinen."],["Warum knacken Fingergelenke?","In der Gelenkfl\xFCssigkeit platzt ein Gasbl\xE4schen. Es dauert etwa 20 Minuten, bis es sich neu bildet."],["Warum wird manchen im Auto schlecht?","Das Gleichgewichtsorgan meldet Bewegung, die Augen im Innenraum melden Stillstand. Der Widerspruch macht \xFCbel."],["Warum ist Meerwasser salzig?","Fl\xFCsse l\xF6sen Salze aus Gestein und tragen sie ins Meer. Wasser verdunstet, das Salz bleibt und sammelt sich \xFCber Jahrmillionen."],["Woher kommt Schluckauf?","Das Zwerchfell zuckt unwillk\xFCrlich, die Stimmritze schnappt zu. Das typische Hicks ist dieses Zuschnappen."],["Warum werden Bl\xE4tter im Herbst bunt?","Der Baum holt das gr\xFCne Chlorophyll zur\xFCck. \xDCbrig bleiben gelbe und rote Farbstoffe, die vorher \xFCberdeckt waren."],["Warum sind Golfb\xE4lle nicht glatt?","Die Dellen halten die Luftstr\xF6mung am Ball und verkleinern den Sog dahinter. Er fliegt dadurch fast doppelt so weit wie ein glatter."],["Warum haben Flugzeugfenster runde Ecken?","An eckigen Ecken sammelt sich die Materialspannung. In den 1950ern f\xFChrte das zu Abst\xFCrzen \u2014 seither sind sie rund."],["Warum hallt es in einem leeren Zimmer?","Ohne M\xF6bel, Teppiche und Vorh\xE4nge wird der Schall von den kahlen W\xE4nden immer wieder zur\xFCckgeworfen."]])},{category:"Zum Staunen",subject:"Unglaublich",name:"Kaum zu glauben, aber wahr",flang:"de-DE",blang:"de-DE",cards:_([["Lebte Kleopatra n\xE4her an der Mondlandung oder am Bau der Cheops-Pyramide?","An der Mondlandung. Zwischen ihr und dem Pyramidenbau liegen mehr Jahre als zwischen ihr und uns."],["Wie lange dauert ein Tag auf der Venus?","L\xE4nger als ihr Jahr: 243 Erdtage Drehung gegen\xFCber 225 Tagen Umlauf um die Sonne."],["Warum ist Pluto kein Planet mehr?","Seit 2006 gilt er als Zwergplanet \u2014 er hat seine Umlaufbahn nicht von anderen Objekten freiger\xE4umt."],["Welches Land hat keinen einzigen dauerhaften Fluss?","Saudi-Arabien. Wasser kommt aus Brunnen und Meerwasserentsalzung."],["Wie viele Zeitzonen hat Russland?","Elf. Wenn im Westen die Schule beginnt, ist im Osten schon Abend."],["Welche Stadt hat mehr Br\xFCcken als Venedig und Amsterdam zusammen?","Hamburg \u2014 \xFCber 2500 St\xFCck."],["Wie alt ist das \xE4lteste noch existierende Unternehmen der Welt?","\xDCber 1400 Jahre. Eine japanische Baufirma wurde im Jahr 578 gegr\xFCndet."],["Welche Gem\xFCse sind botanisch eigentlich Fr\xFCchte?","Tomate, Gurke, Paprika, Zucchini und K\xFCrbis \u2014 alle enthalten Samen."],["Wie schnell wachsen Fingern\xE4gel?","Etwa 3,5 Millimeter im Monat. Zehenn\xE4gel brauchen f\xFCr dieselbe Strecke fast viermal so lang."],["Wie viel Zeit verschl\xE4ft ein Mensch im Leben?","Rund ein Drittel \u2014 bei 75 Jahren sind das etwa 25 Jahre."],["Wie oft schl\xE4gt ein Herz in einem ganzen Leben?","Etwa drei Milliarden Mal, ohne eine einzige Pause."],["Wie viel Gold wurde in der ganzen Menschheitsgeschichte gef\xF6rdert?","Alles zusammengeschmolzen erg\xE4be einen W\xFCrfel mit etwa 22 Metern Kantenl\xE4nge."],["Wie viel Rechenleistung hatte der Computer der Mondlandung?","Weniger als ein einfacher Taschenrechner heute. Er hatte etwa 64 Kilobyte Speicher."],["Wie schwer war das erste Mobiltelefon?","Fast ein Kilogramm, und der Akku hielt eine halbe Stunde Gespr\xE4ch."],["Woher hat die Achterbahn ihren Namen?","Fr\xFChe Bahnen waren als liegende Acht gebaut."],["Wie viele W\xF6rter hat die deutsche Sprache?","Der Duden f\xFChrt rund 150 000. Der gesamte Wortschatz wird auf mehrere Hunderttausend gesch\xE4tzt."],["Was passiert mit einem Menschen ohne Schwerkraft?","Er wird im All ein paar Zentimeter gr\xF6\xDFer, weil sich die Bandscheiben entspannen."],["Wie viel Prozent des menschlichen K\xF6rpers ist Wasser?","Etwa 60 Prozent bei Erwachsenen, bei Babys sogar rund 75."],["Warum sieht man auf alten Fotos niemanden lachen?","Die Belichtung dauerte Minuten. Ein L\xE4cheln so lange zu halten war unm\xF6glich."],["Wie lange gibt es die Kartoffel schon in Europa?","Erst seit dem 16. Jahrhundert. Davor kannte niemand hier Pommes oder Erd\xE4pfelsalat."]])},{category:"Zum Staunen",subject:"Knobeln",name:"Knobelfragen f\xFCr unterwegs",flang:"de-DE",blang:"de-DE",cards:_([["Zwei V\xE4ter und zwei S\xF6hne fahren fischen. Jeder f\xE4ngt einen Fisch, zusammen sind es drei. Wie geht das?","Es sind nur drei Personen: Gro\xDFvater, Vater und Sohn. Der Vater ist beides zugleich."],["Was wird nasser, je mehr es trocknet?","Das Handtuch."],["Ein Zug f\xE4hrt nach Norden, der Wind weht nach S\xFCden. In welche Richtung zieht der Rauch?","Gar nicht \u2014 es ist eine Elektrolok."],["Wie oft kann man 25 von 100 abziehen?","Genau einmal. Danach zieht man es von 75 ab."],["Ein Bauer hat 17 Schafe. Alle bis auf 9 laufen weg. Wie viele bleiben?","Neun. Die Frage klingt nur nach Rechnung."],["Was hat einen Hals, aber keinen Kopf?","Die Flasche."],["Was geht nach oben, kommt aber nie wieder herunter?","Das Alter."],["Was ist schwerer: ein Kilo Federn oder ein Kilo Blei?","Beides gleich schwer. Nur das Volumen ist v\xF6llig verschieden."],["F\xFCnf Maschinen brauchen 5 Minuten f\xFCr 5 Teile. Wie lange brauchen 100 Maschinen f\xFCr 100 Teile?","Auch 5 Minuten. Jede Maschine schafft ein Teil in 5 Minuten."],["Seerosen verdoppeln sich t\xE4glich. Nach 48 Tagen ist der See voll. Wann war er halb voll?","Am 47. Tag. Verdopplung hei\xDFt: der letzte Schritt macht die H\xE4lfte aus."],["Schl\xE4ger und Ball kosten zusammen 1,10 \u20AC. Der Schl\xE4ger kostet 1 \u20AC mehr als der Ball. Was kostet der Ball?","5 Cent. Bei 10 Cent w\xE4re die Differenz nur 90 Cent."],["Was geh\xF6rt dir, wird aber fast immer von anderen benutzt?","Dein Name."],["Wie viele Monate haben 28 Tage?","Alle zw\xF6lf \u2014 jeder Monat hat mindestens 28."],["Ein Arzt gibt dir drei Tabletten, alle halbe Stunde eine. Wie lange reichen sie?","Eine Stunde. Die erste nimmst du sofort."],["Was ist leichter als eine Feder, und trotzdem kann es niemand lange halten?","Der Atem."],["Vater und Sohn verungl\xFCcken. Der Chirurg sagt: Das ist mein Sohn, ich kann nicht operieren. Wie geht das?","Der Chirurg ist die Mutter. Die meisten stolpern nur \xFCber ihr eigenes Bild im Kopf."],["Was geht am Morgen auf vier Beinen, mittags auf zwei und abends auf drei?","Der Mensch: krabbelnd, gehend, und im Alter mit Stock. Das R\xE4tsel der Sphinx."],["Wie viele Geburtstage hat ein Mensch?","Genau einen. Alle weiteren sind Jahrestage davon."],["Was kann man nie zum Fr\xFChst\xFCck essen?","Mittag- und Abendessen."],["Ein Mann wohnt im zehnten Stock. Nach oben f\xE4hrt er nur bis zum siebten und geht den Rest. Au\xDFer wenn es regnet. Warum?","Er ist zu klein f\xFCr den obersten Knopf. Bei Regen hat er einen Schirm dabei."]])},{category:"Zum Staunen",subject:"Smalltalk",name:"Fakten f\xFCrs Smalltalk",flang:"de-DE",blang:"de-DE",cards:_([["Wie viele Herzen hat ein Krake?","Drei \u2014 zwei f\xFCr die Kiemen, eins f\xFCr den K\xF6rper."],["Welcher Planet dreht sich r\xFCckw\xE4rts?","Die Venus \u2014 die Sonne geht dort im Westen auf."],["Wie lange dauerte der k\xFCrzeste Krieg der Geschichte?","Rund 38 Minuten (England\u2013Sansibar, 1896)."],["Kann Honig schlecht werden?","Praktisch nie \u2014 er h\xE4lt \xFCber Jahrtausende."],["Wie viele Knochen hat ein erwachsener Mensch?","206."],["Bananen sind botanisch gesehen \u2026?","Beeren. Erdbeeren dagegen nicht."],["Welche Farbe hat ein Sonnenuntergang auf dem Mars?","Bl\xE4ulich."],["Wie alt kann ein Gr\xF6nlandhai werden?","\xDCber 250, wom\xF6glich 400 Jahre."],["Wie viele Sprachen gibt es weltweit?","Rund 7.000."],["Warum ist der Himmel blau?","Blaues Licht wird von der Luft am st\xE4rksten gestreut (Rayleigh-Streuung)."],["Wie schwer ist eine mittlere Sch\xF6nwetterwolke?","Mehrere hundert Tonnen Wasser."],["Welches Land hat die meisten Zeitzonen?","Frankreich \u2014 12, dank der \xDCberseegebiete."],["Wie schnell rennt ein Gepard?","Bis zu 100\u2013120 km/h."],["Was war zuerst da: die Uni Oxford oder das Aztekenreich?","Oxford \u2014 es lehrte schon um 1096."],["Wie viele Menschen haben heute Geburtstag?","Rund 21 Millionen (etwa 1/365 der Menschheit)."],["Welches Organ erneuert sich am schnellsten?","Die Darmschleimhaut \u2014 alle paar Tage."]])}],Te=[.4197,1.1869,3.0412,15.2441,7.1434,.6477,1.0007,.0674,1.6597,.1712,1.1178,2.0225,.0904,.3025,2.1214,.2498,2.9466],Pm=-.5,eg=19/81,bp=.9,ng=e=>Math.min(10,Math.max(1,e)),pp=e=>Math.max(.1,Te[e-1]),tg=e=>ng(Te[4]-Math.exp(Te[5]*(e-1))+1),vp=(e,n)=>Math.pow(1+eg*e/n,Pm),yp=(e,n)=>ng(Te[7]*tg(4)+(1-Te[7])*(e-Te[6]*(n-3))),Sp=(e,n,t,a)=>{let l=a===2?Te[15]:1,i=a===4?Te[16]:1,u=Math.exp(Te[8])*(11-e)*Math.pow(n,-Te[9])*(Math.exp((1-t)*Te[10])-1)*l*i;return Math.max(.1,n*(1+u))},zp=(e,n,t)=>{let a=Te[11]*Math.pow(e,-Te[12])*(Math.pow(n+1,Te[13])-1)*Math.exp((1-t)*Te[14]);return Math.max(.1,Math.min(a,n))},Zm=e=>Math.min(3650,Math.max(1,Math.round(e/eg*(Math.pow(bp,1/Pm)-1))));function _u(e,n,t){if(e.s==null){let s=pp(n),c=tg(n);return{s,d:c,intervalDays:Zm(s)}}let a=Math.max(0,(t-(e.last||t))/Ou),l=vp(a,e.s),i=yp(e.d,n),u=n===1?zp(e.d,e.s,l):Sp(e.d,e.s,l,n);return{s:u,d:i,intervalDays:Zm(u)}}var Jt=e=>!e.due||e.due<=Date.now();function Vm(e){if(e=Math.max(1,Math.round(e)),e===1)return"morgen";if(e<7)return`in ${e} Tagen`;if(e<30){let t=Math.round(e/7);return t<=1?"in 1 Woche":`in ${t} Wochen`}if(e<365){let t=Math.round(e/30);return t<=1?"in 1 Monat":`in ${t} Monaten`}let n=e/365;return n<1.5?"in 1 Jahr":`in ${Math.round(n)} Jahren`}var Hc=[{key:"neu",label:"Neu"},{key:"lernend",label:"Lernend"},{key:"jung",label:"Jung"},{key:"reif",label:"Reif"},{key:"fest",label:"Fest"}];function Hu(e){return e.s==null?"neu":e.s<7?"lernend":e.s<30?"jung":e.s<180?"reif":"fest"}var kp=e=>Hc.find(n=>n.key===Hu(e)).label;function wp(e){let n={v:1,name:e.name,cards:e.cards.map(t=>({f:t.front,b:t.back,fl:t.flang,bl:t.blang}))};return"KBX1:"+btoa(encodeURIComponent(JSON.stringify(n)))}function xp(e){let n=e.trim().replace(/^KBX1:/,""),t=JSON.parse(decodeURIComponent(atob(n)));return{id:mn(),name:t.name||"Geteilte Kartei",cards:(t.cards||[]).map(a=>({id:mn(),front:a.f,back:a.b,flang:a.fl||"en-US",blang:a.bl||"de-DE",due:0}))}}var Ep=_([["Hallo. Wer bist du denn? \u{1FAB6}","Ich bin Robin. Ich merke mir f\xFCr dich, was du dir merken willst \u2014 und melde mich genau dann, wenn du es sonst vergessen w\xFCrdest. Mehr mache ich nicht. Das mache ich daf\xFCr ordentlich."],["F\xFCr wen ist das hier gedacht?","F\xFCr alle, die etwas lernen wollen \u2014 oder m\xFCssen. Schule, Lehre, Studium, Pr\xFCfung, neue Sprache, neuer Job, neues Land. Robin fragt nicht nach deinem Alter und nicht nach deinem Zeugnis."],["Und was ist eure Mission, ganz ehrlich?","Ein richtig gutes Lernsystem f\xFCr alle. \xDCberall. \u{1F30D} Ob jemand lernen kann, soll nicht davon abh\xE4ngen, wo man wohnt, was man verdient oder ob gerade Netz da ist."],["Woher wei\xDFt du, wann ich etwas wiederholen soll?","Ein Ged\xE4chtnismodell aus der Forschung sch\xE4tzt, wann eine Karte bei dir zu verblassen beginnt \u2014 und legt sie dir genau dann wieder hin."],["Warum kommt manches erst in drei Wochen wieder?","Weil du es bis dahin fast vergessen h\xE4ttest. Genau dieser Moment bringt am meisten. Fr\xFCher w\xE4re nur nett, aber Zeitverschwendung."],["Das sieht aus wie Papier. Wo ist die ganze Technik?","Unter der ruhigen Oberfl\xE4che: Ged\xE4chtnismodell, Spracherkennung, Vorlesen \u2014 alles direkt auf deinem Ger\xE4t. Gute Technik arbeitet, statt sich in den Vordergrund zu dr\xE4ngen."],["Muss ich mich anmelden?","Nein. Kein Konto, keine E-Mail, kein \u201ERegistriere dich, um fortzufahren\u201C. Wir wissen nicht, wer du bist \u2014 und wollen es ehrlich gesagt auch gar nicht wissen."],["Wo landen meine Daten?","Auf deinem Ger\xE4t. Sonst nirgends. Es gibt keinen Server, der sie einsammeln k\xF6nnte \u2014 damit beantwortet sich \u201Ewer sieht das eigentlich?\u201C von selbst."],["Was kostet das?","Einmal wenig, dann nie wieder. Kein Abo, keine Werbung, keine Bezahlschranke, die mitten im Lernen aufpoppt. Du bist hier nicht das Produkt."],["Wer steckt dahinter?","Menschen. Keine Konzernabteilung, kein Investorenplan. Angefangen hat es am K\xFCchentisch, weil ordentliches Lernen nicht am Geldbeutel h\xE4ngen sollte."],["Wie lege ich eine Karte an?","Auf \u201E+ Karte\u201C tippen, Vorderseite einsprechen oder schreiben, mit \u27F3 umdrehen, R\xFCckseite dazu. Zwanzig Sekunden, fertig."],["Ich habe hier ein ganzes Skript. Alles abtippen?","Blo\xDF nicht. \u201EFotos zu Karten\u201C: Seite fotografieren, den Text vom Handy erkennen lassen, einf\xFCgen. Klappt mit Buchseiten, Skripten und deiner eigenen Mitschrift."],["Wozu der Mikrofon-Knopf beim Lernen?","Sag die Antwort laut, bevor du umdrehst. Selbst erinnern ist m\xFChsamer als wiedererkennen \u2014 und genau deshalb bleibt es h\xE4ngen. Wer lieber still \xFCberlegt, tippt einfach auf die Karte."],["Heute habe ich ehrlich keine Lust.","Dann lass es. Keine Serie, die rei\xDFt, kein rotes Ausrufezeichen, kein schlechtes Gewissen. Ich warte. Und wenn es mal nur f\xFCnf Minuten in der Stra\xDFenbahn sind: auch gut. \u2615"],["Was ist \u201ELichter aus\u201C?","Ein kleines R\xE4tsel zum Ankommen: 25 Felder, ein Tipp schaltet Feld und Nachbarn, Ziel ist alles dunkel. Ohne Punkte, ohne Uhr, ohne tieferen Sinn."],["Was ist \u201EZum Staunen\u201C?","Fragen f\xFCrs gemeinsame Raten \u2014 Autofahrt, Wartezimmer, Abendessen. Funktioniert mit Zehnj\xE4hrigen genauso wie mit Gro\xDFeltern, und alle nehmen etwas mit. \u{1F92F}"],["Kann ich meine Karten weitergeben?","Ja, als Code \u2014 an die Lerngruppe, die Klasse, die Kollegin. Den verschickst du selbst. Ich verschicke nichts und kenne deine Kontakte nicht."],["Und wenn ich kein Internet habe?","Dann l\xE4uft trotzdem alles. Einmal geladen, funktioniert Robin im Zug, im Keller und auf der Almh\xFCtte. Nur f\xFCrs Einsprechen braucht dein Handy kurz Netz."],["Gut. Und jetzt?","Zur\xFCck zur Startseite, in die Bibliothek schauen oder gleich die erste eigene Karte anlegen. Viel Spa\xDF beim Lernen \u2014 Rock \u2019n\u2019 Roll. \u{1F918}"]]),qm=()=>[{id:mn(),name:"Hallo! Robin in 2 Minuten",recall:!1,cards:Ep.map(e=>({id:mn(),front:e.f,back:e.b,flang:"de-DE",blang:"de-DE",due:0}))}];function
