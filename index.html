 Grundform und Partizip gleich \u2014 das kommt \xF6fter vor und spart Arbeit."],["give \u2014 gave \u2014 given","geben"],["make \u2014 made \u2014 made","machen, herstellen","\u201Emake\u201C hei\xDFt herstellen, \u201Edo\u201C hei\xDFt tun. \u201EMake a cake\u201C \u2014 der Kuchen entsteht neu. \u201EDo the homework\u201C \u2014 die Aufgabe war schon da."],["write \u2014 wrote \u2014 written","schreiben"],["speak \u2014 spoke \u2014 spoken","sprechen"],["buy \u2014 bought \u2014 bought","kaufen"],["think \u2014 thought \u2014 thought","denken","Achtung bei der Aussprache: \u201Ethought\u201C klingt wie \u201Ethort\u201C, das gh ist stumm."],["bring \u2014 brought \u2014 brought","bringen"],["find \u2014 found \u2014 found","finden"],["know \u2014 knew \u2014 known","wissen, kennen","Englisch unterscheidet nicht zwischen wissen und kennen \u2014 beides ist \u201Eknow\u201C. Deutschsprachige machen hier oft den umgekehrten Fehler."],["begin \u2014 began \u2014 begun","beginnen"],["drink \u2014 drank \u2014 drunk","trinken"]])},{category:"Unterstufe 1",subject:"Englisch",name:"Present Simple oder Present Progressive?",flang:"en-US",blang:"de-DE",cards:B([["Wann benutzt man das Present Simple?","F\xFCr Gewohnheiten und Dauerhaftes.","\u201EI play football every Tuesday.\u201C Signalw\xF6rter: always, usually, often, every day, never."],["Wann benutzt man das Present Progressive?","F\xFCr das, was gerade jetzt passiert.","\u201EI am playing football right now.\u201C Signalw\xF6rter: now, at the moment, look!, listen!"],["Wie bildet man das Present Progressive?","Mit am/is/are und der -ing-Form.","I am working, he is working, they are working. Die Form von \u201Eto be\u201C richtet sich nach der Person."],["Was passiert im Present Simple bei he, she, it?","Das Verb bekommt ein -s.","\u201EHe plays\u201C, \u201Eshe works\u201C, \u201Eit rains\u201C. Die Merkregel hei\xDFt: he, she, it \u2014 das s muss mit."],["\xDCbersetze: \u201ESie liest gerade ein Buch.\u201C","She is reading a book.","\u201EGerade\u201C verlangt das Progressive. Mit \u201EShe reads a book\u201C w\xFCrde man sagen, dass sie generell B\xFCcher liest."],["\xDCbersetze: \u201EIch gehe jeden Tag zur Schule.\u201C","I go to school every day.","\u201EJeden Tag\u201C ist eine Gewohnheit, also Present Simple \u2014 nicht \u201EI am going\u201C."],["Warum ist \u201EI am knowing the answer\u201C falsch?","Weil \u201Eknow\u201C ein Zustandsverb ist.","Zustandsverben wie know, like, want, believe, understand stehen nie in der Verlaufsform. Man kann Wissen nicht \u201Egerade tun\u201C."],["Wie verneint man \u201EHe plays tennis\u201C?","He does not play tennis.","Das -s wandert zum Hilfsverb: does. Danach steht die Grundform ohne -s. Ein h\xE4ufiger Fehler ist \u201EHe doesn't plays\u201C."],["Wie fragt man nach \u201EThey live in Vienna\u201C?","Do they live in Vienna?","Im Present Simple braucht man do oder does f\xFCr Fragen. Nur bei \u201Eto be\u201C nicht: \u201EAre they happy?\u201C"],["Was ist bei der -ing-Form von \u201Ewrite\u201C zu beachten?","Das stumme e f\xE4llt weg: writing.","Ebenso: make \u2192 making, come \u2192 coming. Bei \u201Erun\u201C dagegen wird der Endkonsonant verdoppelt: running."]])},{category:"Medien",subject:"Wie Apps dich halten",name:"Die Tricks im Design",flang:"de-DE",blang:"de-DE",cards:B([["Was ist \u201Eendloses Scrollen\u201C?","Eine Liste ohne Ende \u2014 es kommt immer noch etwas nach.","Erfunden hat es Aza Raskin im Jahr 2006. Er hat sich sp\xE4ter \xF6ffentlich daf\xFCr entschuldigt. Sein Punkt: Fr\xFCher war eine Seite zu Ende, und dieses Ende war der Moment, in dem man aufh\xF6ren konnte. Ohne Ende fehlt dieser Moment \u2014 man h\xF6rt nicht auf, weil man genug hat, sondern weil etwas dazwischenkommt."],["Warum sieht das Nachladen bei vielen Apps aus wie ein Hebelziehen?","Weil es dem Spielautomaten nachempfunden ist.","Man zieht nach unten, es dreht sich kurz \u2014 und dann kommt etwas Neues. Oder auch nicht. Genau diese Unsicherheit ist der Reiz. Beim Spielautomaten hei\xDFt das Prinzip variable Belohnung, und es h\xE4lt Menschen nachweislich l\xE4nger bei der Sache als eine sichere Belohnung."],["Warum ist es spannender, wenn man NICHT wei\xDF, was kommt?","Weil unser Gehirn auf Unsicherheit st\xE4rker anspringt als auf Sicherheit.","Ein Briefkasten, in dem sicher nichts liegt, wird nicht kontrolliert. Einer, in dem vielleicht etwas liegt, st\xE4ndig. Apps bauen genau diese Unsicherheit ein: mal ist etwas Tolles da, mal nichts."],["Was macht Autoplay?","Es startet das n\xE4chste Video von allein.","Damit verschwindet die Entscheidung. Wer weiterschauen will, muss nichts tun \u2014 wer aufh\xF6ren will, muss aktiv werden. Das klingt nach einem Detail, dreht aber die Richtung um: Aufh\xF6ren kostet pl\xF6tzlich Kraft."],["Was ist eine Serie oder ein \u201EStreak\u201C?","Eine Z\xE4hlung, die abrei\xDFt, wenn man einen Tag aussetzt.","Der Trick liegt nicht im Gewinnen, sondern im Verlieren: Nach 100 Tagen will niemand bei null anfangen. Man kommt dann nicht mehr, weil es Freude macht, sondern damit die Zahl nicht kaputtgeht."],["Warum kommen Benachrichtigungen oft abends?","Weil dann viele Menschen Zeit haben \u2014 und weil sie zur\xFCckholen sollen.","Der Zeitpunkt ist nicht zuf\xE4llig, sondern berechnet. Eine Nachricht, die niemanden erreicht, w\xE4re verschwendet."],["Was bedeutet ein roter Punkt auf einem App-Symbol?","Er soll das Gef\xFChl erzeugen, dass etwas Unerledigtes wartet.","Rot ist die Farbe f\xFCr Warnung. Unser Blick springt automatisch dorthin. Bei den meisten dieser Punkte wartet aber nichts Wichtiges \u2014 es ist eine Einladung, die wie eine Pflicht aussieht."],["Warum zeigen viele Apps, wenn jemand deine Nachricht gelesen hat?","Weil das Druck erzeugt, schnell zu antworten.","F\xFCr die Unterhaltung ist es meist unwichtig. Aber es macht aus einer freundlichen Nachricht eine offene Rechnung \u2014 und h\xE4lt beide Seiten in der App."],["Was ist ein Algorithmus im Zusammenhang mit Apps?","Eine Rechenvorschrift, die entscheidet, was du als N\xE4chstes zu sehen bekommst.","Er lernt aus dem, was du anschaust und wie lange. Wichtig zu wissen: Er sucht nicht das Beste f\xFCr dich, sondern das, was dich am l\xE4ngsten dabei h\xE4lt. Das ist manchmal dasselbe \u2014 oft aber nicht."],["Warum bekommen zwei Menschen bei derselben App v\xF6llig Verschiedenes zu sehen?","Weil jeder seinen eigenen berechneten Kanal hat.","Es gibt keine gemeinsame Sendung wie fr\xFCher beim Fernsehen. Das hei\xDFt auch: Was du f\xFCr \u201Edas Internet\u201C h\xE4ltst, ist ein Ausschnitt, den jemand f\xFCr dich zusammengestellt hat."],["Was ist \u201EFOMO\u201C?","Die Angst, etwas zu verpassen \u2014 von englisch \u201Efear of missing out\u201C.","Sie entsteht, wenn man st\xE4ndig sieht, was andere gerade machen. Fr\xFCher wusste man am Montag, was am Wochenende los war. Heute sieht man es in dem Moment, in dem man nicht dabei ist."],["Warum wirkt das Leben anderer Leute online oft besser als das eigene?","Weil man ihre besten Momente mit dem eigenen Alltag vergleicht.","Niemand postet den langweiligen Dienstagnachmittag. Man sieht bei anderen die H\xF6hepunkte aus Monaten und bei sich selbst alles. Der Vergleich ist unfair aufgebaut, auch wenn niemand l\xFCgt."]])},{category:"Medien",subject:"Wie Apps dich halten",name:"Warum das alles gemacht wird",flang:"de-DE",blang:"de-DE",cards:B([["Womit verdienen kostenlose Apps ihr Geld?","Meist mit Werbung.","Sie verkaufen nicht die App, sondern die Aufmerksamkeit ihrer Nutzer an Firmen, die etwas bewerben wollen. Deshalb der alte Satz: Wenn du nicht bezahlst, bist du nicht die Kundin, sondern die Ware."],["Warum ist Zeit f\xFCr eine Werbe-App wertvoll?","Je l\xE4nger jemand bleibt, desto mehr Werbung kann gezeigt werden.","Aus dieser einen Tatsache folgt fast alles andere: endloses Scrollen, Autoplay, Benachrichtigungen. Es ist kein b\xF6ser Plan, sondern eine sehr direkte Rechnung."],["Was wird \xFCber dich gesammelt, wenn du eine App benutzt?","Zum Beispiel, was du anschaust, wie lange, wann und von wo aus.","Daraus entsteht ein Profil, das erstaunlich genau ist \u2014 auch ohne deinen Namen. Es geht nicht darum, wer du bist, sondern darum, was dich zum Anhalten bringt."],["Was ist personalisierte Werbung?","Werbung, die auf dich zugeschnitten ist.","Wenn zwei Personen dieselbe App \xF6ffnen, sehen sie verschiedene Anzeigen. Bei Kindern und Jugendlichen ist das in der EU stark eingeschr\xE4nkt \u2014 genau deshalb, weil es besonders gut wirkt."],["Was ist ein \u201EIn-App-Kauf\u201C?","Ein Kauf innerhalb einer App, oft f\xFCr Spielvorteile oder Aussehen.","H\xE4ufig zahlt man mit einer Zwischenw\xE4hrung \u2014 M\xFCnzen, Kristalle, Diamanten. Das ist Absicht: Bei \u201E1200 Juwelen\u201C merkt man schlechter, wie viel echtes Geld gerade weggeht."],["Was ist eine \u201ELootbox\u201C?","Eine Kiste im Spiel, deren Inhalt man erst nach dem \xD6ffnen kennt.","Man zahlt f\xFCr eine Chance, nicht f\xFCr eine Sache. Mehrere L\xE4nder pr\xFCfen deshalb, ob das rechtlich Gl\xFCcksspiel ist. In Belgien sind Lootboxen weitgehend verboten."],["Warum sind Spiele f\xFCr Kinder oft gratis, kosten am Ende aber Geld?","Weil der Einstieg leicht sein soll und das Zahlen sp\xE4ter kommt.","Wer schon drei\xDFig Stunden investiert hat, gibt eher etwas aus als jemand, der die App gerade erst installiert. Das Modell hei\xDFt Free-to-play und ist genau darauf gebaut."],["Was ist der Unterschied zwischen einer Empfehlung und Werbung?","Werbung ist bezahlt, eine Empfehlung nicht \u2014 man sieht es aber oft nicht.","Deshalb schreibt das Gesetz vor, dass bezahlte Beitr\xE4ge gekennzeichnet werden m\xFCssen: Werbung, Anzeige. Steht das nicht dabei, ist es ein Regelversto\xDF \u2014 und ein Hinweis darauf, dass jemand es dir nicht sagen wollte."],["Woran erkennst du bezahlte Beitr\xE4ge?","An Kennzeichnungen wie Werbung, Anzeige oder gesponsert.","W\xF6rter wie \u201EKooperation\u201C, \u201EDanke an \u2026\u201C oder ein Rabattcode sind ebenfalls Hinweise. Ein Rabattcode hei\xDFt fast immer, dass mitverdient wird."]])},{category:"Medien",subject:"Kopf & K\xF6rper",name:"Was zu viel wirklich macht",flang:"de-DE",blang:"de-DE",cards:B([["Kann man wirklich mehrere Dinge gleichzeitig tun?","Nein \u2014 man wechselt sehr schnell hin und her.","Das Gehirn schaltet um, statt parallel zu arbeiten. Jeder Wechsel kostet einen Moment, um wieder hineinzufinden. Deshalb dauert Hausaufgaben-mit-Handy-daneben l\xE4nger als Hausaufgaben ohne \u2014 und das Ergebnis wird schlechter."],["Warum st\xF6rt ein Handy schon, wenn es nur daneben liegt?","Weil ein Teil der Aufmerksamkeit bei der Frage bleibt, ob etwas kommt.","Man muss gar nicht draufschauen. Schon das Wissen, dass jederzeit etwas kommen kann, bindet Aufmerksamkeit. In eine andere Ecke legen wirkt besser als umdrehen."],["Warum schlafen viele Jugendliche zu wenig?","Oft, weil abends noch etwas Interessantes kommt \u2014 nicht wegen des Bildschirmlichts.","\xDCber Blaulicht wird viel geredet, seine Wirkung ist aber kleiner als gedacht. Der gr\xF6\xDFere Effekt ist einfacher: Wer bis Mitternacht scrollt, ist bis Mitternacht wach. Die Zeit fehlt, nicht die Farbe."],["Wie viel Schlaf brauchen die meisten Jugendlichen?","Etwa acht bis zehn Stunden pro Nacht.","Das ist mehr als Erwachsene brauchen. In der Pubert\xE4t verschiebt sich zus\xE4tzlich die innere Uhr nach hinten \u2014 Jugendliche werden sp\xE4ter m\xFCde und m\xFCssten eigentlich sp\xE4ter aufstehen. Der Schulbeginn macht die Rechnung dann kaputt."],["Stimmt es, dass Handys \u201Es\xFCchtig\u201C machen wie Drogen?","Der Vergleich hinkt \u2014 aber die Mechanismen sind teilweise \xE4hnlich.","Fachleute sind sich uneinig, ob man von Sucht sprechen soll. Unstrittig ist: Manche Menschen verlieren die Kontrolle \xFCber ihre Nutzung und leiden darunter. Ob man es Sucht nennt, \xE4ndert nichts daran, dass man dann Hilfe holen darf."],["Was ist Dopamin \u2014 und was ist es nicht?","Ein Botenstoff f\xFCr Erwartung und Antrieb, kein \u201EGl\xFCckshormon\u201C.","Es wird ausgesch\xFCttet, BEVOR etwas kommt \u2014 es treibt zum Nachschauen an. Deshalb ist \u201EDopamin-Fasten\u201C ein irref\xFChrendes Schlagwort: Man kann Dopamin nicht abstellen, es steuert auch Lernen und Bewegung."],["Was sagt die Forschung zum Zusammenhang von Bildschirmzeit und Wohlbefinden?","Es gibt einen Zusammenhang, aber er ist \xFCberraschend klein.","Eine gro\xDFe Untersuchung von 2019 fand einen Effekt in derselben Gr\xF6\xDFenordnung wie beim Kartoffelessen oder Brilletragen. Das hei\xDFt nicht, dass es egal ist \u2014 aber die einfache Rechnung \u201Emehr Stunden gleich ungl\xFCcklicher\u201C stimmt so nicht."],["Warum ist WAS man tut wichtiger als WIE LANGE?","Weil aktive und passive Nutzung verschieden wirken.","Mit Freunden schreiben, etwas bauen, etwas lernen \u2014 das ist etwas anderes als stundenlang durchzuwischen, ohne dass h\xE4ngen bleibt. Eine reine Stundenzahl sagt wenig dar\xFCber, wie es einem danach geht."],["Woran merkst du selbst, dass es zu viel war?","Zum Beispiel: Du wolltest kurz schauen und zwei Stunden sind weg.","Weitere Zeichen: Du bist danach gereizt statt erholt, du greifst zum Handy, sobald es kurz langweilig wird, oder du kannst nicht sagen, was du eigentlich gesehen hast. Das sind bessere Hinweise als jede Stundenvorgabe."],["Warum f\xFChlt man sich nach langem Scrollen oft leer?","Weil viele kleine Reize kamen, aber nichts davon geblieben ist.","Das Gehirn hat gearbeitet, aber nichts aufgebaut. Anders als nach einem Buch, einem Spiel mit Freunden oder etwas Selbstgemachtem \u2014 da bleibt etwas \xFCbrig."]])},{category:"Medien",subject:"Kopf & K\xF6rper",name:"Was du dagegen tun kannst",flang:"de-DE",blang:"de-DE",cards:B([["Was ist die wirksamste einzelne Ma\xDFnahme?","Benachrichtigungen ausschalten \u2014 bis auf die von echten Menschen.","Nachrichten von Freundinnen und Freunden d\xFCrfen bleiben. Alles, was von einer App selbst kommt (\u201ESchau, was du verpasst hast\u201C), darf weg. Damit entscheidest du, wann du hinschaust \u2014 nicht die App."],["Warum hilft es, das Handy nachts aus dem Zimmer zu nehmen?","Weil es dann keine Entscheidung mehr gibt, die man abends treffen muss.","Willenskraft ist am Abend am schw\xE4chsten. Eine Entscheidung, die man einmal trifft \u2014 Handy l\xE4dt in der K\xFCche \u2014 schl\xE4gt eine, die man jeden Abend neu treffen muss."],["Was bringt es, den Bildschirm auf Graustufen zu stellen?","Farben sind ein gro\xDFer Teil des Reizes \u2014 ohne sie wird Scrollen langweiliger.","Man kann es in den Bedienungshilfen einstellen. Es ist kein Wundermittel, aber viele merken sofort, dass das Handy weniger anzieht."],["Warum ist \u201Eab jetzt gar kein Handy mehr\u201C meist keine gute Idee?","Weil solche Vors\xE4tze fast immer scheitern und danach alles noch schlimmer wirkt.","Besser ist eine kleine, feste Regel, die man wirklich durchh\xE4lt \u2014 etwa: beim Essen liegt das Handy woanders. Eine kleine Regel, die h\xE4lt, ist mehr wert als eine gro\xDFe, die bricht."],["Was ist ein guter Ersatz, wenn Langeweile aufkommt?","Alles, wobei etwas entsteht oder man sich bewegt.","Langeweile ist nicht der Feind \u2014 aus ihr entstehen Ideen. Wer sie sofort wegwischt, kommt nie an den Punkt, an dem einem etwas einf\xE4llt."],["Wie kannst du herausfinden, wie viel Zeit du wirklich verbringst?","Handys zeigen es unter Bildschirmzeit oder Digitales Wohlbefinden.","Die meisten sch\xE4tzen deutlich zu niedrig. Nachschauen ist unangenehm und genau deshalb n\xFCtzlich \u2014 man kann nur \xE4ndern, was man kennt."],["Was hilft beim Hausaufgabenmachen?","Das Handy in einen anderen Raum legen, nicht nur umdrehen.","Entfernung wirkt besser als Disziplin. Wenn Aufstehen n\xF6tig ist, um nachzuschauen, passiert es viel seltener."],["Warum ist es sinnvoll, Serien und Videos bewusst zu beenden?","Weil man sonst nicht aufh\xF6rt, sondern aufgehalten wird.","Sich vorher zu \xFCberlegen \u201Ezwei Folgen, dann ist Schluss\u201C ist etwas anderes, als zu warten, bis man von selbst genug hat. Bei Autoplay kommt dieser Punkt n\xE4mlich nicht."],["Was kannst du tun, wenn dich ein Kanal regelm\xE4\xDFig schlecht f\xFChlen l\xE4sst?","Entfolgen oder stummschalten \u2014 auch bei Leuten, die du kennst.","Das ist kein Streit und muss niemandem erkl\xE4rt werden. Du bestimmst, was dir t\xE4glich gezeigt wird."]])},{category:"Medien",subject:"Miteinander",name:"Wenn es unangenehm wird",flang:"de-DE",blang:"de-DE",cards:B([["Was ist Cybermobbing?","Wenn jemand online wiederholt fertiggemacht, blo\xDFgestellt oder ausgeschlossen wird.","Der Unterschied zum Streit: Es ist einseitig, es wiederholt sich, und es h\xF6rt nicht am Schultor auf. Genau das macht es so schwer \u2014 es gibt keinen Ort mehr, an dem man sicher ist."],["Was solltest du zuerst tun, wenn dich jemand online fertigmacht?","Screenshots machen, bevor du irgendetwas l\xF6schst.","Der erste Impuls ist oft, alles wegzumachen. Aber ohne Belege ist es sp\xE4ter schwer, etwas zu unternehmen. Erst sichern, dann blockieren, dann melden."],["Warum ist Zur\xFCckschreiben meist keine gute Idee?","Weil eine Reaktion genau das ist, worauf es abgesehen war.","Wer provoziert, sucht eine Reaktion. Bleibt sie aus, wird es oft langweilig. Und wer selbst beleidigt, steht am Ende schlechter da \u2014 auch wenn er im Recht war."],["Wem kannst du es sagen, wenn dir online etwas passiert?","Einer erwachsenen Person, der du vertraust \u2014 Eltern, Lehrkraft, \xE4ltere Geschwister.","Viele schweigen aus Angst, das Handy wegnehmen zu lassen. Sag das ruhig dazu: \u201EIch erz\xE4hl dir was, aber bitte nimm mir nicht das Handy weg.\u201C Schweigen macht es immer schlimmer."],["Welche Nummer hilft in \xD6sterreich rund um die Uhr, kostenlos und anonym?","147 \u2014 Rat auf Draht.","Ohne Vorwahl, von jedem Telefon, Tag und Nacht. Auch per Chat auf rataufdraht.at. Man muss keinen Namen sagen, und es kostet nichts."],["Welche Nummer hilft in Deutschland Kindern und Jugendlichen?","116 111 \u2014 die Nummer gegen Kummer.","Kostenlos und anonym. Es gibt dort auch eine eigene Beratung von Jugendlichen f\xFCr Jugendliche."],["Was tust du, wenn dir jemand ein Nacktbild von einer anderen Person schickt?","Nicht weiterleiten, nicht speichern, l\xF6schen \u2014 und einer erwachsenen Person sagen.","Weiterleiten kann strafbar sein, auch wenn man es nur einmal weitergibt und selbst nichts damit zu tun hat. Und f\xFCr die abgebildete Person ist jede Weitergabe eine weitere Verletzung."],["Was ist, wenn dich jemand mit einem Bild erpresst?","Nicht zahlen, nichts nachschicken, Kontakt abbrechen \u2014 und sofort Hilfe holen.","Diese Masche hei\xDFt Sextortion und trifft sehr viele. Wer zahlt, wird weiter erpresst. Es ist nicht deine Schuld, auch wenn du das Bild selbst geschickt hast. Polizei und 147 kennen solche F\xE4lle t\xE4glich."],["Warum sollte man Fremden online keine pers\xF6nlichen Angaben geben?","Weil man nie sicher wei\xDF, wer wirklich schreibt.","Ein Profilbild beweist nichts. Schule, Wohnort, Nachname und Stundenplan zusammen gen\xFCgen, um jemanden zu finden. Einzeln wirkt jede Angabe harmlos."],["Was bedeutet es, wenn jemand online besonders schnell besonders nett ist?","Vorsicht \u2014 genau so beginnt oft eine Anbahnung.","Viele Komplimente, schnelles Geheimhalten (\u201ESag das keinem\u201C), Geschenke, und dann eine Bitte. Das Muster hei\xDFt Grooming. Kein Erwachsener mit guten Absichten bittet ein Kind darum, etwas geheim zu halten."],["Wie erkennst du, ob ein Bild oder Video echt ist?","Gar nicht mehr sicher \u2014 deshalb ist die Quelle wichtiger als das Bild.","Mit k\xFCnstlicher Intelligenz lassen sich Bilder, Stimmen und Videos herstellen, die echt aussehen. Die bessere Frage ist: Wer sagt das, und wo steht es noch? Eine einzelne Quelle ist keine Best\xE4tigung."],["Was solltest du tun, bevor du etwas Emp\xF6rendes weiterleitest?","Kurz warten und nachsehen, ob es stimmt.","Falschmeldungen verbreiten sich schneller als Richtigstellungen, weil Emp\xF6rung antreibt. Die Frage \u201EWer profitiert davon, dass ich das jetzt weiterschicke?\u201C hilft oft weiter."]])},{category:"Medien",subject:"Miteinander",name:"Pr\xFCf diese App",flang:"de-DE",blang:"de-DE",recall:!1,cards:B([["Du kennst jetzt die Tricks. Pr\xFCfen wir diese App: Gibt es hier endloses Scrollen?","Nein. Eine Lerneinheit ist bei 20 Karten zu Ende.","Danach kommt kein \u201Enur noch eine\u201C. Das Ende ist Absicht \u2014 es ist der Moment, an dem du entscheiden kannst, ob du weitermachst."],["Gibt es hier eine Serie, die abrei\xDFt, wenn du einen Tag aussetzt?","Nein. Es gibt gar keine Serie.","Du kannst zwei Wochen nicht kommen, und hier ist nichts kaputt. Gezeigt werden nur Zahlen, die wachsen k\xF6nnen \u2014 nie welche, die fallen. Was fallen kann, bestraft die R\xFCckkehr."],["Bekommst du Benachrichtigungen, die dich zur\xFCckholen sollen?","Nein. Diese App schickt dir nichts.","Sie meldet sich nie von selbst. Du kommst, wenn du willst."],["Wird hier Werbung gezeigt?","Nein \u2014 und es gibt auch keine Werbe-Bausteine im Programm.","Damit f\xE4llt der ganze Grund weg, dich m\xF6glichst lange festzuhalten. Das Geld kommt von Erwachsenen, die einmalig zahlen, nicht von deiner Aufmerksamkeit."],["Was wei\xDF diese App \xFCber dich?","Nichts. Es gibt kein Konto und keinen Server.","Alles bleibt auf dem Ger\xE4t. Es gibt keine Stelle, an der Daten ankommen k\xF6nnten \u2014 auch nicht bei uns."],["Warum sieht diese App langweiliger aus als andere?","Weil hier nichts blinkt, das dich halten soll.","Alles, was Aufmerksamkeit f\xE4ngt, fehlt bewusst: keine Feuerwerke nach jeder Karte, kein Autoplay, keine roten Punkte. Was \xFCbrig bleibt, ist das, wof\xFCr du gekommen bist."],["Wie kannst du das alles \xFCberpr\xFCfen, statt es zu glauben?","Flugmodus einschalten \u2014 die App l\xE4uft weiter.","Wenn etwas gesendet w\xFCrde, ginge es ohne Netz nicht. Und wenn dir jemand sagt, seine App sammle keine Daten, ist das genau die richtige Frage: Woran k\xF6nnte ich das selbst erkennen?"],["Was ist die wichtigste Frage bei jeder App, die du benutzt?","Womit verdient sie ihr Geld?","Aus der Antwort folgt fast alles andere. Wer mit deiner Zeit verdient, wird um deine Zeit k\xE4mpfen. Wer einmalig verkauft, hat keinen Grund dazu. Diese Frage kannst du bei jeder App stellen \u2014 auch bei dieser."]])},{category:"Unterstufe 1",subject:"Mathematik",name:"Gr\xF6\xDFen & Einheiten",flang:"de-DE",blang:"de-DE",cards:B([["Wie viele Zentimeter sind ein Meter?","100 Zentimeter.","Die Vorsilbe \u201Ezenti\u201C bedeutet Hundertstel \u2014 wie beim Jahrhundert. Ein Zentimeter ist also ein Hundertstel Meter."],["Wie viele Millimeter sind ein Zentimeter?","10 Millimeter.","\u201EMilli\u201C hei\xDFt Tausendstel: Ein Millimeter ist ein Tausendstel Meter. Auf dem Lineal sind es die kleinsten Striche."],["Wie viele Meter sind ein Kilometer?","1000 Meter.","\u201EKilo\u201C hei\xDFt tausend \u2014 deshalb sind auch 1 Kilogramm genau 1000 Gramm. Dieselbe Vorsilbe, dieselbe Bedeutung."],["Wie viele Gramm sind ein Kilogramm?","1000 Gramm."],["Wie viele Kilogramm sind eine Tonne?","1000 Kilogramm.","Ein Kleinwagen wiegt etwa eine Tonne. Das ist eine gute Vergleichsgr\xF6\xDFe, wenn man sich Massen vorstellen will."],["Wie viele Minuten hat eine Stunde?","60 Minuten.","Die 60 stammt von den Babyloniern, die im Sechzigersystem rechneten. Deshalb ist die Zeit die einzige Gr\xF6\xDFe, bei der wir nicht in Zehnerschritten rechnen."],["Wie viele Sekunden hat eine Stunde?","3600 Sekunden.","60 Minuten mal 60 Sekunden. Ein Tag hat 86 400 Sekunden \u2014 24 mal 3600."],["Wie viele Milliliter sind ein Liter?","1000 Milliliter.","Eine \xFCbliche Getr\xE4nkedose fasst 330 Milliliter, also etwa ein Drittel Liter."],["Rechne 2,5 Kilometer in Meter um.","2500 Meter.","Beim Umrechnen in die kleinere Einheit wird die Zahl gr\xF6\xDFer. Wer unsicher ist, pr\xFCft mit dieser Frage: Viele kleine Teile oder wenige gro\xDFe?"],["Rechne 750 Gramm in Kilogramm um.","0,75 Kilogramm.","In die gr\xF6\xDFere Einheit umgerechnet wird die Zahl kleiner. 750 geteilt durch 1000."],["Wie viel ist ein Viertel einer Stunde in Minuten?","15 Minuten.","Eine Viertelstunde. Halbe Stunde: 30 Minuten, Dreiviertelstunde: 45."],["Warum darf man 3 Meter und 40 Zentimeter nicht einfach als 3,40 Meter zusammenz\xE4hlen \u2014 sondern muss aufpassen?","Man darf es, aber nur weil 40 Zentimeter genau 0,40 Meter sind.","Der Fehler passiert bei Zeit: 3 Stunden 40 Minuten sind NICHT 3,40 Stunden, sondern etwa 3,67. Weil Stunden in 60 statt in 100 Teile zerfallen."]])},{category:"Unterstufe 1",subject:"Biologie",name:"Pflanzen & wie sie leben",flang:"de-DE",blang:"de-DE",cards:B([["Was ist Fotosynthese?","Pflanzen bauen aus Wasser, Kohlendioxid und Licht Zucker auf \u2014 und geben Sauerstoff ab.","Das ist die Grundlage fast allen Lebens auf der Erde. Pflanzen sind die Einzigen, die aus Licht Nahrung herstellen k\xF6nnen; alle anderen leben letztlich davon."],["Welches Gas geben Pflanzen bei der Fotosynthese ab?","Sauerstoff.","Der Sauerstoff in unserer Luft stammt praktisch vollst\xE4ndig aus der Fotosynthese. Vor rund 2,4 Milliarden Jahren gab es fast keinen."],["Wozu dienen die Wurzeln?","Zum Verankern und zur Aufnahme von Wasser und N\xE4hrsalzen.","Die feinen Wurzelhaare machen den gr\xF6\xDFten Teil der Aufnahmefl\xE4che aus. Bei manchen B\xE4umen ist das Wurzelwerk so gro\xDF wie die Krone."],["Wozu dienen die Bl\xE4tter?","Sie sind die Orte der Fotosynthese.","Deshalb sind sie flach und breit: m\xF6glichst viel Fl\xE4che f\xFCr m\xF6glichst viel Licht. In der W\xFCste sind Bl\xE4tter oft zu Dornen umgebaut \u2014 dort ist Wasser sparen wichtiger als Licht sammeln."],["Was macht der gr\xFCne Farbstoff Chlorophyll?","Er f\xE4ngt das Sonnenlicht ein.","Er nimmt vor allem rotes und blaues Licht auf und wirft gr\xFCnes zur\xFCck \u2014 deshalb sehen wir Pflanzen gr\xFCn. Wir sehen genau die Farbe, die die Pflanze nicht braucht."],["Warum werden Bl\xE4tter im Herbst bunt?","Die Pflanze zieht das Chlorophyll zur\xFCck, andere Farbstoffe bleiben \xFCbrig.","Gelb und Orange waren die ganze Zeit da, nur vom Gr\xFCn \xFCberdeckt. Die Pflanze holt sich wertvolle Stoffe zur\xFCck, bevor sie das Blatt abwirft."],["Wozu ist die Bl\xFCte da?","Zur Fortpflanzung.","Farbe und Duft sind Werbung f\xFCr Best\xE4uber. Windbest\xE4ubte Pflanzen wie Gr\xE4ser haben unscheinbare Bl\xFCten \u2014 sie m\xFCssen niemanden anlocken."],["Was passiert bei der Best\xE4ubung?","Pollen gelangt von einer Bl\xFCte auf die Narbe einer anderen.","Meist \xFCbernehmen das Insekten, manchmal der Wind. Aus dem befruchteten Teil entsteht sp\xE4ter Samen und Frucht."],["Warum sind Bienen so wichtig?","Sie best\xE4uben viele Nutzpflanzen.","Ein gro\xDFer Teil unserer Obst- und Gem\xFCsearten ist auf Best\xE4ubung angewiesen. Ohne Insekten g\xE4be es weniger \xC4pfel, Kirschen und K\xFCrbisse \u2014 Getreide k\xE4me allerdings mit dem Wind aus."],["Was ist ein Samen?","Ein Pflanzenkeim mit N\xE4hrstoffvorrat und Schutzh\xFClle.","Der Vorrat versorgt den Keimling, bis er eigene Bl\xE4tter hat und selbst Fotosynthese betreiben kann."],["Was braucht ein Samen zum Keimen?","Wasser, W\xE4rme und Sauerstoff \u2014 Licht meist nicht.","Deshalb keimen Samen unter der Erde. Erst der Keimling braucht Licht \u2014 vorher lebt er vom mitgebrachten Vorrat."],["Warum wachsen Wurzeln nach unten und Sprosse nach oben, auch im Dunkeln?","Die Pflanze nimmt die Schwerkraft wahr.","Man kann einen Keimling drehen, wie man will \u2014 die Wurzel dreht sich wieder nach unten. F\xFCr Licht w\xE4re das zu sp\xE4t, unter der Erde gibt es keins."]])},{category:"Unterstufe 1",subject:"Deutsch",name:"Rechtschreibung: die h\xE4ufigsten Stolpersteine",flang:"de-DE",blang:"de-DE",cards:B([["Wann schreibt man \u201Edas\u201C und wann \u201Edass\u201C?","\u201Edas\u201C wenn man es durch dieses, jenes oder welches ersetzen kann \u2014 sonst \u201Edass\u201C.","\u201EDas Buch, das ich lese\u201C \u2014 man kann sagen \u201Ewelches ich lese\u201C, also ein s. \u201EIch hoffe, dass du kommst\u201C \u2014 Ersatz geht nicht, also zwei s."],["Wann schreibt man \u201Eseit\u201C und wann \u201Eseid\u201C?","\u201Eseit\u201C bei Zeit, \u201Eseid\u201C als Form von \u201Esein\u201C.","\u201ESeit gestern\u201C \u2014 Zeit. \u201EIhr seid m\xFCde\u201C \u2014 das geh\xF6rt zu ihr seid. Merkhilfe: seid mit d geh\xF6rt zu ihr, wie find-et, seid-et."],["Was ist der Unterschied zwischen \u201Ewieder\u201C und \u201Ewider\u201C?","\u201Ewieder\u201C hei\xDFt nochmal, \u201Ewider\u201C hei\xDFt gegen.","\u201EBis wieder!\u201C \u2014 nochmal. \u201EWiderspruch\u201C, \u201Ewiderlich\u201C \u2014 gegen. Das zweite ist selten, deshalb ist im Zweifel \u201Ewieder\u201C meist richtig."],["Wann schreibt man \u201Ess\u201C und wann \u201E\xDF\u201C?","Nach kurzem Vokal ss, nach langem Vokal oder Doppellaut \xDF.","Fluss (kurzes u), Fu\xDF (langes u). Stra\xDFe (langes a), Kasse (kurzes a). Man h\xF6rt es an der L\xE4nge des Selbstlauts davor."],["Warum schreibt man \u201EFahrrad\u201C mit drei r?","Weil Fahr und Rad zusammengesetzt werden.","Bei zusammengesetzten W\xF6rtern bleiben alle Buchstaben erhalten: Schifffahrt hat drei f, Ballettt\xE4nzer drei t."],["Wann schreibt man Zeitangaben gro\xDF?","Wenn sie ein Nomen sind: am Montag, der Abend.","Klein bleiben W\xF6rter wie heute, morgen, gestern. Achtung: \u201EWir treffen uns morgen Abend\u201C \u2014 morgen klein, Abend gro\xDF."],["Wie erkennt man, ob man ein Wort mit \xE4 oder e schreibt?","Wenn es ein verwandtes Wort mit a gibt, schreibt man \xE4.","H\xE4nde, weil Hand. B\xE4cker, weil backen. Bei Eltern gibt es kein verwandtes a-Wort \u2014 deshalb mit e."],["Wann setzt man vor \u201Eund\u201C ein Komma?","Nur, wenn zwei vollst\xE4ndige Haupts\xE4tze verbunden werden \u2014 und auch dann ist es freiwillig.","Bei Aufz\xE4hlungen steht nie eines: \u201E\xC4pfel, Birnen und Zwetschken.\u201C Das ist der h\xE4ufigste Kommafehler in beide Richtungen."],["Wo steht immer ein Komma?","Vor Nebens\xE4tzen, die mit weil, dass, obwohl, wenn beginnen.","\u201EIch bleibe daheim, weil ich krank bin.\u201C Wenn ein solches Wort auftaucht, geh\xF6rt davor ein Komma."],["Was ist bei der w\xF6rtlichen Rede zu beachten?","Sie steht in Anf\xFChrungszeichen, davor kommt ein Doppelpunkt.","Er sagte: \u201EIch komme sp\xE4ter.\u201C Steht die Rede vorne, folgt ein Komma: \u201EIch komme sp\xE4ter\u201C, sagte er."]])},{category:"Unterstufe 2",subject:"Mathematik",name:"Dezimalzahlen",flang:"de-DE",blang:"de-DE",cards:B([["Was bedeutet die erste Stelle nach dem Komma?","Zehntel.","0,3 sind drei Zehntel, also 3/10. Danach folgen Hundertstel und Tausendstel \u2014 jede Stelle ist ein Zehntel der vorigen."],["Was ist 0,25 als Bruch?","1/4.","25 Hundertstel, gek\xFCrzt durch 25 ergibt ein Viertel. Diese drei sollte man auswendig k\xF6nnen: 0,5 = 1/2, 0,25 = 1/4, 0,75 = 3/4."],["Warum ist 0,7 gr\xF6\xDFer als 0,25?","Weil 7 Zehntel mehr sind als 2 Zehntel.","Die Zahl mit mehr Stellen ist nicht automatisch gr\xF6\xDFer. Man vergleicht Stelle f\xFCr Stelle von links: 7 gegen 2 entscheidet schon."],["Wie addiert man 2,5 + 0,75?","Kommas untereinander schreiben: 3,25.","Der h\xE4ufigste Fehler ist rechtsb\xFCndiges Untereinanderschreiben. Es z\xE4hlt die Stelle, nicht das Zeilenende \u2014 deshalb: Komma unter Komma."],["Was passiert beim Multiplizieren mit 10?","Das Komma wandert eine Stelle nach rechts.","3,45 mal 10 ergibt 34,5. Bei 100 wandert es zwei Stellen, bei 1000 drei. Man verschiebt das Komma, nicht die Ziffern."],["Was passiert beim Dividieren durch 100?","Das Komma wandert zwei Stellen nach links.","250 geteilt durch 100 ergibt 2,5. Deshalb ist Prozentrechnen im Grunde Kommaverschieben."],["Wie rundet man 3,847 auf zwei Nachkommastellen?","3,85.","Man schaut auf die erste weggelassene Ziffer: Bei 5 oder mehr wird aufgerundet, bei 4 oder weniger ab. Hier ist es die 7, also auf."],["Was ist 1/8 als Dezimalzahl?","0,125.","1 geteilt durch 8. Der Bruchstrich ist ein Geteiltzeichen \u2014 so l\xE4sst sich jeder Bruch umwandeln."],["Warum ergibt 0,1 + 0,2 im Taschenrechner manchmal 0,30000000000000004?","Weil Computer im Zweiersystem rechnen und 0,1 dort nicht exakt darstellbar ist.","Genau wie 1/3 im Zehnersystem nie aufgeht, geht 1/10 im Zweiersystem nie auf. Deshalb rechnen Programme mit Geldbetr\xE4gen oft in Cent statt in Euro."],["Wie viel sind 0,5 Stunden in Minuten?","30 Minuten.","Vorsicht: 0,5 Stunden sind eine halbe Stunde. Aber 1,30 Stunden sind NICHT 1 Stunde 30 \u2014 sondern 1 Stunde 18 Minuten, weil 0,30 von 60 Minuten gerechnet wird."],["Ordne der Gr\xF6\xDFe nach: 0,4 \u2014 0,04 \u2014 0,44","0,04 < 0,4 < 0,44.","Trick beim Vergleichen: gedanklich mit Nullen auff\xFCllen \u2014 0,40, 0,04, 0,44. Dann sieht man es sofort."]])},{category:"Unterstufe 2",subject:"Mathematik",name:"Umfang & Fl\xE4che",flang:"de-DE",blang:"de-DE",cards:B([["Was ist der Umfang einer Figur?","Die L\xE4nge ihrer Randlinie.","Der Umfang ist eine L\xE4nge und wird in cm oder m angegeben \u2014 nicht in Quadratmetern. Anschaulich: der Weg einmal rundherum."],["Was ist der Fl\xE4cheninhalt?","Wie viel Platz eine Figur einnimmt.","Gemessen in Quadrateinheiten: Wie viele Quadrate mit 1 cm Seitenl\xE4nge passen hinein?"],["Wie berechnet man den Umfang eines Rechtecks?","2 mal L\xE4nge plus 2 mal Breite.","Man geht einmal rundherum: zweimal die lange Seite, zweimal die kurze."],["Wie berechnet man die Fl\xE4che eines Rechtecks?","L\xE4nge mal Breite.","Bei 5 cm mal 3 cm passen genau 15 Quadrate von 1 cm hinein \u2014 deshalb 15 Quadratzentimeter."],["Wie berechnet man die Fl\xE4che eines Dreiecks?","Grundlinie mal H\xF6he geteilt durch 2.","Jedes Dreieck ist ein halbes Rechteck. Zwei gleiche Dreiecke lassen sich immer zu einem Rechteck zusammenlegen."],["Was ist bei der H\xF6he eines Dreiecks wichtig?","Sie steht immer senkrecht auf der Grundlinie.","Nicht die Seitenl\xE4nge nehmen. Bei einem schiefen Dreieck liegt die H\xF6he manchmal sogar au\xDFerhalb der Figur."],["Wie viele Quadratzentimeter sind ein Quadratdezimeter?","100.","Achtung, hier verdoppelt sich die Umrechnung: Bei L\xE4ngen ist es 10, bei Fl\xE4chen 10 mal 10. Deshalb sind 1 Quadratmeter 10 000 Quadratzentimeter."],["Ein Quadrat hat 6 cm Seitenl\xE4nge. Umfang und Fl\xE4che?","Umfang 24 cm, Fl\xE4che 36 Quadratzentimeter.","Vier gleiche Seiten: 4 mal 6. Fl\xE4che: 6 mal 6. Die Zahlen sehen \xE4hnlich aus, meinen aber ganz Verschiedenes."],["K\xF6nnen zwei Figuren gleichen Umfang, aber verschiedene Fl\xE4che haben?","Ja.","Ein Rechteck 1 mal 5 und eines 2 mal 4 haben beide Umfang 12, aber Fl\xE4chen von 5 und 8. Je quadratischer, desto mehr Fl\xE4che bei gleichem Umfang."],["Wozu braucht man Umfang im Alltag, wozu Fl\xE4che?","Umfang f\xFCr Z\xE4une und Rahmen, Fl\xE4che f\xFCr Farbe und Boden.","Das ist die einfachste Probe: Geht es um eine Linie ringsum oder um das, was drinnen ausgef\xFCllt wird?"]])},{category:"Unterstufe 2",subject:"Geschichte & Politik",name:"Griechenland & Rom",flang:"de-DE",blang:"de-DE",cards:B([["Was ist eine Polis?","Ein griechischer Stadtstaat.","Athen, Sparta, Korinth \u2014 jede mit eigenen Gesetzen und eigener Armee. Ein gemeinsames Griechenland gab es nicht; verbunden waren sie durch Sprache, G\xF6tter und die Spiele."],["Was bedeutet \u201EDemokratie\u201C w\xF6rtlich?","Herrschaft des Volkes \u2014 von demos (Volk) und kratos (Macht).","In Athen durften allerdings nur freie M\xE4nner mitbestimmen. Frauen, Sklaven und Zugezogene waren ausgeschlossen \u2014 also etwa ein Zehntel der Bev\xF6lkerung."],["Wo und wann fanden die ersten Olympischen Spiele statt?","In Olympia, 776 vor Christus.","Sie fanden alle vier Jahre statt. W\xE4hrend der Spiele galt ein Waffenstillstand, damit alle sicher anreisen konnten."],["Wer war Alexander der Gro\xDFe?","Ein makedonischer K\xF6nig, der ein Reich bis nach Indien eroberte.","Er starb mit 32 Jahren. Sein Reich zerfiel sofort, aber die griechische Sprache und Kultur blieben im ganzen Gebiet \u2014 das nennt man Hellenismus."],["Wie wurde Rom der Sage nach gegr\xFCndet?","753 vor Christus von Romulus und Remus.","Eine Sage, kein Bericht. Ausgrabungen zeigen aber, dass es an dieser Stelle tats\xE4chlich um diese Zeit eine Siedlung gab."],["Was war die R\xF6mische Republik?","Eine Staatsform ohne K\xF6nig, mit gew\xE4hlten Beamten und dem Senat.","An der Spitze standen zwei Konsuln, immer f\xFCr ein Jahr. Zwei, damit einer den anderen bremsen konnte \u2014 eine fr\xFCh erfundene Machtbegrenzung."],["Wer war Julius Caesar?","Ein r\xF6mischer Feldherr und Politiker, der 44 vor Christus ermordet wurde.","Er hatte so viel Macht angeh\xE4uft, dass Gegner das Ende der Republik f\xFCrchteten. Nach seinem Tod kam sie trotzdem nicht zur\xFCck \u2014 sein Gro\xDFneffe Augustus wurde der erste Kaiser."],["Was ist ein Aqu\xE4dukt?","Eine Wasserleitung, oft als Br\xFCcke gebaut.","Sie brachten Trinkwasser \xFCber viele Kilometer in die St\xE4dte \u2014 mit ganz leichtem Gef\xE4lle, das Wasser floss allein. Manche funktionieren heute noch."],["Warum bauten die R\xF6mer so gute Stra\xDFen?","Damit Truppen und Nachrichten schnell vorankamen.","Der Handel profitierte auch, aber der Grund war milit\xE4risch. Viele heutige Stra\xDFen folgen noch immer diesen Linien."],["Was war der Limes?","Die befestigte Grenze des R\xF6mischen Reiches.","W\xE4lle, Gr\xE4ben, Palisaden und Wacht\xFCrme. Er lief auch durch das heutige \xD6sterreich \u2014 entlang der Donau."],["Wann endete das Westr\xF6mische Reich?","476 nach Christus.","Kein pl\xF6tzlicher Zusammenbruch: \xDCber Jahrzehnte wurde die Verwaltung schw\xE4cher, Grenzen durchl\xE4ssiger, St\xE4dte kleiner. Die Jahreszahl markiert nur die Absetzung des letzten Kaisers."]])},{category:"Unterstufe 2",subject:"Englisch",name:"Simple Past",flang:"en-US",blang:"de-DE",cards:B([["Wann benutzt man das Simple Past?","F\xFCr abgeschlossene Handlungen in der Vergangenheit.","Meist steht ein Zeitpunkt dabei: yesterday, last week, in 2019, two days ago. Was vorbei ist, steht im Simple Past."],["Wie bildet man das Simple Past bei regelm\xE4\xDFigen Verben?","Mit der Endung -ed.","work \u2192 worked, play \u2192 played. Die Endung ist f\xFCr alle Personen gleich \u2014 anders als im Present Simple gibt es kein Extra-s."],["Was ist die Vergangenheitsform von \u201Ego\u201C?","went.","Unregelm\xE4\xDFig, also auswendig. Die h\xE4ufigsten Verben sind fast alle unregelm\xE4\xDFig \u2014 das ist in vielen Sprachen so, weil oft gebrauchte W\xF6rter sich seltener anpassen."],["Wie verneint man \u201EShe went home\u201C?","She did not go home.","Die Vergangenheit wandert ins Hilfsverb did. Danach steht die Grundform. H\xE4ufiger Fehler: \u201EShe didn't went\u201C."],["Wie fragt man nach \u201EThey played football\u201C?","Did they play football?","Auch hier tr\xE4gt did die Vergangenheit, das Vollverb bleibt in der Grundform."],["Was ist bei \u201Eto be\u201C im Simple Past besonders?","Es hat zwei Formen: was und were.","I/he/she/it was, you/we/they were. Und es braucht kein did: \u201EWas he happy?\u201C statt \u201EDid he be happy?\u201C"],["Was ist der Unterschied zwischen Simple Past und Present Perfect?","Simple Past: abgeschlossen mit Zeitpunkt. Present Perfect: Bezug zur Gegenwart.","\u201EI lost my key yesterday\u201C \u2014 abgeschlossen. \u201EI have lost my key\u201C \u2014 und deshalb stehe ich jetzt vor der T\xFCr. Im Deutschen gibt es diesen Unterschied nicht, deshalb ist er schwer."],["\xDCbersetze: \u201EIch sah ihn gestern.\u201C","I saw him yesterday.","\u201EYesterday\u201C ist ein klarer Zeitpunkt in der Vergangenheit \u2014 also Simple Past, nicht Present Perfect."],["Wie wird die Endung -ed ausgesprochen?","Meist als t oder d \u2014 nur nach t und d als eigene Silbe.","worked klingt wie \u201Eworkt\u201C, played wie \u201Eplayd\u201C, aber wanted wird \u201Ewan-tid\u201C gesprochen. Sonst k\xF6nnte man das Wort nicht aussprechen."],["Was ist die Vergangenheitsform von \u201Eread\u201C?","read \u2014 gleich geschrieben, anders gesprochen.","Die Gegenwart klingt wie \u201Eriid\u201C, die Vergangenheit wie \u201Ered\u201C. Man h\xF6rt den Unterschied, man sieht ihn nicht."]])},{category:"Unterstufe 2",subject:"Biologie",name:"\xD6kosysteme & Nahrungsketten",flang:"de-DE",blang:"de-DE",cards:B([["Was ist ein \xD6kosystem?","Ein Lebensraum samt allen Lebewesen darin und ihren Beziehungen.","Wald, Teich, Wiese. Entscheidend sind nicht die Teile, sondern ihre Verbindungen \u2014 verschwindet eine Art, wirkt das auf viele andere."],["Was ist ein Produzent?","Ein Lebewesen, das seine Nahrung selbst herstellt \u2014 also Pflanzen.","Sie stehen am Anfang jeder Nahrungskette. Ohne sie g\xE4be es keine Energie im System, denn nur sie k\xF6nnen Sonnenlicht nutzbar machen."],["Was ist ein Konsument?","Ein Lebewesen, das sich von anderen ern\xE4hrt.","Erstkonsumenten fressen Pflanzen (Reh), Zweitkonsumenten fressen Tiere (Fuchs). Man spricht von Nahrungsstufen."],["Was ist ein Destruent?","Ein Lebewesen, das Totes zersetzt \u2014 Pilze, Bakterien, Regenw\xFCrmer.","Sie schlie\xDFen den Kreis: Aus abgestorbenen Resten werden wieder N\xE4hrstoffe f\xFCr Pflanzen. Ohne sie l\xE4ge der Wald meterhoch voller Laub."],["Warum wird eine Nahrungskette nach oben hin d\xFCnner?","Weil bei jeder Stufe der meiste Teil der Energie verloren geht.","Nur etwa ein Zehntel gelangt in die n\xE4chste Stufe \u2014 der Rest wird f\xFCr Bewegung, W\xE4rme und Verdauung gebraucht. Deshalb gibt es viele Rehe und wenige W\xF6lfe."],["Was passiert, wenn ein R\xE4uber aus einem \xD6kosystem verschwindet?","Seine Beutetiere vermehren sich stark und fressen ihre Nahrung knapp.","Im Yellowstone-Nationalpark wurden nach R\xFCckkehr der W\xF6lfe sogar die Flussufer stabiler: weniger Rotwild, mehr junge B\xE4ume, festere Ufer. Solche Ketten nennt man Kaskadeneffekt."],["Was ist der Unterschied zwischen Nahrungskette und Nahrungsnetz?","Die Kette ist eine Linie, das Netz zeigt alle Verbindungen.","In Wirklichkeit frisst fast jedes Tier mehrere Dinge. Die Kette ist eine Vereinfachung zum Verstehen, das Netz ist n\xE4her an der Wirklichkeit."],["Was ist Symbiose?","Ein Zusammenleben, von dem beide Seiten profitieren.","Biene und Bl\xFCte: Die Biene bekommt Nektar, die Pflanze wird best\xE4ubt. Flechten sind sogar zwei Lebewesen in einem \u2014 Pilz und Alge."],["Was ist ein Parasit?","Ein Lebewesen, das auf Kosten eines anderen lebt, ohne es sofort zu t\xF6ten.","Zecken, L\xE4use, Bandw\xFCrmer. Ein Parasit, der seinen Wirt schnell umbringt, schadet sich selbst \u2014 deshalb sind die meisten erstaunlich zur\xFCckhaltend."],["Warum ist Artenvielfalt wichtig?","Je mehr Arten, desto stabiler ist ein \xD6kosystem gegen\xFCber St\xF6rungen.","F\xE4llt eine Art aus, k\xF6nnen andere ihre Rolle \xFCbernehmen. In einer Monokultur kann ein einziger Sch\xE4dling alles vernichten."],["Was ist ein Zeigerorganismus?","Eine Art, deren Vorkommen etwas \xFCber den Zustand des Lebensraums verr\xE4t.","Flechten an B\xE4umen zeigen saubere Luft an, bestimmte Larven im Bach sauberes Wasser. Man misst nicht \u2014 man schaut, wer da ist."]])},{category:"Unterstufe 2",subject:"Geographie & Wirtschaft",name:"Europa: L\xE4nder & Gew\xE4sser",flang:"de-DE",blang:"de-DE",cards:B([["Was ist der l\xE4ngste Fluss Europas?","Die Wolga in Russland, rund 3530 Kilometer.","Sie m\xFCndet ins Kaspische Meer, nicht in einen Ozean. Der l\xE4ngste Fluss der Europ\xE4ischen Union ist die Donau."],["Welches Gebirge trennt Europa von Asien?","Der Ural.","Europa ist geologisch kein eigener Kontinent, sondern der Westteil von Eurasien. Die Grenze ist eine Vereinbarung, keine nat\xFCrliche Trennung."],["Was ist die Hauptstadt von Slowenien?","Ljubljana.","Slowenien grenzt im Norden an \xD6sterreich \u2014 von K\xE4rnten und der Steiermark aus ist man schnell dort."],["Welches ist das kleinste Land Europas?","Vatikanstadt.","Rund 0,44 Quadratkilometer, mitten in Rom. Es hat eigene Briefmarken, eigene Autokennzeichen und weniger Einwohner als eine gro\xDFe Schule Sch\xFCler hat."],["Was ist die Nordsee \u2014 Meer oder Ozean?","Ein Randmeer des Atlantiks.","Randmeere sind flacher und teilweise von Land umschlossen. Die Nordsee ist im Schnitt nur etwa 90 Meter tief."],["Welche L\xE4nder haben Anteil an den Alpen?","Acht: \xD6sterreich, Deutschland, Schweiz, Italien, Frankreich, Slowenien, Liechtenstein, Monaco.","\xD6sterreich hat den gr\xF6\xDFten Anteil an der Alpenfl\xE4che \u2014 rund 28 Prozent des Gebirges liegen dort."],["Was ist die Iberische Halbinsel?","Der S\xFCdwestzipfel Europas mit Spanien und Portugal.","Die Pyren\xE4en trennen sie vom Rest des Kontinents. Diese Abgeschlossenheit pr\xE4gte die Geschichte der Region stark."],["Welches Meer liegt zwischen Italien und dem Balkan?","Die Adria.","Ein Randmeer des Mittelmeers. F\xFCr \xD6sterreich war der Zugang zur Adria \xFCber Triest jahrhundertelang der einzige Weg zum Meer."],["Was ist der Unterschied zwischen Europa und der Europ\xE4ischen Union?","Europa ist der Erdteil, die EU ein Zusammenschluss von Staaten.","Nicht jedes europ\xE4ische Land ist in der EU \u2014 die Schweiz, Norwegen und Gro\xDFbritannien zum Beispiel nicht."],["Welcher See ist der gr\xF6\xDFte S\xFC\xDFwassersee Europas?","Der Ladogasee in Russland.","Der gr\xF6\xDFte in Mitteleuropa ist der Bodensee, der an Deutschland, \xD6sterreich und die Schweiz grenzt."],["Warum ist Nordeuropa trotz gleicher Breite milder als Kanada?","Wegen des Golfstroms.","Diese warme Meeresstr\xF6mung bringt W\xE4rme aus der Karibik nach Nordwesteuropa. Ohne sie w\xE4re Norwegen so kalt wie Gr\xF6nland \u2014 auf gleicher H\xF6he."]])},{category:"Unterstufe 2",subject:"Deutsch",name:"Satzglieder bestimmen",flang:"de-DE",blang:"de-DE",cards:B([["Was ist das Subjekt eines Satzes?","Der Satzgegenstand \u2014 wer oder was etwas tut.","Frage: Wer oder was? \u201EDer Hund bellt.\u201C Das Subjekt steht immer im ersten Fall und richtet sich mit dem Verb: Hund bellt, Hunde bellen."],["Was ist das Pr\xE4dikat?","Die Satzaussage \u2014 das gebeugte Verb.","Es ist das einzige Satzglied, das nicht verschoben werden kann: Im Aussagesatz steht es immer an zweiter Stelle. Daran kann man den ganzen Satz aufh\xE4ngen."],["Was ist ein Objekt?","Eine Erg\xE4nzung, auf die sich die Handlung richtet.","\u201EIch lese das Buch.\u201C Was lese ich? Das Buch \u2014 Objekt im vierten Fall. Es gibt auch Objekte im dritten Fall: \u201EIch helfe dem Kind.\u201C"],["Wie findet man Satzglieder sicher?","Mit der Verschiebeprobe: Was zusammen an den Satzanfang wandern kann, ist ein Satzglied.","\u201EGestern hat mein kleiner Bruder ein Eis gegessen.\u201C \u2014 \u201EMein kleiner Bruder hat gestern \u2026\u201C Die drei W\xF6rter wandern zusammen, sind also ein Satzglied."],["Was ist eine adverbiale Bestimmung?","Eine Angabe zu Ort, Zeit, Grund oder Art und Weise.","Wo? Wann? Warum? Wie? \u201EEr l\xE4uft schnell durch den Park.\u201C \u2014 schnell (Art), durch den Park (Ort)."],["Welche Frage stellt man nach der adverbialen Bestimmung des Grundes?","Warum? Weshalb? Wozu?","\u201EWegen des Regens bleiben wir daheim.\u201C Warum? Wegen des Regens."],["Was ist ein Attribut?","Eine Beif\xFCgung zu einem Nomen \u2014 es ist kein eigenes Satzglied.","In \u201Eder gro\xDFe Hund\u201C geh\xF6rt \u201Egro\xDFe\u201C zum Hund und wandert immer mit. Genau das unterscheidet Attribute von Satzgliedern."],["Wie viele Satzglieder hat \u201EMorgen fahren wir ans Meer\u201C?","Vier.","morgen (Zeit), fahren (Pr\xE4dikat), wir (Subjekt), ans Meer (Ort). Wer unsicher ist, verschiebt jedes St\xFCck einzeln an den Satzanfang \u2014 was zusammen wandert, geh\xF6rt zusammen."],["Was ist ein Hauptsatz?","Ein Satz, der allein stehen kann; das gebeugte Verb steht an zweiter Stelle.","\u201EIch gehe heute ins Kino.\u201C Der Nebensatz kann nicht allein stehen und schickt das Verb ans Ende: \u201E\u2026, weil ich Zeit habe.\u201C"],["Woran erkennt man einen Nebensatz?","Am Einleitewort und am Verb am Satzende.","weil, dass, obwohl, wenn, damit. Beides zusammen ist ein sicheres Zeichen \u2014 und davor steht immer ein Komma."]])},{category:"Unterstufe 2",subject:"Physik",name:"Licht & Sehen",flang:"de-DE",blang:"de-DE",cards:B([["Wie breitet sich Licht aus?","Geradlinig.","Deshalb gibt es scharfe Schatten und deshalb kann man um eine Ecke nicht sehen. Alles, was wir \xFCber Schatten und Spiegel wissen, folgt aus diesem einen Satz."],["Wie schnell ist Licht?","Rund 300 000 Kilometer pro Sekunde im Vakuum.","In einer Sekunde siebenmal um die Erde. Das Licht der Sonne braucht trotzdem gut acht Minuten zu uns \u2014 man sieht die Sonne immer so, wie sie vor acht Minuten war."],["Warum sehen wir einen Gegenstand?","Weil Licht von ihm in unser Auge f\xE4llt.","Die meisten Dinge leuchten nicht selbst, sie werfen Licht zur\xFCck. Im v\xF6llig dunklen Raum sieht man nichts \u2014 auch mit den besten Augen nicht."],["Was ist der Unterschied zwischen Lichtquelle und beleuchtetem K\xF6rper?","Eine Lichtquelle sendet selbst Licht aus, ein beleuchteter K\xF6rper wirft es zur\xFCck.","Sonne, Lampe, Feuer senden selbst. Mond, Buch, Tisch werfen zur\xFCck. Der Mond leuchtet nicht \u2014 er spiegelt Sonnenlicht."],["Wie entsteht ein Schatten?","Ein K\xF6rper h\xE4lt geradlinig laufendes Licht auf.","Bei einer punktf\xF6rmigen Lichtquelle ist der Schatten scharf, bei einer gro\xDFen entsteht auch ein Halbschatten \u2014 deshalb sind Schatten an bew\xF6lkten Tagen weich."],["Was gilt beim Spiegel f\xFCr Einfalls- und Reflexionswinkel?","Sie sind gleich gro\xDF.","Deshalb kann man berechnen, wohin ein Lichtstrahl geht. Beim Billard gilt dieselbe Regel \u2014 nur mit Kugeln statt Licht."],["Warum erscheint ein Stab im Wasser geknickt?","Weil Licht beim \xDCbergang in ein anderes Material die Richtung \xE4ndert.","Das nennt man Brechung. Licht ist im Wasser langsamer als in Luft, und beim \xDCbergang knickt es ab. Deshalb greift man beim Fischen daneben."],["Was passiert, wenn wei\xDFes Licht durch ein Prisma f\xE4llt?","Es zerlegt sich in die Regenbogenfarben.","Wei\xDFes Licht ist eine Mischung. Jede Farbe wird unterschiedlich stark gebrochen, deshalb f\xE4chern sie sich auf. Ein Regenbogen entsteht genauso \u2014 an Wassertropfen."],["Warum ist ein Blatt gr\xFCn?","Es wirft gr\xFCnes Licht zur\xFCck und schluckt die anderen Farben.","Wir sehen immer die Farbe, die NICHT aufgenommen wird. Ein schwarzer Gegenstand schluckt fast alles \u2014 deshalb wird er in der Sonne warm."],["Warum ist der Himmel blau?","Blaues Licht wird an den Luftteilchen st\xE4rker gestreut als rotes.","Es kommt deshalb aus allen Richtungen. Beim Sonnenuntergang nimmt das Licht einen l\xE4ngeren Weg durch die Luft \u2014 das Blau ist unterwegs schon weggestreut, Rot bleibt \xFCbrig."],["Was ist eine Sammellinse?","Eine Linse, die parallele Lichtstrahlen in einem Punkt b\xFCndelt.","Sie ist in der Mitte dicker als am Rand. So eine Linse steckt in jeder Lupe, jeder Kamera und in unserem Auge."],["Warum sehen manche Menschen in der Ferne unscharf?","Weil das Bild vor der Netzhaut entsteht statt darauf.","Kurzsichtigkeit: Der Augapfel ist etwas zu lang. Eine Zerstreuungslinse in der Brille schiebt den Brennpunkt zur\xFCck auf die Netzhaut."]])},{category:"Unterstufe 2",subject:"Englisch",name:"Fragen & Verneinung",flang:"en-US",blang:"de-DE",cards:B([["Wie fragt man im Present Simple?","Mit do oder does am Satzanfang.","Do you like pizza? Does she play tennis? Bei he, she, it steht does \u2014 und das Vollverb verliert dann sein -s."],["Wie fragt man mit \u201Eto be\u201C?","Ohne do \u2014 die Form von be rutscht nach vorn.","Are you ready? Is he at home? Das gilt auch f\xFCr can, must, will: Can you help me?"],["Was sind die wichtigsten Fragew\xF6rter?","who, what, where, when, why, how.","wer, was, wo, wann, warum, wie. Sie stehen ganz vorn, davor kommt nichts."],["Wie fragt man nach dem Subjekt?","Ohne do: \u201EWho called you?\u201C","Das ist die Ausnahme. Wenn who oder what das Subjekt ist, braucht man kein Hilfsverb. \u201EWho wants ice cream?\u201C \u2014 nicht \u201EWho does want\u201C."],["Was ist ein Question Tag?","Ein angeh\xE4ngtes Kurzfr\xE4gchen: \u201E\u2026, isn\u2019t it?\u201C","Die Regel: positiver Satz, negativer Anhang \u2014 und umgekehrt. \u201EYou are coming, aren\u2019t you?\u201C / \u201EYou don\u2019t like it, do you?\u201C"],["Wie verneint man mit \u201Eto be\u201C?","Mit not direkt dahinter: \u201EHe is not tired.\u201C","Kurzform: isn\u2019t, aren\u2019t, wasn\u2019t. Bei Vollverben braucht man dagegen don\u2019t oder doesn\u2019t."],["Was bedeutet \u201Esome\u201C und wann benutzt man \u201Eany\u201C?","some in Aussagen, any in Fragen und Verneinungen.","\u201EI have some money.\u201C / \u201EDo you have any money?\u201C / \u201EI don\u2019t have any money.\u201C Ausnahme: Bei Angeboten sagt man some \u2014 \u201EWould you like some tea?\u201C"],["Warum ist \u201EI don\u2019t know nothing\u201C falsch?","Weil im Englischen nur eine Verneinung pro Satz steht.","Richtig: \u201EI don\u2019t know anything\u201C oder \u201EI know nothing\u201C. Im Deutschen ist die doppelte Verneinung ebenfalls falsch, im Umgangssprachlichen aber verbreitet \u2014 das f\xFChrt zur Verwechslung."],["\xDCbersetze: \u201EWo wohnst du?\u201C","Where do you live?","Fragewort, dann do, dann Subjekt, dann Verb. Diese Reihenfolge ist im Englischen fest."],["Was ist der Unterschied zwischen \u201EHow are you?\u201C und \u201EHow do you do?\u201C","Das erste fragt nach dem Befinden, das zweite ist eine formelle Begr\xFC\xDFung.","\u201EHow do you do?\u201C erwartet keine Antwort \xFCber das Befinden \u2014 man sagt dasselbe zur\xFCck. Es ist heute selten und wirkt sehr f\xF6rmlich."]])},{category:"Unterstufe 4",subject:"Mathematik",name:"Satz des Pythagoras",flang:"de-DE",blang:"de-DE",cards:B([["Wie lautet der Satz des Pythagoras?","a\xB2 + b\xB2 = c\xB2.","In Worten: In einem rechtwinkligen Dreieck ist die Summe der Quadrate \xFCber den beiden k\xFCrzeren Seiten so gro\xDF wie das Quadrat \xFCber der l\xE4ngsten."],["Was ist die Hypotenuse?","Die l\xE4ngste Seite \u2014 sie liegt dem rechten Winkel gegen\xFCber.","Sie ist immer das c in der Formel. Der h\xE4ufigste Fehler ist, die falsche Seite als c zu nehmen \u2014 sie liegt IMMER gegen\xFCber dem rechten Winkel."],["Wann darf man den Satz des Pythagoras anwenden?","Nur bei rechtwinkligen Dreiecken.","Ohne rechten Winkel gilt er nicht. Deshalb sucht man zuerst den rechten Winkel \u2014 findet man keinen, braucht man ein anderes Werkzeug."],["Die Katheten sind 3 und 4 cm lang. Wie lang ist die Hypotenuse?","5 cm.","9 + 16 = 25, die Wurzel daraus ist 5. Das 3-4-5-Dreieck ist der bekannteste Fall \u2014 Handwerker nutzen ihn bis heute, um rechte Winkel abzustecken."],["Die Hypotenuse ist 13 cm, eine Kathete 5 cm. Wie lang ist die andere?","12 cm.","169 \u2212 25 = 144, Wurzel 12. Wenn man eine Kathete sucht, wird subtrahiert statt addiert."],["Wie pr\xFCft man, ob ein Dreieck rechtwinklig ist?","Man setzt die Seiten in a\xB2 + b\xB2 = c\xB2 ein \u2014 geht es auf, ist es rechtwinklig.","Das ist die Umkehrung des Satzes. Bei 6, 8, 10 gilt 36 + 64 = 100 \u2014 also rechtwinklig."],["Wie lang ist die Diagonale eines Quadrats mit 4 cm Seitenl\xE4nge?","Rund 5,66 cm.","16 + 16 = 32, Wurzel aus 32 ist etwa 5,66. Die Diagonale eines Quadrats ist immer die Seite mal Wurzel 2 \u2014 etwa das 1,41-Fache."],["Wozu braucht man den Satz im Alltag?","Um Entfernungen zu berechnen, die man nicht direkt messen kann.","Leiterl\xE4nge an einer Wand, Diagonale eines Zimmers, Bildschirmgr\xF6\xDFe. Fernseher werden in Zoll der Diagonale angegeben \u2014 die man mit Pythagoras aus Breite und H\xF6he bekommt."],["Warum ist eine Bildschirmdiagonale von 32 Zoll kein 32 Zoll breiter Bildschirm?","Weil die Diagonale schr\xE4g verl\xE4uft und l\xE4nger ist als jede Seite.","Ein 32-Zoll-Bildschirm im Format 16:9 ist rund 71 cm breit und 40 cm hoch \u2014 die Diagonale misst 81 cm. Die gr\xF6\xDFte Zahl klingt in der Werbung am besten."],["Wie alt ist der Satz des Pythagoras?","Die Beziehung war schon \xFCber 1000 Jahre vor Pythagoras bekannt.","Babylonische Tontafeln zeigen entsprechende Zahlentripel. Pythagoras lebte um 550 vor Christus \u2014 ihm wird meist der erste Beweis zugeschrieben, nicht die Entdeckung."]])},{category:"Unterstufe 4",subject:"Physik",name:"Kraft & Bewegung",flang:"de-DE",blang:"de-DE",cards:B([["Was ist eine Kraft?","Etwas, das einen K\xF6rper verformt oder seine Bewegung \xE4ndert.","Man sieht Kr\xE4fte nie selbst, nur ihre Wirkung. Gemessen werden sie in Newton."],["Was besagt das Tr\xE4gheitsgesetz?","Ohne Kraft bleibt ein K\xF6rper in Ruhe oder in gleichm\xE4\xDFiger geradliniger Bewegung.","Das widerspricht der Alltagserfahrung: Ein rollender Ball wird ja langsamer. Aber das liegt an der Reibung \u2014 im Weltraum rollt er ewig weiter."],["Warum wird man im Auto bei einer Vollbremsung nach vorn gedr\xFCckt?","Weil der K\xF6rper seine Bewegung beibehalten will.","Nicht das Auto dr\xFCckt einen nach vorn \u2014 der K\xF6rper macht einfach weiter, w\xE4hrend das Auto bremst. Deshalb ist der Gurt lebenswichtig."],["Was ist der Unterschied zwischen Masse und Gewicht?","Masse ist die Menge an Materie, Gewicht ist die Kraft, mit der sie angezogen wird.","Auf dem Mond hat man dieselbe Masse, aber nur etwa ein Sechstel des Gewichts. Umgangssprachlich sagt man Gewicht und meint Masse \u2014 physikalisch sind es zwei Dinge."],["In welcher Einheit misst man Kraft?","In Newton (N).","Ein Kilogramm wird auf der Erde mit etwa 9,81 Newton angezogen. Als grobe Faustregel: 1 kg entspricht ungef\xE4hr 10 Newton."],["Was besagt \u201Eactio gleich reactio\u201C?","Jede Kraft hat eine gleich gro\xDFe Gegenkraft in entgegengesetzter Richtung.","Beim Gehen dr\xFCckt man den Boden nach hinten, der Boden dr\xFCckt einen nach vorn. Eine Rakete funktioniert genauso: Sie st\xF6\xDFt Gas nach hinten aus und wird nach vorn geschoben."],["Was ist Reibung?","Eine Kraft, die einer Bewegung entgegenwirkt.","Sie ist oft l\xE4stig, aber ohne sie k\xF6nnte man nicht gehen, nicht greifen und nicht bremsen. Auf Eis merkt man, wie viel man ihr verdankt."],["Was ist ein Hebel?","Eine Stange, die sich um einen Drehpunkt bewegt und Kraft verst\xE4rkt.","Je l\xE4nger der Arm, desto weniger Kraft braucht man \u2014 daf\xFCr muss man einen l\xE4ngeren Weg zur\xFCcklegen. Schere, Zange und T\xFCrgriff sind Hebel."],["Was ist die Formel f\xFCr Geschwindigkeit?","Strecke geteilt durch Zeit.","In Kilometern pro Stunde oder Metern pro Sekunde. Um von km/h auf m/s zu kommen, teilt man durch 3,6."],["Warum fallen eine Feder und ein Stein im Vakuum gleich schnell?","Weil ohne Luft kein Luftwiderstand bremst.","Die Schwerkraft beschleunigt alle K\xF6rper gleich stark, unabh\xE4ngig von der Masse. Astronauten haben das auf dem Mond mit Hammer und Feder vorgef\xFChrt \u2014 beide kamen gleichzeitig an."]])},{category:"Unterstufe 4",subject:"Biologie",name:"Vererbung & Evolution",flang:"de-DE",blang:"de-DE",cards:B([["Was ist ein Gen?","Ein Abschnitt der DNA mit einer Bauanleitung.","Meist f\xFCr ein Eiwei\xDF. Der Mensch hat rund 20 000 Gene \u2014 erstaunlich wenige, etwa so viele wie ein Fadenwurm."],["Wo befindet sich die DNA in einer Zelle?","Im Zellkern, aufgewickelt in Chromosomen.","Aneinandergelegt erg\xE4be die DNA einer einzigen Zelle rund zwei Meter. Sie ist so dicht gepackt, dass sie in einen Kern von wenigen Tausendstelmillimetern passt."],["Wie viele Chromosomen hat der Mensch?","46 \u2014 also 23 Paare.","Von jedem Paar kommt eines von der Mutter und eines vom Vater. Deshalb hat man von jedem Gen zwei Ausf\xFChrungen."],["Was ist der Unterschied zwischen dominant und rezessiv?","Ein dominantes Merkmal setzt sich durch, ein rezessives zeigt sich nur, wenn beide Anlagen rezessiv sind.","Deshalb k\xF6nnen zwei braun\xE4ugige Eltern ein blau\xE4ugiges Kind bekommen: Beide tragen die rezessive Anlage, ohne sie selbst zu zeigen. Bei Augenfarbe wirken allerdings mehrere Gene mit."],["Was ist eine Mutation?","Eine Ver\xE4nderung im Erbgut.","Die meisten sind wirkungslos, manche sch\xE4dlich, sehr wenige n\xFCtzlich. Ohne Mutationen g\xE4be es keine Vielfalt \u2014 sie sind der Rohstoff der Evolution."],["Was versteht man unter nat\xFCrlicher Auslese?","Wer besser zur Umwelt passt, hinterl\xE4sst im Schnitt mehr Nachkommen.","Wichtig: Nicht die St\xE4rksten setzen sich durch, sondern die am besten Passenden. Bei manchen Arten ist das der Kleinste oder der Unauff\xE4lligste."],["Warum ist \u201EDer St\xE4rkste \xFCberlebt\u201C eine falsche Zusammenfassung der Evolution?","Weil es nicht um St\xE4rke geht, sondern um Passung und Nachkommen.","Ein winziges Insekt kann erfolgreicher sein als ein Tiger. Erfolg misst sich in Nachkommen, nicht in Muskeln."],["Was ist ein Fossil?","Ein versteinerter Rest oder Abdruck eines Lebewesens.","Fossilien entstehen nur unter seltenen Bedingungen \u2014 deshalb ist die Fundlage l\xFCckenhaft. Von den meisten Arten, die je lebten, gibt es keinerlei Spur."],["Warum haben Wale Fingerknochen in den Flossen?","Weil ihre Vorfahren an Land lebten.","Solche Reste nennt man Rudimente. Sie sind einer der st\xE4rksten Hinweise auf gemeinsame Abstammung \u2014 ein Bauplan wird umgebaut, nicht neu erfunden."],["Was bedeutet es, wenn zwei Arten verwandt sind?","Sie haben gemeinsame Vorfahren.","Je \xE4hnlicher das Erbgut, desto n\xE4her die Verwandtschaft. Mensch und Schimpanse teilen rund 98 Prozent \u2014 die Unterschiede stecken vor allem darin, wann welche Gene abgelesen werden."],["Was ist der Unterschied zwischen Vererbung und Erlerntem?","Vererbt wird, was in den Genen steht \u2014 Erlerntes wird nicht weitergegeben.","Wer Klavierspielen lernt, vererbt das nicht. Diese Vorstellung war im 19. Jahrhundert verbreitet und ist widerlegt."]])},{category:"Unterstufe 4",subject:"Geschichte & Politik",name:"Industrialisierung",flang:"de-DE",blang:"de-DE",cards:B([["Was war die Industrielle Revolution?","Der \xDCbergang von Handarbeit zu Maschinenarbeit ab dem sp\xE4ten 18. Jahrhundert.","Sie begann in England mit der Textilherstellung. Innerhalb weniger Generationen \xE4nderte sich, wo Menschen wohnten, wie sie arbeiteten und wie lange sie lebten."],["Welche Erfindung war der Ausl\xF6ser?","Die verbesserte Dampfmaschine von James Watt.","Erstmals war Energie unabh\xE4ngig von Wind, Wasser und Muskelkraft verf\xFCgbar \u2014 und damit auch unabh\xE4ngig vom Ort. Fabriken mussten nicht mehr am Fluss stehen."],["Warum zogen so viele Menschen in die St\xE4dte?","Weil es dort Arbeit in den Fabriken gab.","Gleichzeitig brauchte die Landwirtschaft durch Maschinen weniger Leute. Beides zusammen lie\xDF St\xE4dte in wenigen Jahrzehnten explodieren \u2014 mit Wohnungsnot und Seuchen als Folge."],["Wie sahen die Arbeitsbedingungen aus?","Bis zu 16 Stunden t\xE4glich, sechs Tage die Woche, auch f\xFCr Kinder.","Kinder waren billig und passten in enge Maschinenteile. Erst nach und nach kamen Gesetze \u2014 in \xD6sterreich wurde die Kinderarbeit unter zehn Jahren 1842 eingeschr\xE4nkt."],["Was ist eine Gewerkschaft?","Ein Zusammenschluss von Arbeitnehmern zur Durchsetzung gemeinsamer Interessen.","Einzeln war man ersetzbar, gemeinsam nicht. Der Achtstundentag, bezahlter Urlaub und die Lohnfortzahlung im Krankheitsfall wurden so erk\xE4mpft."],["Was bedeutet \u201Esoziale Frage\u201C?","Die Frage, wie mit der Armut der Arbeiterschaft umzugehen sei.","Aus ihr entstanden Sozialversicherung, Arbeitsrecht und politische Parteien. Vieles, was heute selbstverst\xE4ndlich wirkt, ist eine Antwort auf diese Zeit."],["Was ver\xE4nderte die Eisenbahn?","Sie machte Waren und Menschen schnell und billig beweglich.","Sie erzwang auch die einheitliche Zeit: Vorher hatte jede Stadt ihre eigene Uhrzeit \u2014 mit Fahrpl\xE4nen ging das nicht mehr."],["Welche Rolle spielte Kohle?","Sie war der Brennstoff f\xFCr Dampfmaschinen und die Eisenherstellung.","Wo Kohle lag, entstand Industrie. Der Preis war schlechte Luft und harte Arbeit unter Tage \u2014 und der Beginn des Kohlendioxid-Anstiegs, der uns heute besch\xE4ftigt."],["Was war der Luddismus?","Eine Bewegung von Arbeitern, die Maschinen zerst\xF6rten.","Sie richtete sich nicht gegen Technik an sich, sondern gegen den Verlust der Existenz. Die Frage, was mit Menschen passiert, deren Arbeit Maschinen \xFCbernehmen, ist seither nie verschwunden."],["Was hat die Industrialisierung mit dem Klimawandel zu tun?","Mit ihr begann das massenhafte Verbrennen fossiler Brennstoffe.","Seit etwa 1850 l\xE4sst sich der Anstieg des Kohlendioxids in der Luft messen. Die Erw\xE4rmung, \xFCber die heute gestritten wird, hat hier ihren Ausgangspunkt."]])},{category:"Unterstufe 4",subject:"Chemie",name:"Atome & Reaktionen",flang:"de-DE",blang:"de-DE",cards:B([["Woraus besteht ein Atom?","Aus Kern (Protonen und Neutronen) und H\xFClle (Elektronen).","Der Kern ist winzig gegen\xFCber dem Ganzen: W\xE4re das Atom ein Fu\xDFballstadion, w\xE4re der Kern eine Erbse in der Mitte. Materie ist fast leer."],["Was unterscheidet die Elemente voneinander?","Die Anzahl der Protonen im Kern.","Ein Proton mehr, und aus Kohlenstoff wird Stickstoff. Diese Zahl hei\xDFt Ordnungszahl und legt den Platz im Periodensystem fest."],["Was ist ein Molek\xFCl?","Zwei oder mehr Atome, die fest verbunden sind.","Wasser besteht aus zwei Wasserstoffatomen und einem Sauerstoffatom \u2014 H\u2082O. Die Eigenschaften des Molek\xFCls haben mit denen der Einzelatome oft nichts zu tun."],["Was ist der Unterschied zwischen Gemisch und Verbindung?","Ein Gemisch l\xE4sst sich physikalisch trennen, eine Verbindung nur chemisch.","Salzwasser ist ein Gemisch \u2014 Verdampfen trennt es. Wasser selbst ist eine Verbindung: Um Wasserstoff und Sauerstoff zu trennen, braucht es Strom."],["Was passiert bei einer chemischen Reaktion?","Bindungen werden gel\xF6st und neu gekn\xFCpft \u2014 es entstehen neue Stoffe.","Die Atome selbst bleiben erhalten, sie werden nur anders zusammengesetzt. Deshalb ist die Masse vorher und nachher gleich."],["Woran erkennt man eine chemische Reaktion?","An neuen Stoffen, Farbwechsel, Gasbildung oder W\xE4rme.","Wenn Zucker schmilzt, ist es keine chemische Reaktion \u2014 es bleibt Zucker. Wenn er braun wird und riecht, schon."],["Was ist eine Oxidation?","Eine Reaktion mit Sauerstoff.","Rosten ist eine langsame Oxidation, Feuer eine schnelle. Auch unsere Atmung ist im Kern eine Oxidation \u2014 nur sehr kontrolliert."],["Warum brennt Feuer ohne Sauerstoff nicht?","Weil die Verbrennung eine Reaktion mit Sauerstoff ist.","Deshalb erstickt eine Kerze unter einem Glas. Und deshalb l\xF6scht man kleine Br\xE4nde mit einer Decke \u2014 man nimmt die Luft weg."],["Was sagt der pH-Wert?","Ob ein Stoff sauer, neutral oder basisch ist.","Unter 7 sauer, 7 neutral, \xFCber 7 basisch. Die Skala ist nicht linear: pH 4 ist zehnmal so sauer wie pH 5."],["Was passiert, wenn man S\xE4ure und Lauge mischt?","Sie neutralisieren sich, es entstehen Salz und Wasser.","Deshalb hilft ein Basenmittel bei Sodbrennen \u2014 es neutralisiert \xFCbersch\xFCssige Magens\xE4ure."],["Warum darf man Wasser niemals in konzentrierte S\xE4ure gie\xDFen?","Weil es dabei schlagartig hei\xDF wird und spritzen kann.","Die Merkregel lautet: Erst das Wasser, dann die S\xE4ure \u2014 sonst geschieht das Ungeheure. Die S\xE4ure kommt langsam ins Wasser, nie umgekehrt."]])},{category:"Unterstufe 4",subject:"Geographie & Wirtschaft",name:"Klima & Klimawandel",flang:"de-DE",blang:"de-DE",cards:B([["Was ist der Unterschied zwischen Wetter und Klima?","Wetter ist der Zustand jetzt, Klima der Durchschnitt \xFCber Jahrzehnte.","Ein kalter Winter widerlegt die Erw\xE4rmung nicht \u2014 genauso wenig wie ein Regentag beweist, dass ein Ort feucht ist. Klima misst man \xFCblicherweise \xFCber 30 Jahre."],["Was ist der Treibhauseffekt?","Gase in der Luft lassen Sonnenlicht herein, halten aber W\xE4rmestrahlung zur\xFCck.","Ohne ihn w\xE4re die Erde im Schnitt etwa 18 Grad unter null \u2014 also unbewohnbar. Das Problem ist nicht der Effekt, sondern seine Verst\xE4rkung."],["Welche Gase verst\xE4rken den Treibhauseffekt am meisten?","Kohlendioxid und Methan.","Methan wirkt kurzfristig viel st\xE4rker, bleibt aber k\xFCrzer in der Luft. Kohlendioxid ist schw\xE4cher, daf\xFCr \xFCber Jahrhunderte wirksam."],["Woher wei\xDF man, wie das Klima vor Tausenden Jahren war?","Aus Eisbohrkernen, Baumringen und Sedimenten.","In Eisbohrkernen sind winzige Luftbl\xE4schen eingeschlossen \u2014 echte Luft aus der Vergangenheit. Damit l\xE4sst sich der Kohlendioxidgehalt \xFCber 800 000 Jahre zur\xFCckverfolgen."],["Was ist der Unterschied zwischen Wettervorhersage und Klimamodell?","Die Vorhersage nennt konkrete Tage, das Modell langfristige Durchschnitte.","Man kann nicht sagen, ob es am 3. Juli 2050 regnet \u2014 aber sehr wohl, wie warm dieser Sommer im Mittel sein d\xFCrfte. Das ist wie beim W\xFCrfel: Der einzelne Wurf ist unvorhersagbar, der Durchschnitt von tausend W\xFCrfen nicht."],["Was sind erneuerbare Energien?","Quellen, die sich von selbst erneuern: Sonne, Wind, Wasser, Biomasse, Erdw\xE4rme.","Ihr Gegenteil sind fossile Energietr\xE4ger \u2014 Kohle, Erd\xF6l, Erdgas. Diese sind \xFCber Millionen Jahre entstanden und in Jahrzehnten aufgebraucht."],["Warum steigt der Meeresspiegel?","Weil Eis schmilzt und weil sich warmes Wasser ausdehnt.","Der zweite Grund wird oft vergessen, macht aber einen gro\xDFen Teil aus. Wasser braucht bei Erw\xE4rmung mehr Platz \u2014 auch ohne einen Tropfen zus\xE4tzliches."],["Warum l\xE4sst schmelzendes Meereis den Meeresspiegel kaum steigen?","Weil es bereits im Wasser schwimmt und dessen Platz einnimmt.","Wie ein Eisw\xFCrfel im Glas: Beim Schmelzen l\xE4uft nichts \xFCber. Entscheidend ist das Eis an Land \u2014 Gr\xF6nland und die Antarktis."],["Was ist eine Klimazone?","Ein Gebiet der Erde mit \xE4hnlichem Klima.","Von den Tropen \xFCber die Subtropen und gem\xE4\xDFigten Zonen bis zu den Polarzonen. Sie h\xE4ngen vor allem vom Einfallswinkel der Sonne ab."],["Warum ist es am \xC4quator w\xE4rmer als an den Polen?","Weil die Sonne dort steiler steht und ihre Energie auf weniger Fl\xE4che verteilt.","Am Pol trifft dasselbe Lichtb\xFCndel schr\xE4g auf und verteilt sich auf ein viel gr\xF6\xDFeres St\xFCck Boden. Man kann es mit einer Taschenlampe an der Wand ausprobieren."]])},{category:"Unterstufe 4",subject:"Deutsch",name:"Texte durchschauen: Argument & Absicht",flang:"de-DE",blang:"de-DE",cards:B([["Was ist eine These?","Eine Behauptung, die begr\xFCndet werden muss.","\u201EHausaufgaben geh\xF6ren abgeschafft\u201C ist eine These. Ohne Begr\xFCndung ist sie nur eine Meinung \u2014 das ist erlaubt, \xFCberzeugt aber niemanden."],["Woraus besteht ein vollst\xE4ndiges Argument?","Aus Behauptung, Begr\xFCndung und Beispiel.","Behauptung: Hausaufgaben helfen wenig. Begr\xFCndung: Wer den Stoff nicht verstanden hat, \xFCbt Fehler ein. Beispiel: \u2026 Fehlt die Begr\xFCndung, ist es kein Argument."],["Was ist der Unterschied zwischen Tatsache und Meinung?","Eine Tatsache kann man \xFCberpr\xFCfen, eine Meinung nicht.","\u201EWien hat rund zwei Millionen Einwohner\u201C ist \xFCberpr\xFCfbar. \u201EWien ist die sch\xF6nste Stadt\u201C nicht. Beides darf man sagen \u2014 aber nur das eine kann falsch sein."],["Was ist ein Scheinargument?","Etwas, das wie eine Begr\xFCndung aussieht, aber keine ist.","\u201EDas war schon immer so\u201C begr\xFCndet nichts \u2014 es beschreibt nur die Vergangenheit. Genauso: \u201EDas machen alle so.\u201C"],["Was bedeutet es, wenn jemand pers\xF6nlich angegriffen wird statt seine Aussage?","Das ist ein Ausweichman\xF6ver.","\u201EWas wei\xDFt denn du schon, du bist erst 13\u201C sagt nichts dar\xFCber, ob die Aussage stimmt. Wer auf die Person zielt, hat zur Sache oft nichts."],["Was ist eine Suggestivfrage?","Eine Frage, die die Antwort schon enth\xE4lt.","\u201EFindest du nicht auch, dass das ungerecht ist?\u201C Man kann kaum nein sagen, ohne sich zu rechtfertigen. In Umfragen ver\xE4ndern solche Fragen das Ergebnis erheblich."],["Wie erkennt man die Absicht eines Textes?","An der Frage: Was soll ich danach denken, f\xFChlen oder tun?","Informieren, \xFCberzeugen, unterhalten oder verkaufen. Ein Text kann mehreres zugleich wollen \u2014 problematisch wird es, wenn er das eine vorgibt und das andere tut."],["Was ist der Unterschied zwischen Bericht und Kommentar?","Der Bericht stellt dar, der Kommentar bewertet.","In Zeitungen sind sie gekennzeichnet. Wo diese Trennung fehlt, sollte man besonders aufmerksam lesen."],["Warum sind W\xF6rter wie \u201Eskandal\xF6s\u201C oder \u201Eunglaublich\u201C ein Warnsignal?","Sie bewerten, statt zu berichten.","Sie erzeugen ein Gef\xFChl, bevor man die Tatsachen kennt. Wer \xFCberzeugen will, statt zu informieren, greift fr\xFCh zu solchen W\xF6rtern."],["Was ist eine Quelle \u2014 und warum reicht eine allein nicht?","Der Ursprung einer Information; eine einzelne kann irren oder t\xE4uschen.","Bei wichtigen Behauptungen pr\xFCft man, ob unabh\xE4ngige Quellen dasselbe sagen. \u201EUnabh\xE4ngig\u201C hei\xDFt: nicht voneinander abgeschrieben."]])},{category:"Unterstufe 4",subject:"Englisch",name:"Present Perfect & Zeitenfolge",flang:"en-US",blang:"de-DE",cards:B([["Wie bildet man das Present Perfect?","Mit have oder has und dem Partizip.","I have seen, she has gone. Bei he, she, it steht has. Das Partizip ist die dritte Form der Verbliste."],["Wann benutzt man das Present Perfect?","Wenn etwas Vergangenes bis in die Gegenwart wirkt.","\u201EI have lost my key\u201C \u2014 und deshalb komme ich jetzt nicht rein. Der Zeitpunkt ist unwichtig, die Folge z\xE4hlt."],["Was ist der Unterschied zu Simple Past?","Simple Past nennt einen Zeitpunkt, Present Perfect nicht.","\u201EI saw him yesterday\u201C \u2014 abgeschlossen. \u201EI have seen him\u201C \u2014 irgendwann, und es ist noch bedeutsam. Sobald yesterday, last week oder ago dabeisteht, ist Simple Past Pflicht."],["Was ist der Unterschied zwischen \u201Esince\u201C und \u201Efor\u201C?","since nennt den Startpunkt, for die Dauer.","since 2020, since Monday \u2014 for three years, for two hours. Beide stehen typischerweise beim Present Perfect."],["\xDCbersetze: \u201EIch wohne seit drei Jahren hier.\u201C","I have lived here for three years.","Im Deutschen steht die Gegenwart, im Englischen das Present Perfect \u2014 weil es in der Vergangenheit begann und noch andauert. Das ist einer der h\xE4ufigsten Fehler."],["Was bedeutet \u201Ealready\u201C, \u201Eyet\u201C und \u201Ejust\u201C?","schon, schon/noch nicht, gerade eben.","\u201EI have already eaten.\u201C / \u201EHave you finished yet?\u201C / \u201EShe has just left.\u201C Alle drei geh\xF6ren typischerweise zum Present Perfect."],["Wo steht \u201Eyet\u201C im Satz?","Am Ende \u2014 und nur in Fragen und Verneinungen.","\u201EHave you done it yet?\u201C / \u201EI haven\u2019t done it yet.\u201C In Aussagen nimmt man already."],["Was ist das Present Perfect Progressive?","have/has been plus -ing \u2014 es betont die Dauer.","\u201EI have been waiting for an hour.\u201C Nicht das Ergebnis z\xE4hlt, sondern dass es die ganze Zeit lief."],["\xDCbersetze: \u201EWarst du schon einmal in London?\u201C","Have you ever been to London?","\u201Eever\u201C hei\xDFt in Fragen \u201Ejemals\u201C. Und es hei\xDFt \u201Ebeen to\u201C, nicht \u201Ebeen in\u201C, wenn man von einem Besuch spricht."],["Warum ist \u201EI have seen him yesterday\u201C falsch?","Weil yesterday einen Zeitpunkt nennt.","Sobald ein abgeschlossener Zeitpunkt dabeisteht, verlangt das Englische Simple Past: \u201EI saw him yesterday.\u201C"]])},{category:"Unterstufe 4",subject:"Informatik & Medien",name:"Wie das Internet funktioniert",flang:"de-DE",blang:"de-DE",cards:B([["Was ist das Internet?","Ein weltweites Netz aus miteinander verbundenen Rechnernetzen.","Es geh\xF6rt niemandem. Es ist kein Dienst, sondern eine Verbindungsart \u2014 das World Wide Web ist nur einer der Dienste, die dar\xFCber laufen."],["Was ist der Unterschied zwischen Internet und World Wide Web?","Das Internet ist die Verbindung, das Web ein Dienst darauf.","E-Mail, Videoanrufe und Spiele laufen ebenfalls \xFCber das Internet, sind aber nicht das Web. Das Web sind die Seiten, die man im Browser \xF6ffnet."],["Was ist eine IP-Adresse?","Die Nummer, unter der ein Ger\xE4t im Netz erreichbar ist.","Wie eine Postadresse. Ohne sie w\xFCsste niemand, wohin die Antwort geschickt werden soll \u2014 deshalb ist v\xF6llige Anonymit\xE4t im Netz schwer."],["Wozu dient das DNS?","Es \xFCbersetzt Namen in IP-Adressen.","Man tippt einen Namen, der Rechner braucht eine Nummer. Das DNS ist das Telefonbuch des Internets \u2014 f\xE4llt es aus, ist gef\xFChlt \u201Edas Internet weg\u201C, obwohl alles l\xE4uft."],["Was passiert, wenn du eine Webseite aufrufst?","Dein Ger\xE4t fragt einen Server, der schickt die Daten zur\xFCck.","Die Daten werden in kleine Pakete zerlegt, die verschiedene Wege nehmen k\xF6nnen und am Ziel wieder zusammengesetzt werden. Fehlt eines, wird es nachgefordert."],["Was bedeutet das Schloss-Symbol im Browser?","Die Verbindung ist verschl\xFCsselt (HTTPS).","Es bedeutet NICHT, dass die Seite vertrauensw\xFCrdig ist. Auch Betrugsseiten haben ein Schloss \u2014 es sagt nur, dass niemand mitlesen kann."],["Was ist ein Cookie?","Eine kleine Datei, die eine Webseite auf deinem Ger\xE4t ablegt.","Sie merkt sich zum Beispiel, dass du angemeldet bist. Andere verfolgen dich \xFCber viele Seiten hinweg \u2014 deshalb die Zustimmungsbanner."],["Was ist ein Server?","Ein Rechner, der Daten bereitstellt.","Meist ein Ger\xE4t in einem Rechenzentrum, das rund um die Uhr l\xE4uft. \u201EIn der Cloud\u201C hei\xDFt schlicht: auf dem Rechner von jemand anderem."],["Warum sollte man f\xFCr jeden Dienst ein anderes Passwort nutzen?","Weil ein geknacktes Passwort sonst alle Konten \xF6ffnet.","Bei Datenlecks werden Zugangsdaten massenhaft ausprobiert. Ein Passwortmanager l\xF6st das Problem, weil man sich nur noch eines merken muss."],["Was macht ein Passwort sicher?","Vor allem die L\xE4nge.","Vier zuf\xE4llige W\xF6rter sind sicherer als acht Zeichen mit Sonderzeichen \u2014 und leichter zu merken. Wichtig ist, dass es nicht erratbar ist: kein Name, kein Geburtsdatum."],["Was ist Zwei-Faktor-Anmeldung?","Neben dem Passwort ein zweiter Nachweis, meist ein Code aufs Handy.","Selbst wer das Passwort kennt, kommt dann nicht hinein. Es ist der wirksamste einzelne Schutz f\xFCr wichtige Konten."],["Was ist Phishing?","Der Versuch, mit gef\xE4lschten Nachrichten an Zugangsdaten zu kommen.","Typisch sind Dringlichkeit (\u201EIhr Konto wird gesperrt\u201C) und ein Link. Faustregel: Nie \xFCber einen Link in einer Nachricht anmelden \u2014 immer die Seite selbst aufrufen."]])},{category:"Medien",subject:"Miteinander",name:"Zeichentest (auf dem Ger\xE4t pr\xFCfen)",flang:"de-DE",blang:"de-DE",recall:!1,cards:B([["Sehen alle Zeichen gleich aus?","\u221A \u03C0 \xB2 \xB3 \xBD \xBC \u2264 \u2265 \u2260 \xB1 \xD7 \xF7 \xB7 \u2212 \xB0 \u221E","Wenn eines davon anders wirkt als die \xFCbrigen \u2014 eckiger, d\xFCnner, schief sitzend \u2014 dann hat die runde Systemschrift dieses Zeichen nicht und der Browser hat es aus einer anderen Schrift geholt. Genau das soll die Schriftkette f\xFCr Formeln verhindern."],["Griechische Buchstaben","\u03B1 \u03B2 \u03B3 \u0394 \u03A3 \u03A9 \u03C6 \u03BB \u03BC","Kommen in Physik und Mathematik der Oberstufe vor. F\xFCr die Unterstufe reichen \u03C0 und \u0394."],["Bleibt diese Gleichung auf einer Zeile?","3 \xD7 (2x + 5) \u2212 4x = 2x + 15","Wenn sie umbricht, greift der Formelschutz nicht. Wenn sie kleiner ge
