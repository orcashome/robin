setzt ist als der \xFCbrige Text: genau richtig, dann hat die automatische Anpassung gearbeitet."],["Fluchten die Ziffern untereinander?","1111 \xB7 8888 \xB7 1088 \xB7 8011","Alle vier Zeilen sollten exakt gleich breit sein. Wenn nicht, greift tabular-nums nicht \u2014 dann verrutschen in Tabellen die Spalten."]])},{category:"Unterstufe 3",subject:"Englisch",name:"A1 \xB7 Alltag & H\xF6flichkeit",flang:"en-US",blang:"de-DE",cards:B([["hello","hallo"],["good morning","guten Morgen"],["good evening","guten Abend"],["goodbye","auf Wiedersehen"],["please","bitte"],["thank you","danke"],["you're welcome","gern geschehen"],["sorry","Entschuldigung"],["excuse me","entschuldigen Sie"],["yes","ja"],["no","nein"],["see you soon","bis bald"],["how are you?","wie geht es dir?"],["my name is \u2026","ich hei\xDFe \u2026"],["nice to meet you","freut mich"]])},{category:"Unterstufe 3",subject:"Englisch",name:"A1 \xB7 Zahlen 1\u201312",flang:"en-US",blang:"de-DE",cards:B([["one","eins"],["two","zwei"],["three","drei"],["four","vier"],["five","f\xFCnf"],["six","sechs"],["seven","sieben"],["eight","acht"],["nine","neun"],["ten","zehn"],["eleven","elf"],["twelve","zw\xF6lf"]])},{category:"Unterstufe 3",subject:"Englisch",name:"A1 \xB7 Farben",flang:"en-US",blang:"de-DE",cards:B([["red","rot"],["blue","blau"],["green","gr\xFCn"],["yellow","gelb"],["black","schwarz"],["white","wei\xDF"],["orange","orange"],["brown","braun"],["pink","rosa"],["grey","grau"],["purple","lila"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 Les bases (H\xF6flichkeit)",flang:"fr-FR",blang:"de-DE",cards:B([["bonjour","guten Tag / hallo"],["salut","hallo (informell)"],["bonsoir","guten Abend"],["au revoir","auf Wiedersehen"],["s'il vous pla\xEEt","bitte"],["merci","danke"],["de rien","gern geschehen"],["pardon","Entschuldigung"],["excusez-moi","entschuldigen Sie"],["oui","ja"],["non","nein"],["\xE0 bient\xF4t","bis bald"],["comment \xE7a va ?","wie geht es dir?"],["je m'appelle \u2026","ich hei\xDFe \u2026"],["enchant\xE9","freut mich"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 Les nombres 1\u201312",flang:"fr-FR",blang:"de-DE",cards:B([["un","eins"],["deux","zwei"],["trois","drei"],["quatre","vier"],["cinq","f\xFCnf"],["six","sechs"],["sept","sieben"],["huit","acht"],["neuf","neun"],["dix","zehn"],["onze","elf"],["douze","zw\xF6lf"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 Les couleurs",flang:"fr-FR",blang:"de-DE",cards:B([["rouge","rot"],["bleu","blau"],["vert","gr\xFCn"],["jaune","gelb"],["noir","schwarz"],["blanc","wei\xDF"],["orange","orange"],["marron","braun"],["rose","rosa"],["gris","grau"],["violet","lila"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 La famille",flang:"fr-FR",blang:"de-DE",cards:B([["la m\xE8re","die Mutter"],["le p\xE8re","der Vater"],["la s\u0153ur","die Schwester"],["le fr\xE8re","der Bruder"],["les parents","die Eltern"],["la grand-m\xE8re","die Gro\xDFmutter"],["le grand-p\xE8re","der Gro\xDFvater"],["le fils","der Sohn"],["la fille","die Tochter / das M\xE4dchen"],["l'enfant","das Kind"],["la famille","die Familie"],["la tante","die Tante"],["l'oncle","der Onkel"]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Rationale Zahlen \u2014 Rechnen mit Vorzeichen",flang:"de-DE",blang:"de-DE",cards:B([["Warum ist (\u22123) \xB7 (\u22124) = +12?","Weil das Gegenteil vom Gegenteil das Original ist.","Minus dreht die Richtung um \u2014 zweimal umdrehen f\xFChrt zur\xFCck. Anschaulich mit Geld: Wenn dir jemand dreimal Schulden von 4 Euro erl\xE4sst, hast du 12 Euro mehr. Schulden wegnehmen wirkt wie Geld bekommen."],["\u22127 + 3 = ?","\u22124.","Am Zahlenstrahl drei Schritte nach rechts von \u22127 aus. Plus hei\xDFt immer: nach rechts. Auch im Minusbereich."],["5 \u2212 (\u22122) = ?","7.","Das Minus vor der Klammer dreht das Vorzeichen um: aus \u2212(\u22122) wird +2. Deshalb wird die Zahl gr\xF6\xDFer, obwohl ein Minuszeichen dasteht."],["Was bedeutet der Betrag |\u22129|?","9.","Der Betrag ist der Abstand zur Null \u2014 und ein Abstand ist nie negativ. |\u22129| und |9| sind beide 9, weil beide Zahlen gleich weit von der Null entfernt liegen."],["Welche Zahl ist gr\xF6\xDFer: \u22128 oder \u22123?","\u22123.","Bei negativen Zahlen ist die mit dem kleineren Betrag die gr\xF6\xDFere. Denk an Temperaturen: \u22123 Grad sind w\xE4rmer als \u22128 Grad, obwohl 8 die gr\xF6\xDFere Ziffer ist."],["(\u221212) : (\u22123) = ?","4.","Gleiche Vorzeichen ergeben ein positives Ergebnis \u2014 dieselbe Regel wie beim Multiplizieren. Probe: 4 \xB7 (\u22123) = \u221212, es geht auf."],["(\u221212) : 3 = ?","\u22124.","Verschiedene Vorzeichen ergeben ein negatives Ergebnis. Probe: (\u22124) \xB7 3 = \u221212."],["Es hat 4 \xB0C und wird um 9 Grad k\xE4lter. Wie kalt ist es?","\u22125 \xB0C.","4 \u2212 9 = \u22125. Der Zahlenstrahl h\xF6rt bei null nicht auf, er geht darunter weiter. Genau daf\xFCr wurden negative Zahlen erfunden \u2014 anfangs \xFCbrigens f\xFCr Schulden, nicht f\xFCr Temperaturen."],["Was ist die Gegenzahl von \u22122,5?","+2,5.","Eine Zahl und ihre Gegenzahl ergeben zusammen immer 0. Am Zahlenstrahl liegen sie spiegelbildlich zur Null."],["(\u22122)\xB3 = ?","\u22128.","Drei Minus-Faktoren, also eine ungerade Anzahl \u2014 es bleibt eines \xFCbrig, das Ergebnis ist negativ. Merkregel: gerade Anzahl Minus = plus, ungerade = minus."],["(\u22122)\u2074 = ?","+16.","Vier Minus-Faktoren, also eine gerade Anzahl \u2014 sie heben sich paarweise auf. Achtung auf die Klammer: (\u22122)\u2074 ist +16, aber \u22122\u2074 ist \u221216, weil dort nur die 2 potenziert wird."],["Kontostand \u2212120 \u20AC, dann kommen 200 \u20AC dazu. Wie steht es?","+80 \u20AC.","\u2212120 + 200 = 80. Zuerst wird das Loch gef\xFCllt, erst was dar\xFCber hinausgeht, ist Guthaben. Das ist die anschaulichste Art, negative Zahlen zu verstehen."],["Warum gilt a \u2212 b = a + (\u2212b)?","Subtrahieren hei\xDFt: die Gegenzahl addieren.","Damit braucht man am Ende nur noch eine einzige Rechenart. Das klingt nach Wortklauberei, macht aber alles einfacher: Man muss sich nur noch Regeln f\xFCrs Addieren merken, nicht zus\xE4tzlich f\xFCrs Subtrahieren."],["Ordne der Gr\xF6\xDFe nach: \u22125; 0,5; \u22120,5; 5","\u22125 < \u22120,5 < 0,5 < 5.","Je weiter links am Zahlenstrahl, desto kleiner. Der h\xE4ufigste Fehler ist, nur auf die Ziffern zu schauen \u2014 dann landet \u22125 f\xE4lschlich hinter \u22120,5."]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Terme & Gleichungen",flang:"de-DE",blang:"de-DE",cards:B([["Was unterscheidet einen Term von einer Gleichung?","Ein Term ist ein Rechenausdruck, eine Gleichung behauptet, dass zwei Terme gleich sind.","3x + 2 ist ein Term \u2014 man kann ihn ausrechnen, wenn man x kennt. 3x + 2 = 11 ist eine Gleichung: Sie stellt eine Behauptung auf, die nur f\xFCr bestimmte x stimmt. Deshalb kann man Gleichungen l\xF6sen, Terme aber nur umformen."],["Fasse zusammen: 5a + 3b \u2212 2a + b","3a + 4b.","Zusammenfassen darf man nur, was dieselbe Variable hat: 5a \u2212 2a = 3a und 3b + b = 4b. Das einzelne b z\xE4hlt als 1b \u2014 der h\xE4ufigste Fl\xFCchtigkeitsfehler ist, es zu \xFCbersehen."],["Warum darf man 5a und 3b nicht addieren?","Weil es verschiedene Dinge sind.","Wie 5 \xC4pfel und 3 Birnen: zusammen sind es 8 St\xFCck Obst, aber weder 8 \xC4pfel noch 8 Birnen. Solange man nicht wei\xDF, was a und b sind, muss beides nebeneinander stehen bleiben."],["L\xF6se: 3x + 2 = 11","x = 3.","Erst auf beiden Seiten \u22122, das ergibt 3x = 9, dann beide Seiten :3. Man arbeitet sich von au\xDFen nach innen vor \u2014 genau umgekehrt zur Rechenreihenfolge."],["Was ist mit dem Waage-Modell gemeint?","Eine Gleichung ist eine Waage im Gleichgewicht.","Was du links tust, musst du rechts genauso tun, sonst kippt sie. Dieses Bild erkl\xE4rt jede Umformung: Man nimmt auf beiden Seiten dasselbe weg oder legt dasselbe dazu. Und es erkl\xE4rt, warum man nicht durch null teilen darf \u2014 das w\xE4re, als w\xFCrde man die Waage wegnehmen."],["L\xF6se: 4(x \u2212 2) = 12","x = 5.","Zwei Wege f\xFChren hin: ausmultiplizieren zu 4x \u2212 8 = 12, oder gleich beide Seiten durch 4 teilen (x \u2212 2 = 3). Der zweite ist k\xFCrzer \u2014 bei einer Klammer mit gemeinsamem Faktor lohnt sich immer der Blick, ob Teilen schneller geht."],["Multipliziere aus: 3(2x + 5)","6x + 15.","Der Faktor vor der Klammer trifft jeden Summanden darin, nicht nur den ersten. Das ist der h\xE4ufigste Fehler: 6x + 5 statt 6x + 15."],["Hebe heraus: 6x + 9","3(2x + 3).","Der gr\xF6\xDFte gemeinsame Faktor ist 3. Herausheben ist die Umkehrung des Ausmultiplizierens \u2014 zur Probe multipliziert man zur\xFCck."],["Wo steckt der Fehler: 2x + 3x = 6x?","Richtig ist 5x.","Beim Addieren z\xE4hlt man die St\xFCcke zusammen, man multipliziert sie nicht. Zwei x plus drei x sind f\xFCnf x \u2014 so wie 2 \xC4pfel plus 3 \xC4pfel f\xFCnf \xC4pfel sind, nicht sechs."],["Warum ist 2x + 3x = 5x, aber 2x \xB7 3x = 6x\xB2?","Beim Addieren bleibt es bei x-St\xFCcken, beim Multiplizieren treffen auch die x aufeinander.","2x \xB7 3x hei\xDFt 2 \xB7 x \xB7 3 \xB7 x. Die Zahlen ergeben 6, die beiden x ergeben x\xB2. Deshalb steigt beim Multiplizieren die Hochzahl, beim Addieren nicht."],["Setze x = \u22122 ein in 3x\xB2 \u2212 x","14.","3 \xB7 (\u22122)\xB2 = 3 \xB7 4 = 12, und minus (\u22122) hei\xDFt plus 2. Wichtig ist die Klammer beim Quadrieren: (\u22122)\xB2 ist +4, denn minus mal minus gibt plus."],["Wie pr\xFCfst du, ob deine L\xF6sung stimmt?","Einsetzen in die urspr\xFCngliche Gleichung.","Kommt links und rechts dasselbe heraus, passt es. Diese Probe kostet zwanzig Sekunden und findet fast jeden Rechenfehler \u2014 und sie geht immer, egal wie kompliziert der Weg war."],["\xDCbersetze: Das Doppelte einer Zahl, vermindert um 5, ergibt 9.","2x \u2212 5 = 9, also x = 7.","Erst den Text in Symbole \xFCbersetzen, dann rechnen. Bei Textaufgaben ist das \xDCbersetzen die eigentliche Arbeit \u2014 wer die Gleichung hat, hat das Schwierigste hinter sich."],["L\xF6se: x/4 = 7","x = 28.","Beide Seiten mal 4. Jede Rechenart wird durch ihre Gegenrechnung r\xFCckg\xE4ngig gemacht: Teilen durch Malnehmen, Minus durch Plus."]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Prozent & Zinsen",flang:"de-DE",blang:"de-DE",cards:B([["Was bedeutet 1 %?","Ein Hundertstel \u2014 also 1 von 100 Teilen oder 0,01.","Das Wort kommt vom lateinischen \u201Epro centum\u201C, f\xFCr hundert. Deshalb ist Prozentrechnen im Kern nichts anderes als Bruchrechnen mit dem Nenner 100."],["25 % von 80 = ?","20.","25 % ist ein Viertel, und 80 : 4 = 20. Diese drei sollte man auswendig k\xF6nnen: 25 % = ein Viertel, 50 % = die H\xE4lfte, 10 % = Komma eine Stelle nach links."],["Wie berechnest du den Prozentwert allgemein?","Grundwert mal Prozentsatz, geteilt durch 100.","Beispiel: 200 \xB7 15 : 100 = 30. K\xFCrzer geht es mit der Dezimalzahl: 200 \xB7 0,15. Wer 15 % als 0,15 denkt, spart sich das Teilen."],["Ein Pulli kostet 60 \u20AC, es gibt 20 % Rabatt. Was zahlst du?","48 \u20AC.","20 % von 60 sind 12 \u20AC, also 60 \u2212 12. Wer sich verrechnet, pr\xFCft mit der Grobsch\xE4tzung: ein F\xFCnftel weg, es m\xFCssen also gut 48 sein."],["Wie rechnest du 20 % Rabatt in einem einzigen Schritt?","Mal 0,8.","Du zahlst ja noch 80 %. Also 60 \xB7 0,8 = 48. Dieser Trick ist bei mehreren Rabatten hintereinander unschlagbar: zweimal 20 % sind 0,8 \xB7 0,8 = 0,64, also 36 % Nachlass."],["Ein Preis steigt von 50 \u20AC auf 60 \u20AC. Um wie viel Prozent?","20 %.","Die \xC4nderung von 10 \u20AC wird durch den ALTEN Wert geteilt: 10 : 50 = 0,2. Der h\xE4ufigste Fehler ist, durch den neuen Wert zu teilen \u2014 dann k\xE4me 16,7 % heraus."],["Warum ist +10 % und danach \u221210 % nicht wieder der Startwert?","Weil sich der Grundwert dazwischen \xE4ndert.","100 \u2192 110 \u2192 99. Der Abschlag von 10 % bezieht sich auf 110, nicht mehr auf 100. Prozente beziehen sich immer auf den aktuellen Wert \u2014 deshalb sind sie in Nachrichten so leicht irref\xFChrend."],["Was ist der Grundwert?","Das Ganze, also die 100 %.","Die Zahl, auf die sich der Prozentsatz bezieht. Bei jeder Prozentaufgabe lohnt die erste Frage: Wovon sind es Prozent? Wer den Grundwert falsch w\xE4hlt, rechnet richtig und liegt trotzdem daneben."],["500 \u20AC zu 3 % pro Jahr \u2014 wie viel Zinsen nach einem Jahr?","15 \u20AC.","500 \xB7 3 : 100 = 15. Zinsen sind nichts anderes als Prozentrechnung mit der Zeit als drittem Faktor."],["Wie viel Zinsen bringen 500 \u20AC zu 3 % nach 4 Monaten?","5 \u20AC.","Der Jahreszins von 15 \u20AC mal 4/12, weil nur ein Drittel des Jahres vergangen ist. Banken rechnen \xFCblicherweise mit 12 Monaten zu 30 Tagen \u2014 deshalb funktioniert die einfache Bruchrechnung."],["Was ist Zinseszins?","Die Zinsen bleiben liegen und werden selbst mitverzinst.","Deshalb w\xE4chst Geld nicht gleichm\xE4\xDFig, sondern immer schneller. Faustregel f\xFCr \xDCberschlagsrechnungen: 70 geteilt durch den Zinssatz ergibt ungef\xE4hr die Jahre bis zur Verdopplung \u2014 bei 3 % also rund 23 Jahre."],["Netto 200 \u20AC, dazu 19 % Mehrwertsteuer. Wie viel brutto?","238 \u20AC.","200 \xB7 1,19. In \xD6sterreich sind es meist 20 %, dann w\xE4re es 240 \u20AC. Der Satz h\xE4ngt vom Land und von der Warenart ab \u2014 Lebensmittel und B\xFCcher haben erm\xE4\xDFigte S\xE4tze."],["Brutto 119 \u20AC bei 19 % Mehrwertsteuer \u2014 wie hoch ist netto?","100 \u20AC.","Nicht 19 % abziehen, sondern durch 1,19 teilen. Wer 19 % von 119 abzieht, landet bei 96,39 \u20AC und damit falsch \u2014 der Steuersatz bezieht sich auf den Nettopreis, nicht auf den Bruttopreis."],["Warum ergeben 20 % plus nochmal 20 % Rabatt nicht 40 %?","Der zweite Rabatt greift auf den bereits gesenkten Preis.","0,8 \xB7 0,8 = 0,64, zusammen also 36 % Nachlass. Genau damit wird im Handel gern geworben \u2014 \u201E20 % plus 20 % extra\u201C klingt nach 40, ist es aber nie."]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Fl\xE4chen, K\xF6rper & Einheiten",flang:"de-DE",blang:"de-DE",cards:B([["Wie berechnest du die Fl\xE4che eines Dreiecks?","A = g \xB7 h : 2 \u2014 Grundlinie mal zugeh\xF6rige H\xF6he, halbiert.","Wichtig ist das Wort zugeh\xF6rig: Die H\xF6he muss senkrecht auf genau der Grundlinie stehen, die man eingesetzt hat. Bei einem schiefen Dreieck liegt sie manchmal au\xDFerhalb der Figur."],["Warum steht in der Dreiecksformel das : 2?","Weil ein Dreieck die H\xE4lfte eines Parallelogramms ist.","Zwei gleiche Dreiecke lassen sich immer zu einem Parallelogramm zusammenlegen \u2014 man dreht das zweite um 180 Grad. Wer die Formel vergisst, kann sie sich so in zehn Sekunden herleiten."],["Rechteck 6 cm mal 4 cm \u2014 Fl\xE4che und Umfang?","A = 24 cm\xB2, Umfang = 20 cm.","Fl\xE4che ist der Inhalt, Umfang die L\xE4nge des Randes. Die Einheit verr\xE4t, was gemeint ist: cm\xB2 f\xFCr Fl\xE4che, cm f\xFCr L\xE4nge. Wer die Einheit mitschreibt, merkt Verwechslungen sofort."],["Was passiert mit der Fl\xE4che, wenn du beide Seiten verdoppelst?","Sie vervierfacht sich.","Fl\xE4che w\xE4chst mit dem Quadrat des Faktors: 2 \xB7 2 = 4. Deshalb ist eine Pizza mit doppeltem Durchmesser viermal so viel Pizza \u2014 und deshalb sind gro\xDFe Pizzen fast immer g\xFCnstiger je Quadratzentimeter."],["Wie berechnest du die Fl\xE4che eines Parallelogramms?","A = g \xB7 h.","Die H\xF6he steht senkrecht auf der Grundlinie \u2014 es ist nicht die schr\xE4ge Seite. Das ist der h\xE4ufigste Fehler bei dieser Figur, weil die schr\xE4ge Seite so einladend danebensteht."],["Wie berechnest du das Volumen eines Quaders?","V = L\xE4nge \xB7 Breite \xB7 H\xF6he.","Anders gesagt: Grundfl\xE4che mal H\xF6he. Man kann sich vorstellen, wie die Grundfl\xE4che Schicht f\xFCr Schicht nach oben gestapelt wird."],["Wie berechnest du das Volumen eines Prismas?","V = G \xB7 h \u2014 Grundfl\xE4che mal H\xF6he.","Egal welche Form die Grundfl\xE4che hat: Dreieck, Sechseck, Kreis. Dieselbe Vorstellung wie beim Quader \u2014 die Grundfl\xE4che wird nach oben gestapelt. Deshalb gilt beim Zylinder dasselbe."],["Wie viele cm\xB3 sind 1 Liter?","1000 cm\xB3.","Das ist genau 1 dm\xB3, also ein W\xFCrfel mit 10 cm Kante. Diese Verbindung ist praktisch: Ein Milchpaket ist ungef\xE4hr so ein W\xFCrfel, damit hat man ein Gef\xFChl f\xFCr einen Liter."],["Wie viele cm\xB2 sind 1 m\xB2?","10 000 cm\xB2.","Denn 100 \xB7 100. Bei Fl\xE4chen z\xE4hlt der Umrechnungsfaktor doppelt, bei Volumen dreifach: 1 m\xB3 sind eine Million cm\xB3. Das \xFCberrascht fast jeden beim ersten Mal."],["Oberfl\xE4che eines W\xFCrfels mit 5 cm Kante?","150 cm\xB2.","Sechs Fl\xE4chen zu je 25 cm\xB2. Ein W\xFCrfel hat sechs gleiche Seiten \u2014 die Formel lautet also immer 6 \xB7 a\xB2."],["Was ist der Unterschied zwischen Oberfl\xE4che und Volumen?","Die Oberfl\xE4che ist die Verpackung, das Volumen der Inhalt.","Oberfl\xE4che in cm\xB2, Volumen in cm\xB3. Praktisch gedacht: F\xFCr Farbe brauchst du die Oberfl\xE4che, f\xFCr F\xFCllmenge das Volumen."],["Ein Becken misst 10 m \xB7 5 m \xB7 2 m. Wie viele Liter fasst es?","100 000 Liter.","Das sind 100 m\xB3, und 1 m\xB3 entspricht 1000 Litern. Zum Vergleich: Eine Badewanne fasst etwa 150 Liter \u2014 dieses Becken also rund 660 Badewannen."],["Warum passt in einen W\xFCrfel mit doppelter Kante 8-mal so viel?","Weil das Volumen mit der dritten Potenz w\xE4chst.","2 \xB7 2 \xB7 2 = 8. Genau darum werden gro\xDFe Tiere nicht einfach hochskaliert: Verdoppelt sich die Gr\xF6\xDFe, verachtfacht sich das Gewicht, aber die Knochenquerschnitte vervierfachen sich nur. Deshalb sehen Elefantenbeine anders aus als Rehbeine."]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Proportionalit\xE4t & Dreisatz",flang:"de-DE",blang:"de-DE",cards:B([["Was hei\xDFt direkt proportional?","Doppelte Menge, doppelter Preis \u2014 der Quotient bleibt gleich.","Bei 3 kg f\xFCr 6 \u20AC kostet 1 kg immer 2 \u20AC, egal wie viel man kauft. Dieser gleichbleibende Wert je Einheit ist der Schl\xFCssel zum Dreisatz."],["Was hei\xDFt indirekt proportional?","Doppelt so viele Arbeiter, halbe Zeit \u2014 das Produkt bleibt gleich.","Die Arbeit ist ja dieselbe, sie verteilt sich nur auf mehr Schultern. Deshalb bleibt Arbeiter mal Tage konstant."],["3 kg \xC4pfel kosten 6 \u20AC. Was kosten 5 kg?","10 \u20AC.","Erst auf 1 kg herunterrechnen (2 \u20AC), dann mal 5. Dieser Umweg \xFCber die Einheit hei\xDFt Dreisatz und funktioniert bei jeder direkt proportionalen Aufgabe."],["4 Maler brauchen 6 Tage. Wie lange brauchen 3?","8 Tage.","Die Arbeit umfasst 24 Manntage (4 \xB7 6), geteilt durch 3 Maler. Vorsicht im echten Leben: Ab einer gewissen Zahl behindern sich Leute gegenseitig \u2014 die Rechnung gilt nur im Idealfall."],["Woran erkennst du direkte Proportionalit\xE4t im Diagramm?","An einer Geraden, die durch den Ursprung geht.","Beides muss stimmen: gerade UND durch den Nullpunkt. Eine Gerade, die bei 5 startet, ist nicht proportional \u2014 etwa bei einem Taxi mit Grundgeb\xFChr."],["Ist der Zusammenhang von Alter und K\xF6rpergr\xF6\xDFe proportional?","Nein.","Mit 20 ist niemand doppelt so gro\xDF wie mit 10. Gemeinsames Wachsen hei\xDFt nicht proportional \u2014 das ist der h\xE4ufigste Denkfehler bei diesem Thema."],["Ma\xDFstab 1 : 50 000 \u2014 3 cm auf der Karte sind wie viel in echt?","1,5 km.","3 \xB7 50 000 cm = 150 000 cm = 1,5 km. Merkhilfe: Bei 1 : 50 000 entspricht 1 cm genau 500 m, bei 1 : 25 000 sind es 250 m."],["Ein Rezept ist f\xFCr 4 Personen, du kochst f\xFCr 6. Womit multiplizierst du?","Mit 1,5.","6 : 4 = 1,5, und damit wird jede Zutat multipliziert. Beim Kochen gilt das allerdings nicht f\xFCr alles: Garzeiten und Gew\xFCrze skalieren nicht mit."],["10 K\xFChe fressen einen Heuhaufen in 8 Tagen. Wie lange brauchen 20?","4 Tage.","Mehr K\xFChe, weniger Zeit \u2014 indirekt proportional. Das Produkt bleibt gleich: 10 \xB7 8 = 20 \xB7 4 = 80."],["Was bleibt bei indirekter Proportionalit\xE4t konstant?","Das Produkt der beiden Gr\xF6\xDFen.","Zum Beispiel Arbeiter mal Tage oder Geschwindigkeit mal Fahrzeit. Bei direkter Proportionalit\xE4t ist es dagegen der Quotient \u2014 daran lassen sich die beiden F\xE4lle sicher unterscheiden."],["Wie erkennst du beim Dreisatz, ob du mal oder geteilt rechnest?","\xDCberlege, ob das Ergebnis gr\xF6\xDFer oder kleiner werden muss.","Bei indirekter Proportionalit\xE4t dreht sich die Rechnung um. Diese \xDCberlegung dauert zwei Sekunden und verhindert den h\xE4ufigsten Fehler \u2014 mechanisch angewandte Dreis\xE4tze gehen oft in die falsche Richtung."],["Warum ist \u201Eje mehr, desto mehr\u201C noch keine Proportionalit\xE4t?","Proportional hei\xDFt: doppelt so viel f\xFChrt zu exakt doppelt so viel.","Sonst w\xE4chst es nur irgendwie mit. Ein Baum wird mit den Jahren gr\xF6\xDFer, aber nicht proportional zum Alter \u2014 sonst w\xE4ren hundertj\xE4hrige B\xE4ume zehnmal so hoch wie zehnj\xE4hrige."]])},{category:"Unterstufe 3",subject:"Mathematik",name:"Statistik & Diagramme lesen",flang:"de-DE",blang:"de-DE",cards:B([["Was ist das arithmetische Mittel?","Der Durchschnitt: alle Werte addieren, durch die Anzahl teilen.","Es ist der Wert, den alle h\xE4tten, wenn man gleichm\xE4\xDFig verteilte. Genau deshalb ist es empfindlich gegen Ausrei\xDFer \u2014 ein einziger sehr hoher Wert zieht alle mit hoch."],["Was ist der Median?","Der Wert genau in der Mitte, wenn man alle der Gr\xF6\xDFe nach ordnet.","Bei gerader Anzahl nimmt man den Durchschnitt der beiden mittleren. Der Median sagt: Die eine H\xE4lfte liegt dar\xFCber, die andere darunter."],["Warum ist der Median oft aussagekr\xE4ftiger als der Durchschnitt?","Weil ein einzelner Ausrei\xDFer ihn kaum bewegt.","Beispiel Einkommen: Sitzt in einem Raum mit zehn Leuten ein Milliard\xE4r, ist das Durchschnittseinkommen gewaltig \u2014 der Median bleibt bei dem, was die meisten verdienen. Deshalb wird bei L\xF6hnen und Mieten meist der Median genannt."],["Noten 1, 2, 2, 3, 5 \u2014 wie hoch ist der Mittelwert?","2,6.","Die Summe ist 13, geteilt durch 5 Werte. Die 5 zieht den Schnitt sp\xFCrbar nach oben, obwohl sie nur einmal vorkommt."],["Noten 1, 2, 2, 3, 5 \u2014 wie hoch ist der Median?","2.","Es ist der dritte von f\xFCnf geordneten Werten. Verglichen mit dem Mittelwert von 2,6 sieht man den Ausrei\xDFer-Effekt an einem einzigen Beispiel."],["Was ist der Modus?","Der Wert, der am h\xE4ufigsten vorkommt.","Er ist der einzige der drei Mittelwerte, der auch bei nicht-zahlenm\xE4\xDFigen Daten funktioniert: die h\xE4ufigste Augenfarbe, das meistverkaufte Modell."],["Was ist die Spannweite?","Gr\xF6\xDFter Wert minus kleinster Wert.","Sie beschreibt, wie weit die Daten streuen \u2014 sagt aber nichts dar\xFCber, wie sie dazwischen verteilt sind. Zwei v\xF6llig verschiedene Datens\xE4tze k\xF6nnen dieselbe Spannweite haben."],["Wof\xFCr eignet sich ein Kreisdiagramm?","F\xFCr Anteile an einem Ganzen.","Alle Sektoren zusammen ergeben 100 %. Bei mehr als etwa f\xFCnf Teilen wird es unlesbar \u2014 und Gr\xF6\xDFen vergleichen kann das Auge in Kreisen schlechter als in Balken."],["Wof\xFCr eignet sich ein Liniendiagramm?","F\xFCr Entwicklungen \xFCber die Zeit.","Die Linie zwischen zwei Punkten behauptet dabei etwas: dass sich der Wert dazwischen gleichm\xE4\xDFig ge\xE4ndert hat. Bei monatlichen Messungen stimmt das oft nicht genau."],["Wie kann ein Diagramm t\xE4uschen, ohne zu l\xFCgen?","Wenn die senkrechte Achse nicht bei null beginnt.","Dann wirken winzige Unterschiede riesig. Alle Zahlen k\xF6nnen stimmen und das Bild trotzdem in die Irre f\xFChren. Deshalb: bei jedem Diagramm zuerst auf die Achsenbeschriftung schauen."],["Was ist eine relative H\xE4ufigkeit?","Ein Anteil statt einer Anzahl.","5 von 20 sind 0,25, also 25 %. Erst der Anteil macht Gruppen vergleichbar: 30 F\xE4lle in einer Kleinstadt bedeuten etwas ganz anderes als 30 F\xE4lle in Wien."],["Warum sagt \u201Edurchschnittlich 1,5 Kinder\u201C nichts \xFCber eine echte Familie?","Der Durchschnitt ist eine Rechengr\xF6\xDFe, keine Beschreibung.","Es gibt keine Familie mit einem halben Kind. Der Wert beschreibt die Gesamtheit, nicht den Einzelfall \u2014 dieser Unterschied wird in Zeitungen st\xE4ndig verwischt."]])},{category:"Unterstufe 3",subject:"Physik",name:"Strom, Spannung & Widerstand",flang:"de-DE",blang:"de-DE",cards:B([["Was flie\xDFt in einem Stromkreis eigentlich?","Elektronen.","Sie sind schon im Draht vorhanden und werden von der Quelle nur in Bewegung gesetzt. Die Batterie liefert also keine Elektronen, sondern den Antrieb \u2014 wie eine Pumpe, die vorhandenes Wasser bewegt."],["Warum leuchtet eine Lampe sofort, obwohl Elektronen langsam sind?","Weil sich der Ansto\xDF fast mit Lichtgeschwindigkeit fortpflanzt.","Die einzelnen Elektronen kriechen mit weniger als einem Millimeter pro Sekunde. Wie bei einer vollen Wasserleitung: Man dreht auf, und es spritzt sofort \u2014 nicht weil das Wasser so schnell ist, sondern weil das Rohr schon voll war."],["Was beschreibt die Spannung U?","Den Antrieb, gemessen in Volt.","Bildlich der H\xF6henunterschied, der Wasser flie\xDFen l\xE4sst. Spannung liegt an, auch wenn nichts flie\xDFt \u2014 eine Batterie im Schrank hat 1,5 V, obwohl kein Strom flie\xDFt."],["Was beschreibt die Stromst\xE4rke I?","Wie viel Ladung pro Sekunde flie\xDFt, gemessen in Ampere.","Bildlich die Wassermenge pro Sekunde. F\xFCr den Menschen gef\xE4hrlich wird es ab etwa 30 Milliampere \u2014 das ist erstaunlich wenig, ein F\xF6hn zieht das Vierzigfache."],["Was beschreibt der Widerstand R?","Wie stark das Material den Strom bremst, gemessen in Ohm.","Bildlich ein enges Rohr. Bei den meisten Metallen steigt der Widerstand mit der Temperatur \u2014 ein hei\xDFer Draht leitet also schlechter als ein kalter."],["Wie lautet das ohmsche Gesetz?","U = R \xB7 I.","Mehr Spannung treibt mehr Strom, mehr Widerstand bremst ihn. Aus dieser einen Formel lassen sich alle drei Gr\xF6\xDFen bestimmen, wenn man zwei kennt."],["12 V liegen an 4 \u03A9 an. Wie gro\xDF ist die Stromst\xE4rke?","3 A.","I = U : R = 12 : 4. Zur Probe r\xFCckw\xE4rts einsetzen: 4 \xB7 3 = 12 V, es geht auf."],["Was ist der Unterschied zwischen Reihen- und Parallelschaltung?","In Reihe flie\xDFt derselbe Strom, parallel liegt dieselbe Spannung an.","In Reihe teilt sich die Spannung auf die Bauteile auf, parallel teilt sich der Strom. Das erkl\xE4rt fast alles, was Schaltungen im Alltag betrifft."],["Warum gehen bei einer alten Lichterkette alle Lampen aus, wenn eine kaputt ist?","Sie sind in Reihe geschaltet.","Ein Defekt unterbricht den einzigen Weg f\xFCr den Strom. Moderne Ketten sind deshalb parallel verdrahtet oder haben \xDCberbr\xFCckungen in jeder Fassung."],["Warum sind Steckdosen im Haus parallel geschaltet?","Damit an jedem Ger\xE4t die vollen 230 V anliegen.","Und damit man ein Ger\xE4t abschalten kann, ohne die anderen zu st\xF6ren. In Reihe m\xFCssten sich alle Ger\xE4te die Spannung teilen \u2014 der F\xF6hn liefe nur, wenn auch die Lampe an ist."],["Wozu dient eine Sicherung?","Sie unterbricht den Kreis, wenn zu viel Strom flie\xDFt.","Sonst w\xFCrden die Leitungen in der Wand hei\xDF und k\xF6nnten einen Brand ausl\xF6sen. Die Sicherung sch\xFCtzt also nicht das Ger\xE4t, sondern das Haus."],["Warum ist ein Kurzschluss gef\xE4hrlich?","Der Strom nimmt einen Weg fast ohne Widerstand.","Nach U = R \xB7 I schie\xDFt die Stromst\xE4rke hoch, wenn R gegen null geht. Die Leitung erhitzt sich schlagartig \u2014 genau davor sch\xFCtzt die Sicherung."],["Was ist elektrische Leistung?","P = U \xB7 I, gemessen in Watt.","Sie sagt, wie viel Energie pro Sekunde umgesetzt wird. Auf der Stromrechnung stehen dagegen Kilowattstunden \u2014 das ist Leistung mal Zeit, also die Energiemenge."],["Warum sind Leiter aus Metall und Isolatoren aus Kunststoff?","In Metallen sind Elektronen frei beweglich, in Kunststoffen fest gebunden.","Metalle geben ihre \xE4u\xDFeren Elektronen gewisserma\xDFen an die Allgemeinheit ab \u2014 dieses Elektronengas macht sie leitf\xE4hig und nebenbei auch gl\xE4nzend und verformbar."]])},{category:"Unterstufe 3",subject:"Physik",name:"Magnetismus & Elektromagnetismus",flang:"de-DE",blang:"de-DE",cards:B([["Welche Pole hat jeder Magnet?","Immer einen Nord- und einen S\xFCdpol.","Einen einzelnen Pol hat noch nie jemand gefunden. Bei elektrischer Ladung gibt es Plus und Minus getrennt \u2014 beim Magnetismus geht das nicht, und niemand wei\xDF genau, warum."],["Was passiert, wenn du einen Stabmagneten in der Mitte zerbrichst?","Du bekommst zwei vollst\xE4ndige Magnete mit je zwei Polen.","Nicht einen Nord- und einen S\xFCdteil. Das l\xE4sst sich beliebig fortsetzen: Auch das kleinste Bruchst\xFCck hat wieder beide Pole."],["Welche Pole ziehen sich an?","Ungleiche ziehen sich an, gleiche sto\xDFen sich ab.","Dieselbe Regel wie bei elektrischen Ladungen. Deshalb springen zwei Magnete auseinander, wenn man sie falsch herum zusammenschiebt."],["Welche Stoffe sind magnetisch?","Eisen, Nickel und Kobalt.","Aluminium und Kupfer zum Beispiel nicht \u2014 deshalb bleibt ein Magnet an einer Konservendose haften, an einer Getr\xE4nkedose aber nicht. Damit l\xE4sst sich M\xFCll sortieren."],["Wo zeigt die Nordnadel des Kompasses hin?","Zum geografischen Nordpol.","Dort liegt physikalisch ein magnetischer S\xFCdpol \u2014 sonst w\xFCrde sich die Nadel ja absto\xDFen. Die Bezeichnung stammt aus der Zeit vor dem Verst\xE4ndnis der Ursache und wurde nie korrigiert."],["Was entsteht rund um einen stromdurchflossenen Draht?","Ein Magnetfeld.","Strom und Magnetismus geh\xF6ren untrennbar zusammen. \xD8rsted entdeckte das 1820 zuf\xE4llig, als sich eine Kompassnadel neben einem Draht bewegte \u2014 eine der folgenreichsten Beobachtungen der Physik."],["Wie verst\xE4rkt man einen Elektromagneten?","Mehr Windungen, mehr Stromst\xE4rke, Eisenkern in der Spule.","Der Eisenkern bringt am meisten: Er verst\xE4rkt das Feld um ein Vielfaches, weil sich seine eigenen Elementarmagnete ausrichten."],["Was ist der gro\xDFe Vorteil eines Elektromagneten?","Man kann ihn ein- und ausschalten und seine St\xE4rke regeln.","Ein Dauermagnet ist immer an. Deshalb steckt in fast jedem Ger\xE4t ein Elektromagnet \u2014 und deshalb kann ein Schrottkran ein Auto anheben und wieder fallen lassen."],["Wo steckt im Alltag ein Elektromagnet?","In T\xFCrklingel, Lautsprecher, Elektromotor und Festplatte.","Im Lautsprecher bewegt er eine Membran im Takt des Stroms \u2014 Musik ist also nichts anderes als schnell wechselnder Magnetismus, der Luft in Schwingung versetzt."],["Was ist ein Magnetfeld?","Der Raum um einen Magneten, in dem seine Kraft wirkt.","Feldlinien laufen au\xDFen von Nord nach S\xFCd. Sichtbar machen kann man sie mit Eisensp\xE4nen auf einem Blatt Papier \u2014 sie ordnen sich genau entlang der Linien."],["Warum sch\xFCtzt uns das Erdmagnetfeld?","Es lenkt geladene Teilchen der Sonne ab.","Ohne diesen Schutz w\xFCrde der Sonnenwind die Atmosph\xE4re nach und nach abtragen \u2014 das ist vermutlich dem Mars passiert. Sichtbar wird die Ablenkung als Polarlicht."],["Wie funktioniert ein Elektromotor im Kern?","Ein Magnetfeld st\xF6\xDFt und zieht eine stromdurchflossene Spule, die sich dadurch dreht.","Damit sie sich weiterdreht, muss die Stromrichtung im richtigen Moment umgeklappt werden \u2014 daf\xFCr sorgt der Kommutator. Andersherum betrieben wird derselbe Aufbau zum Generator."]])},{category:"Unterstufe 3",subject:"Physik",name:"W\xE4rme, Energie & Aggregatzust\xE4nde",flang:"de-DE",blang:"de-DE",cards:B([["Was ist Temperatur im Teilchenmodell?","Ein Ma\xDF daf\xFCr, wie schnell sich die Teilchen bewegen.","Hei\xDF hei\xDFt schnell. Am absoluten Nullpunkt bei \u2212273,15 \xB0C st\xFCnde die Bewegung still \u2014 deshalb gibt es keine tiefere Temperatur. Nach oben gibt es dagegen keine Grenze."],["Was ist der Unterschied zwischen W\xE4rme und Temperatur?","Temperatur ist ein Zustand, W\xE4rme ist \xFCbertragene Energie.","Eine Badewanne mit 40 \xB0C enth\xE4lt viel mehr W\xE4rme als eine Tasse mit 40 \xB0C \u2014 gleiche Temperatur, ganz andere Energiemenge. Deshalb kann ein Funke sehr hei\xDF sein und trotzdem nicht wehtun."],["Warum dehnen sich Stoffe beim Erw\xE4rmen aus?","Die Teilchen bewegen sich heftiger und brauchen mehr Platz.","Sie werden nicht gr\xF6\xDFer \u2014 sie schwingen weiter aus. Genau darauf beruht das Thermometer: Die Fl\xFCssigkeit dehnt sich aus und steigt in der engen R\xF6hre sichtbar hoch."],["Warum haben Br\xFCcken Dehnungsfugen?","Damit sich das Material im Sommer ausdehnen kann, ohne dass etwas rei\xDFt.","Eine Stahlbr\xFCcke von 100 Metern wird zwischen Winter und Sommer um mehrere Zentimeter l\xE4nger. Ohne Fuge entst\xFCnden Kr\xE4fte, die Beton sprengen."],["Nenne die drei Arten des W\xE4rmetransports.","Leitung, Konvektion und Strahlung.","Leitung braucht Material, Konvektion braucht ein str\xF6mendes Medium, Strahlung braucht gar nichts \u2014 nur so kommt die Sonnenw\xE4rme durch das leere Weltall zu uns."],["Warum w\xE4rmt eine Thermoskanne so gut?","Sie unterbindet alle drei Transportwege.","Das Vakuum verhindert Leitung und Konvektion, die verspiegelte Wand wirft die Strahlung zur\xFCck. Deshalb h\xE4lt sie auch Kaltes kalt \u2014 sie d\xE4mmt in beide Richtungen."],["Was passiert beim Schmelzen im Teilchenmodell?","Die Teilchen l\xF6sen sich aus ihren festen Pl\xE4tzen und gleiten aneinander vorbei.","Sie bleiben dabei in Kontakt \u2014 deshalb hat eine Fl\xFCssigkeit noch ein festes Volumen, aber keine feste Form mehr. Beim Verdampfen l\xF6sen sie sich ganz voneinander."],["Warum bleibt Eiswasser bei 0 \xB0C, obwohl man weiter heizt?","Die Energie wird zum Schmelzen gebraucht, nicht zum Erw\xE4rmen.","Erst wenn das letzte Eis geschmolzen ist, steigt die Temperatur weiter. Diese verborgene Energie hei\xDFt Schmelzw\xE4rme \u2014 und sie ist der Grund, warum Eisw\xFCrfel ein Getr\xE4nk so wirksam k\xFChlen."],["Warum ist Wasser als K\xFChlmittel so gut?","Es nimmt sehr viel Energie auf, bevor seine Temperatur merklich steigt.","Wasser hat eine der h\xF6chsten W\xE4rmekapazit\xE4ten \xFCberhaupt. Deshalb k\xFChlt es Motoren, deshalb bleibt das Klima an K\xFCsten mild, und deshalb schwitzen wir Wasser aus, um uns abzuk\xFChlen."],["Was besagt die Energieerhaltung?","Energie geht nie verloren, sie wird nur umgewandelt.","Meistens landet sie am Ende als W\xE4rme, die sich verteilt und kaum noch nutzbar ist. Deshalb ist ein Perpetuum mobile unm\xF6glich: Es gibt keine Energie aus dem Nichts, und die brauchbare Energie wird bei jedem Schritt weniger."],["Warum ist die Anomalie des Wassers lebenswichtig?","Wasser ist bei 4 \xB0C am dichtesten, deshalb schwimmt Eis oben.","Fast alle Stoffe werden beim Erstarren dichter und sinken. Wasser nicht \u2014 sonst w\xFCrden Seen vom Grund her zufrieren und im Sommer nicht mehr auftauen. Fische \xFCberleben den Winter nur dank dieser Ausnahme."],["Warum f\xFChlt sich Metall k\xE4lter an als Holz bei gleicher Temperatur?","Metall leitet die W\xE4rme schneller von der Hand weg.","Gemessen sind beide gleich warm. Unsere Haut misst keine Temperatur, sondern den W\xE4rmestrom \u2014 deshalb ist unser Temperatursinn als Messger\xE4t unbrauchbar."]])},{category:"Unterstufe 3",subject:"Chemie",name:"Teilchenmodell & Stoffe",flang:"de-DE",blang:"de-DE",cards:B([["Woraus bestehen alle Stoffe?","Aus winzigen Teilchen, die st\xE4ndig in Bewegung sind."],["Wie ordnen sich Teilchen in fest, fl\xFCssig und gasf\xF6rmig?","Fest: dicht und auf festen Pl\xE4tzen. Fl\xFCssig: dicht, aber beweglich. Gasf\xF6rmig: weit auseinander und schnell."],["Was ist ein Reinstoff?","Ein Stoff aus nur einer Teilchensorte, zum Beispiel destilliertes Wasser oder Kupfer."],["Was ist ein Gemisch?","Mehrere Stoffe nebeneinander, zum Beispiel Luft, Salzwasser oder Granit."],["Wie trennt man Salz von Wasser?","Durch Eindampfen. Das Wasser verdunstet, das Salz bleibt zur\xFCck."],["Wie trennt man Sand von Wasser?","Durch Filtrieren \u2014 die Sandk\xF6rner sind zu gro\xDF f\xFCr den Filter."],["Was ist der Unterschied zwischen physikalischer und chemischer \xC4nderung?","Physikalisch \xE4ndert sich nur die Form oder der Zustand. Chemisch entsteht ein neuer Stoff mit neuen Eigenschaften."],["Ist Kerzenwachs schmelzen physikalisch oder chemisch?","Physikalisch \u2014 es bleibt Wachs. Das Verbrennen der Flamme dagegen ist chemisch."],["Was ist ein Atom?","Der kleinste Baustein eines chemischen Elements."],["Woraus besteht ein Wassermolek\xFCl?","Aus zwei Wasserstoffatomen und einem Sauerstoffatom, kurz H\u2082O."],["Warum riecht man Parfum quer durch den Raum?","Weil die Teilchen sich von selbst verteilen. Das nennt man Diffusion."],["Was passiert bei einer Verbrennung grunds\xE4tzlich?","Ein Stoff reagiert mit Sauerstoff, dabei wird Energie frei und es entstehen neue Stoffe."]])},{category:"Unterstufe 3",subject:"Informatik & Medien",name:"Wie Computer denken",flang:"de-DE",blang:"de-DE",cards:B([["Warum rechnen Computer mit Nullen und Einsen?","Weil sich zwei Zust\xE4nde technisch sicher unterscheiden lassen: Strom flie\xDFt oder eben nicht."],["Welche Dezimalzahl ist bin\xE4r 1011?","11. Denn 8 + 0 + 2 + 1, die Stellen stehen f\xFCr 8, 4, 2, 1."],["Wie schreibt man 20 bin\xE4r?","10100, also 16 + 4."],["Wie viele Werte kann ein Byte annehmen?","256 \u2014 acht Bits mit je zwei M\xF6glichkeiten, also 2 hoch 8."],["Was ist ein Algorithmus?","Eine eindeutige Schritt-f\xFCr-Schritt-Anleitung, die zu einem Ergebnis f\xFChrt. Ein Kochrezept ist einer."],["Was ist eine Schleife?","Eine Anweisung, die wiederholt wird, solange eine Bedingung gilt."],["Was ist eine Variable?","Ein benannter Platz im Speicher, in dem ein Wert liegt, der sich \xE4ndern kann."],["Warum finden Computer in sortierten Listen so schnell?","Sie halbieren den Suchbereich immer wieder. Bei einer Million Eintr\xE4gen reichen rund 20 Schritte."],["Was passiert technisch, wenn du eine Website aufrufst?","Dein Ger\xE4t fragt einen Server nach Daten, der schickt sie in Paketen zur\xFCck, der Browser setzt daraus die Seite zusammen."],["Was ist eine IP-Adresse?","Die Hausnummer eines Ger\xE4ts im Netz, damit Datenpakete den Weg zur\xFCckfinden."],["Warum sind pers\xF6nliche Daten wertvoll?","Weil sich damit Verhalten vorhersagen und Werbung verkaufen l\xE4sst. Was einmal drau\xDFen ist, holt man nicht zur\xFCck."],["Was macht ein Passwort sicher?","L\xE4nge vor Kompliziertheit. Ein langer Satz schl\xE4gt ein kurzes Zeichenwirrwarr \u2014 und f\xFCr jeden Dienst ein eigenes."]])},{category:"Unterstufe 3",subject:"Biologie",name:"Verdauung & Ern\xE4hrung",flang:"de-DE",blang:"de-DE",cards:B([["Wozu dient die Verdauung \xFCberhaupt?","Sie zerlegt gro\xDFe Nahrungsbausteine so weit, dass sie ins Blut aufgenommen werden k\xF6nnen."],["Wo beginnt die Verdauung?","Im Mund. Z\xE4hne zerkleinern mechanisch, der Speichel spaltet bereits St\xE4rke."],["Warum schmeckt lange gekautes Brot s\xFC\xDF?","Ein Enzym im Speichel zerlegt St\xE4rke in Zucker \u2014 man schmeckt die Verdauung f\xF6rmlich."],["Was passiert im Magen?","Salzs\xE4ure t\xF6tet Keime und der Nahrungsbrei wird durchmischt. Erste Eiwei\xDFe werden gespalten."],["Warum verdaut sich der Magen nicht selbst?","Eine dicke Schleimschicht sch\xFCtzt die Magenwand vor der eigenen S\xE4ure."],["Wo wird das meiste aufgenommen?","Im D\xFCnndarm. Zotten und Mikrozotten vergr\xF6\xDFern die Oberfl\xE4che auf die Gr\xF6\xDFe einer Wohnung."],["Warum ist die Oberfl\xE4che im Darm so wichtig?","Je gr\xF6\xDFer die Fl\xE4che, desto mehr N\xE4hrstoffe k\xF6nnen gleichzeitig ins Blut \xFCbertreten."],["Welche Aufgabe hat der Dickdarm?","Er entzieht dem Rest Wasser und Salze. \xDCbrig bleibt der eingedickte Stuhl."],["Was macht die Leber im Stoffwechsel?","Sie ist das chemische Zentrallabor: speichert Zucker, baut Giftstoffe ab und produziert Gallenfl\xFCssigkeit."],["Wof\xFCr braucht der K\xF6rper Kohlenhydrate, Fette, Eiwei\xDFe?","Kohlenhydrate als schnellen Treibstoff, Fette als Energiespeicher und Zellbaustoff, Eiwei\xDFe als Baumaterial."],["Warum sind Ballaststoffe wichtig, obwohl sie nicht verdaut werden?","Sie halten den Darm in Bewegung und machen lange satt."],["Warum sind Vitamine lebensnotwendig?","Sie steuern Vorg\xE4nge im K\xF6rper und k\xF6nnen meist nicht selbst hergestellt werden."],["Was ist der Unterschied zwischen Hunger und Appetit?","Hunger ist ein k\xF6rperliches Signal bei Energiemangel, Appetit ist Lust auf etwas Bestimmtes."],["Warum sind Darmbakterien n\xFCtzlich?","Sie zerlegen Reste, bilden Vitamine und halten Krankheitserreger in Schach."]])},{category:"Unterstufe 3",subject:"Biologie",name:"Atmung & Blutkreislauf",flang:"de-DE",blang:"de-DE",cards:B([["Wozu atmen wir?","Um Sauerstoff aufzunehmen, mit dem die Zellen N\xE4hrstoffe verbrennen, und um Kohlendioxid loszuwerden."],["Wo findet der Gasaustausch statt?","In den Lungenbl\xE4schen. Ihre Wand ist so d\xFCnn, dass Gase direkt ins Blut \xFCbertreten."],["Wie gro\xDF ist die Austauschfl\xE4che der Lunge?","Rund 100 Quadratmeter \u2014 etwa eine gro\xDFe Wohnung, zusammengefaltet in den Brustkorb."],["Wie kommt die Luft \xFCberhaupt in die Lunge?","Das Zwerchfell senkt sich, der Brustraum wird gr\xF6\xDFer, der Unterdruck saugt Luft an."],["Warum ist Nasenatmung besser als Mundatmung?","Die Nase filtert, w\xE4rmt und befeuchtet die Luft."],["Welche Aufgabe haben die roten Blutk\xF6rperchen?","Sie transportieren Sauerstoff, gebunden an den roten Farbstoff H\xE4moglobin."],["Welche Aufgabe haben die wei\xDFen Blutk\xF6rperchen?","Sie sind die Abwehr und bek\xE4mpfen Krankheitserreger."],["Wozu dienen Blutpl\xE4ttchen?","Sie lassen das Blut an Wunden gerinnen."],["Was ist der Unterschied zwischen Arterie und Vene?","Arterien f\xFChren vom Herzen weg und haben dicke W\xE4nde, Venen f\xFChren zum Herzen hin und besitzen Klappen."],["Warum braucht das Blut in den Beinvenen Klappen?","Weil es gegen die Schwerkraft nach oben muss. Die Klappen verhindern das Zur\xFCcksacken."],["Was ist der kleine Kreislauf?","Der Lungenkreislauf: vom Herzen zur Lunge und mit Sauerstoff beladen zur\xFCck."],["Wie viele Kammern hat das menschliche Herz?","Vier: zwei Vorh\xF6fe und zwei Kammern."],["Warum ist Ausdauersport gut f\xFCrs Herz?","Das Herz wird kr\xE4ftiger und pumpt pro Schlag mehr Blut. Der Ruhepuls sinkt."],["Was macht Rauchen mit der Lunge?","Es l\xE4hmt die Flimmerh\xE4rchen, zerst\xF6rt Lungenbl\xE4schen und verkleinert die Austauschfl\xE4che dauerhaft."]])},{category:"Unterstufe 3",subject:"Biologie",name:"Nerven, Sinne & Immunsystem",flang:"de-DE",blang:"de-DE",cards:B([["Welche Aufgabe hat das Nervensystem?","Es nimmt Reize auf, verarbeitet sie und steuert die Reaktion des K\xF6rpers."],["Was ist ein Reflex?","Eine blitzschnelle Reaktion, die im R\xFCckenmark verschaltet wird, ohne den Umweg \xFCbers Gehirn."],["Warum ist der Reflex so schnell?","Weil der Weg kurz ist \u2014 der Denkapparat wird schlicht \xFCbersprungen."],["Wie entsteht ein Bild im Auge?","Die Linse b\xFCndelt Licht auf die Netzhaut, dort wandeln Sinneszellen es in Nervensignale um."],["Warum sehen wir in der D\xE4mmerung kaum Farben?","F\xFCr Farben sind die Zapfen zust\xE4ndig, die viel Licht brauchen. Im Dunkeln arbeiten nur die lichtempfindlichen St\xE4bchen."],["Wie funktioniert H\xF6ren?","Schall bringt das Trommelfell zum Schwingen, die Geh\xF6rkn\xF6chelchen verst\xE4rken, im Innenohr entstehen Nervensignale."],["Warum ist laute Musik \xFCber Kopfh\xF6rer riskant?","Zerst\xF6rte Sinneszellen im Innenohr wachsen nicht nach. Der H\xF6rverlust bleibt."],["Was ist ein Krankheitserreger?","Ein Bakterium, Virus oder Pilz, der im K\xF6rper Schaden anrichtet."],["Was ist der Unterschied zwischen Bakterien und Viren?","Bakterien sind selbstst\xE4ndige Lebewesen, Viren brauchen fremde Zellen zur Vermehrung."],["Warum helfen Antibiotika nicht gegen Grippe?","Antibiotika wirken gegen Bakterien. Grippe wird von Viren verursacht."],["Wie funktioniert eine Impfung?","Der K\xF6rper \xFCbt an einem harmlosen Teil des Erregers und legt Ged\xE4chtniszellen an. Im Ernstfall ist die Abwehr sofort da."],["Warum ist Fieber sinnvoll?","H\xF6here Temperatur bremst Erreger und beschleunigt die Abwehr. Nur sehr hohes Fieber wird gef\xE4hrlich."]])},{category:"Unterstufe 3",subject:"Biologie",name:"\xD6kologie & Stoffkreisl\xE4ufe",flang:"de-DE",blang:"de-DE",cards:B([["Was ist ein \xD6kosystem?","Ein Lebensraum samt aller Lebewesen darin und ihren Wechselwirkungen."],["Was sind Produzenten?","Pflanzen. Sie bauen mit Licht aus Wasser und CO\u2082 energiereiche Stoffe auf."],["Was sind Konsumenten?","Tiere, die sich von anderen Lebewesen ern\xE4hren, weil sie selbst nichts aufbauen k\xF6nnen."],["Was sind Destruenten und warum sind sie unverzichtbar?","Bakterien und Pilze zersetzen Totes zu Mineralstoffen. Ohne sie w\xE4re der Kreislauf unterbrochen."],["Wie lautet die Fotosynthese in Worten?","Kohlendioxid und Wasser werden mit Lichtenergie zu Traubenzucker und Sauerstoff."],["Warum ist die Fotosynthese die Grundlage fast allen Lebens?","Sie bindet Sonnenenergie in Nahrung und liefert nebenbei den Sauerstoff zum Atmen."],["Was ist eine Nahrungskette?","Die Reihe, wer wen frisst \u2014 von der Pflanze \xFCber den Pflanzenfresser zum Fleischfresser."],["Warum wird eine Nahrungskette nach oben hin schmaler?","Bei jedem Schritt geht der Gro\xDFteil der Energie als W\xE4rme verloren. Nur ein Bruchteil landet in der n\xE4chsten Stufe."],["Was ist ein Nahrungsnetz?","Die realistische Verkn\xFCpfung vieler Nahrungsketten, weil die meisten Tiere mehreres fressen."],["Was passiert, wenn ein Glied wegf\xE4llt?","Das Netz ger\xE4t aus dem Gleichgewicht: manche Arten vermehren sich stark, andere verschwinden."],["Was ist der Treibhauseffekt?","Gase in der Atmosph\xE4re halten W\xE4rmestrahlung zur\xFCck. Ohne ihn w\xE4re die Erde eisig, zu viel davon heizt sie auf."],["Warum ist Artenvielfalt wichtig?","Je mehr Arten, desto stabiler das System. F\xE4llt eine aus, k\xF6nnen andere die Rolle \xFCbernehmen."]])},{category:"Unterstufe 3",subject:"Geographie & Wirtschaft",name:"Europa: L\xE4nder, Hauptst\xE4dte, Gew\xE4sser",flang:"de-DE",blang:"de-DE",cards:B([["Hauptstadt von Frankreich?","Paris."],["Hauptstadt von Italien?","Rom."],["Hauptstadt von Spanien?","Madrid."],["Hauptstadt von Polen?","Warschau."],["Hauptstadt von Schweden?","Stockholm."],["Hauptstadt von Griechenland?","Athen."],["Hauptstadt von Portugal?","Lissabon."],["Hauptstadt von Ungarn?","Budapest."],["Hauptstadt der Niederlande?","Amsterdam \u2014 Regierungssitz ist allerdings Den Haag."],["Welche L\xE4nder grenzen an \xD6sterreich?","Acht: Deutschland, Tschechien, Slowakei, Ungarn, Slowenien, Italien, Schweiz, Liechtenstein."],["Welcher Fluss flie\xDFt durch Wien, Budapest und Belgrad?","Die Donau \u2014 der zweitl\xE4ngste Fluss Europas."],["In welches Meer m\xFCndet die Donau?","Ins Schwarze Meer."],["Welches Gebirge trennt Spanien von Frankreich?","Die Pyren\xE4en."],["Welcher Berg ist der h\xF6chste der Alpen?","Der Mont Blanc mit rund 4808 Metern."],["Welcher ist der h\xF6chste Berg \xD6sterreichs?","Der Gro\xDFglockner mit 3798 Metern."],["Welches Meer liegt zwischen Italien und Griechenland?","Das Adriatische und weiter s\xFCdlich das Ionische Meer."],["Was ist die Europ\xE4ische Union in einem Satz?","Ein Zusammenschluss von 27 Staaten mit gemeinsamem Binnenmarkt und teils gemeinsamer W\xE4hrung."],["Was bedeutet der Schengen-Raum?","Reisen zwischen den Mitgliedsstaaten ohne Grenzkontrollen."]])},{category:"Unterstufe 3",subject:"Geographie & Wirtschaft",name:"Klima, Zonen & Wirtschaft",flang:"de-DE",blang:"de-DE",cards:B([["Was ist der Unterschied zwischen Wetter und Klima?","Wetter ist der Zustand jetzt, Klima der Durchschnitt \xFCber Jahrzehnte."],["Warum ist es am \xC4quator w\xE4rmer als an den Polen?","Die Sonne steht dort steil, ihre Energie verteilt sich auf eine kleinere Fl\xE4che."],["Welche Klimazonen gibt es grob von S\xFCd nach Nord?","Tropisch, subtropisch, gem\xE4\xDFigt, kalt beziehungsweise polar."],["In welcher Klimazone liegt Mitteleuropa?","In der gem\xE4\xDFigten Zone mit vier ausgepr\xE4gten Jahreszeiten."],["Warum ist es in Irland milder als in Moskau, obwohl beide gleich weit n\xF6rdlich liegen?","Der Golfstrom bringt warmes Wasser nach Westeuropa."],["Wie ver\xE4ndert sich das Klima mit der H\xF6he?","Pro 100 H\xF6henmeter sinkt die Temperatur um etwa 0,6 Grad."],["Was ist die Baumgrenze?","Die H\xF6he, oberhalb derer es f\xFCr B\xE4ume zu kalt und zu windig ist."],["Was versteht man unter den drei Wirtschaftssektoren?","Prim\xE4r: Rohstoffe gewinnen. Sekund\xE4r: verarbeiten. Terti\xE4r: Dienstleistungen."],["In welchem Sektor arbeiten die meisten Menschen in \xD6sterreich?","Im terti\xE4ren Sektor, also bei Dienstleistungen."],["Was ist ein Ballungsraum?","Ein Gebiet mit sehr hoher Bev\xF6lkerungsdichte rund um eine gro\xDFe Stadt."],["Was bedeutet Globalisierung?","Waren, Geld, Menschen und Informationen bewegen sich weltweit \u2014 L\xE4nder werden voneinander abh\xE4ngig."],["Warum ist der Tourismus f\xFCr \xD6sterreich so wichtig?","Alpen und Kulturst\xE4dte bringen Einkommen und Arbeitspl\xE4tze, besonders in l\xE4ndlichen Regionen."]])},{category:"Unterstufe 3",subject:"Geschichte & Politik",name:"Entdeckungen & fr\xFChe Neuzeit",flang:"de-DE",blang:"de-DE",cards:B([["Was erfand Johannes Gutenberg um 1450?","Den Buchdruck mit beweglichen Lettern \u2014 Wissen wurde erstmals massenhaft verbreitbar."],["Warum war der Buchdruck so folgenreich?","B\xFCcher wurden billig, immer mehr Menschen lernten lesen, neue Ideen verbreiteten sich rasend schnell."],["Wer erreichte 1492 Amerika?","Christoph Kolumbus \u2014 er suchte den Seeweg nach Indien."],["Warum suchten Europ\xE4er neue Seewege?","Der Landweg nach Asien war teuer und blockiert. Gew\xFCrze, Seide und Gold lockten."],["Was bedeutet Kolonialismus?","Europ\xE4ische Staaten eroberten fremde Gebiete, beuteten sie aus und unterwarfen die Bev\xF6lkerung."],["Was war der Kolumbianische Austausch?","Pflanzen, Tiere und Krankheiten wanderten zwischen den Kontinenten. Kartoffel und Mais kamen nach Europa, Seuchen nach Amerika."],["Was ist die Renaissance?","Die Wiedergeburt antiker Ideen ab dem 15. Jahrhundert \u2014 der Mensch r\xFCckt ins Zentrum von Kunst und Wissenschaft."],["Wof\xFCr steht Leonardo da Vinci?","F\xFCr das Ideal des Universalgelehrten: Maler, Anatom, Ingenieur in einer Person."],["Was l\xF6ste Martin Luther 1517 aus?","Die Reformation. Seine Kritik am Ablasshandel spaltete die Kirche."],["Was war der Ablasshandel?","Der Verkauf von S\xFCndenerlass gegen Geld \u2014 f\xFCr Luther unvereinbar mit dem Glauben."],["Was \xE4nderte Kopernikus am Weltbild?","Nicht die Erde, sondern die Sonne steht im Mittelpunkt. Das ersch\xFCtterte die Stellung des Menschen im Kosmos."],["Was war der Drei\xDFigj\xE4hrige Krieg?","Ein Religions- und Machtkrieg 1618 bis 1648, der Mitteleuropa verw\xFCstete und die Bev\xF6lkerung stellenweise halbierte."]])},{category:"Unterstufe 3",subject:"Geschichte & Politik",name:"Absolutismus, Aufkl\xE4rung & Revolution",flang:"de-DE",blang:"de-DE",cards:B([["Was ist Absolutismus?","Ein K\xF6nig herrscht unbeschr\xE4nkt und begr\xFCndet seine Macht mit Gottes Willen."],["Wer sagte \u201EDer Staat bin ich\u201C?","Ludwig XIV. von Frankreich, der Sonnenk\xF6nig."],["Was ist die zentrale Idee der Aufkl\xE4rung?","Der Mensch soll seinen eigenen Verstand gebrauchen statt blind zu gehorchen."],["Was forderte Montesquieu?","Die Gewaltenteilung: Gesetzgebung, Regierung und Gerichte m\xFCssen getrennt sein."],["Welche Reformen brachte Maria Theresia?","Unter anderem die Schulpflicht ab 1774 und eine geordnete Verwaltung."],["Was tat Joseph II.?","Er schaffte die Leibeigenschaft ab und erlie\xDF das Toleranzpatent f\xFCr andere Konfessionen."],["Wann begann die Franz\xF6sische Revolution?","1789 mit dem Sturm auf die Bastille am 14. Juli."],["Welche drei Forderungen pr\xE4gten die Revolution?","Freiheit, Gleichheit, Br\xFCderlichkeit."],["Was waren die drei St\xE4nde vor der Revolution?","Klerus, Adel und der dritte Stand \u2014 letzterer stellte \xFCber 90 Prozent und zahlte fast alle Steuern."],["Warum kam es zur Revolution?","Hunger, Staatsbankrott und die Ungerechtigkeit der St\xE4ndeordnung trafen auf die Ideen der Aufkl\xE4rung."],["Was ist die Erkl\xE4rung der Menschen- und B\xFCrgerrechte?","Ein Dokument von 1789: Menschen sind frei und gleich an Rechten geboren."],["Wer war Napoleon Bonaparte?","Ein General, der sich 1804 zum Kaiser kr\xF6nte, halb Europa eroberte und dabei den Code Civil verbreitete."]])},{category:"Unterstufe 3",subject:"Geschichte & Politik",name:"Industrialisierung & Demokratie heute",flang:"de-DE",blang:"de-DE",cards:B([["Was war die Industrielle Revolution?","Der \xDCbergang von Handarbeit zu Maschinenarbeit ab etwa 1760 in England."],["Welche Erfindung war der Ausl\xF6ser?","Die Dampfmaschine \u2014 erstmals stand Energie unabh\xE4ngig von Wind, Wasser und Muskelkraft bereit."],["Wie ver\xE4nderte die Eisenbahn das Leben?","Waren und Menschen wurden schnell und billig transportiert. Entfernungen schrumpften gef\xFChlt."],["Was war die soziale Frage?","Fabrikarbeit brachte Elend: 14-Stunden-Tage, Kinderarbeit, Wohnungsnot, keine Absicherung."],["Wie reagierten die Arbeiter darauf?","Sie gr\xFCndeten Gewerkschaften und Parteien und erk\xE4mpften Arbeitszeitgrenzen und Versicherungen."],["Was ist Urbanisierung?","Die starke Wanderung vom Land in die St\xE4dte, weil dort Arbeit in den Fabriken lockte."],["Was bedeutet Demokratie w\xF6rtlich?","Herrschaft des Volkes, aus dem Griechischen."],["Was hei\xDFt Gewaltenteilung konkret in \xD6sterreich?","Parlament macht Gesetze, Regierung f\xFChrt sie aus, unabh\xE4ngige Gerichte sprechen Recht."],["Wer wird bei der Nationalratswahl gew\xE4hlt?","Die Abgeordneten des Nationalrats, also das Parlament."],["Ab welchem Alter darf man in \xD6sterreich w\xE4hlen?","Ab 16 Jahren \u2014 das ist im europ\xE4ischen Vergleich fr\xFCh."],["Was steht in einer Verfassung?","Die Grundregeln des Staates und die Grundrechte, die niemand einfach \xE4ndern darf."],["Warum sind freie Medien f\xFCr Demokratie wichtig?","Sie kontrollieren die M\xE4chtigen und erm\xF6glichen Meinungsbildung aus mehreren Quellen."]])},{category:"Unterstufe 3",subject:"Deutsch",name:"Grammatik: F\xE4lle, Zeiten, Satzglieder",flang:"de-DE",blang:"de-DE",cards:B([["Wie hei\xDFen die vier F\xE4lle mit Fragewort?","Nominativ (wer/was), Genitiv (wessen), Dativ (wem), Akkusativ (wen/was)."],["In welchem Fall steht \u201Edem Kind\u201C?","Im Dativ \u2014 Frage: wem?"],["Wie findest du das Subjekt im Satz?","Frage \u201EWer oder was tut etwas?\u201C \u2014 die Antwort ist das Subjekt."],["Was ist ein Pr\xE4dikat?","Der Satzkern aus Verbformen. Er sagt, was geschieht."],["Wie unterscheidest du Dativ- und Akkusativobjekt?","Dativ antwortet auf \u201Ewem?\u201C, Akkusativ auf \u201Ewen oder was?\u201C."],["Bilde das Perfekt von \u201Egehen\u201C (ich).","Ich bin gegangen \u2014 mit \u201Esein\u201C, weil es eine Ortsver\xE4nderung ist."],["Wann nimmt man \u201Ehaben\u201C, wann \u201Esein\u201C im Perfekt?","\u201ESein\u201C bei Bewegung und Zustandswechsel (ich bin gelaufen), sonst \u201Ehaben\u201C."],["Was dr\xFCckt das Plusquamperfekt aus?","Etwas, das noch vor einem anderen Vergangenen passiert ist: Ich hatte gegessen, bevor er kam."],["Was ist der Unterschied zwischen Aktiv und Passiv?","Aktiv: Der Hund bei\xDFt den Mann. Passiv: Der Mann wird gebissen \u2014 die Tat r\xFCckt in den Vordergrund."],["Was ist ein Nebensatz?","Ein Satz, der allein nicht stehen kann. Das gebeugte Verb rutscht ans Ende."],["Warum steht vor \u201Edass\u201C ein Komma?","Weil \u201Edass\u201C einen Nebensatz einleitet und Nebens\xE4tze abgetrennt werden."],["Was ist eine Konjunktion?","Ein Bindewort wie und, weil, obwohl. Es verkn\xFCpft S\xE4tze oder Satzteile."],["Wie erkennst du ein Adverb?","Es beschreibt n\xE4her, wie, wann oder wo etwas geschieht, und wird nicht dekliniert."],["Was ist der Konjunktiv II und wof\xFCr braucht man ihn?","Die M\xF6glichkeitsform: Ich h\xE4tte, ich w\xFCrde. F\xFCr W\xFCnsche, H\xF6flichkeit und Unwirkliches."]])},{category:"Unterstufe 3",subject:"Deutsch",name:"Rechtschreibung: die klassischen Stolpersteine",flang:"de-DE",blang:"de-DE",cards:B([["Wann schreibt man \u201Edas\u201C, wann \u201Edass\u201C?","\u201EDas\u201C wenn man dieses/welches einsetzen kann. Sonst \u201Edass\u201C als Bindewort."],["Probe: Ich wei\xDF, ___ du kommst.","dass \u2014 man kann nicht \u201Edieses\u201C einsetzen."],["Probe: Das Buch, ___ ich lese.","das \u2014 hier passt \u201Ewelches\u201C."],["Wann \u201Eseit\u201C, wann \u201Eseid\u201C?","\u201ESeit\u201C bei Zeit (seit gestern), \u201Eseid\u201C ist die Form von sein (ihr seid)."],["Wann \u201Ewider\u201C, wann \u201Ewieder\u201C?","\u201EWider\u201C hei\xDFt gegen (Widerspruch), \u201Ewieder\u201C hei\xDFt nochmal."],["Wann schreibt man ss, wann \xDF?","Nach kurzem Vokal ss (Fluss), nach langem Vokal oder Doppellaut \xDF (Fu\xDF, hei\xDF)."],["Was wird immer gro\xDFgeschrieben?","Nomen und alles, was wie ein Nomen gebraucht wird: das Laufen, etwas Sch\xF6nes."],["Signalw\xF6rter f\xFCr Gro\xDFschreibung?","Ein Artikel oder ein Wort wie etwas, nichts, viel davor: das Gute, nichts Neues."],["Wann schreibt man Zeitangaben gro\xDF?","Wenn sie Nomen sind: am Morgen, heute Abend. Klein bleibt: morgens, abends."],["Wie schreibt man: \u201EEs tut mir leid\u201C?","Getrennt und klein \u2014 leid ist hier kein Nomen."],["Wann setzt man ein Komma bei \u201Eund\u201C?","Meist gar nicht. Nur wenn ein Nebensatz dazwischenliegt, wird abgetrennt."],["Warum ist Zeichensetzung mehr als Kosmetik?","Sie steuert den Sinn: \u201EWir essen, Opa.\u201C gegen \u201EWir essen Opa.\u201C"]])},{category:"Unterstufe 3",subject:"Deutsch",name:"Texte & Stilmittel",flang:"de-DE",blang:"de-DE",cards:B([["Was ist eine Metapher?","Ein bildhafter Ausdruck ohne \u201Ewie\u201C: ein Meer aus Menschen."],["Was ist ein Vergleich?","Ein Bild mit \u201Ewie\u201C oder \u201Eals\u201C: stark wie ein B\xE4r."],["Was ist eine Personifikation?","Etwas Unbelebtes handelt wie ein Mensch: Der Wind fl\xFCstert."],["Was ist eine Alliteration?","Gleicher Anfangslaut bei aufeinanderfolgenden W\xF6rtern: Milch macht m\xFCde M\xE4nner munter."],["Was ist eine \xDCbertreibung, fachlich Hyperbel?","Bewusst ma\xDFlose Steigerung: Ich habe dir tausendmal gesagt \u2026"],["Was geh\xF6rt in eine Inhaltsangabe?","Pr\xE4sens, eigene Worte, nur das Wesentliche, keine w\xF6rtliche Rede, keine eigene Meinung."],["Woran erkennst du eine Argumentation?","Behauptung, Begr\xFCndung, Beispiel \u2014 die drei B."],["Was ist der Unterschied zwischen Erz\xE4hler und Autor?","Der Autor schreibt das Buch, der Erz\xE4hler ist die erfundene Stimme darin."],["Was ist ein Ich-Erz\xE4hler?","Eine Figur erz\xE4hlt aus ihrer Sicht und wei\xDF nur, was sie selbst erlebt."],["Was macht eine gute Einleitung aus?","Sie nennt Titel, Autor, Textsorte und das Thema in wenigen S\xE4tzen."],["Was ist eine Ballade?","Ein erz\xE4hlendes Gedicht mit Spannungsbogen \u2014 Handlung in Versform."],["Wozu dient ein Reimschema wie abab?","Es gibt dem Gedicht Rhythmus und Struktur; hier reimen sich Zeile 1 mit 3 und 2 mit 4."]])},{category:"Unterstufe 3",subject:"Englisch",name:"A2 \xB7 Unregelm\xE4\xDFige Verben",flang:"en-US",blang:"de-DE",cards:B([["go \u2014 went \u2014 gone","gehen"],["see \u2014 saw \u2014 seen","sehen"],["take \u2014 took \u2014 taken","nehmen"],["write \u2014 wrote \u2014 written","schreiben"],["speak \u2014 spoke \u2014 spoken","sprechen"],["buy \u2014 bought \u2014 bought","kaufen"],["bring \u2014 brought \u2014 brought","bringen"],["think \u2014 thought \u2014 thought","denken"],["find \u2014 found \u2014 found","finden"],["give \u2014 gave \u2014 given","geben"],["know \u2014 knew \u2014 known","wissen, kennen"],["drink \u2014 drank \u2014 drunk","trinken"],["begin \u2014 began \u2014 begun","beginnen"],["break \u2014 broke \u2014 broken","zerbrechen"],["choose \u2014 chose \u2014 chosen","w\xE4hlen"],["forget \u2014 forgot \u2014 forgotten","vergessen"],["understand \u2014 understood \u2014 understood","verstehen"],["leave \u2014 left \u2014 left","verlassen, gehen"],["win \u2014 won \u2014 won","gewinnen"],["become \u2014 became \u2014 become","werden"]])},{category:"Unterstufe 3",subject:"Englisch",name:"A2 \xB7 Zeiten richtig w\xE4hlen",flang:"de-DE",blang:"de-DE",cards:B([["Wann nimmt man das Present Perfect?","Wenn die Vergangenheit bis jetzt wirkt oder der Zeitpunkt egal ist: I have lost my key."],["Wann nimmt man das Past Simple?","Bei einem abgeschlossenen Zeitpunkt in der Vergangenheit: I lost my key yesterday."],["Signalw\xF6rter f\xFCr Present Perfect?","already, yet, just, ever, never, since, for."],["Signalw\xF6rter f\xFCr Past Simple?","yesterday, last week, in 2019, ago."],["Was ist der Unterschied: since oder for?","since nennt den Startpunkt (since 2020), for die Dauer (for two years)."],["Wann benutzt man das Present Progressive?","F\xFCr etwas, das gerade jetzt passiert: I am reading."],["Warum sagt man nicht \u201EI am knowing\u201C?","Verben des Denkens und F\xFChlens stehen nicht in der Verlaufsform."],["Wie bildet man das Going-to-Future?","am/is/are going to + Grundform \u2014 f\xFCr Geplantes: I am going to visit her."],["Wann nimmt man will?","F\xFCr spontane Entschl\xFCsse und Vorhersagen: I think it will rain."],["Wie bildet man das Past Progressive und wof\xFCr?","was/were + ing. F\xFCr einen laufenden Vorgang, in den etwas hineinplatzt: I was cooking when he called."],["\xDCbersetze: Ich habe ihn seit Montag nicht gesehen.","I haven't seen him since Monday."],["\xDCbersetze: Wir sind letztes Jahr nach Rom gefahren.","We went to Rome last year."],["Was ist der Unterschied: I have been to London / I have gone to London?","been to hei\xDFt, man war dort und ist zur\xFCck. gone to hei\xDFt, man ist noch dort."],["Wie bildet man Fragen im Past Simple?","Mit did und der Grundform: Did you see it? Das Verb bleibt unver\xE4ndert."]])},{category:"Unterstufe 3",subject:"Englisch",name:"A2 \xB7 Wortschatz Schule, Freizeit, Reisen",flang:"en-US",blang:"de-DE",cards:B([["timetable","Stundenplan"],["homework","Haus\xFCbung"],["subject","Unterrichtsfach"],["break","Pause"],["exam","Pr\xFCfung"],["to pass an exam","eine Pr\xFCfung bestehen"],["to fail","durchfallen"],["team sport","Mannschaftssport"],["hobby","Hobby"],["to hang out with friends","mit Freunden abh\xE4ngen"],["luggage","Gep\xE4ck"],["departure","Abfahrt, Abflug"],["arrival","Ankunft"],["return ticket","R\xFCckfahrkarte"],["accommodation","Unterkunft"],["abroad","im Ausland"],["to book a room","ein Zimmer buchen"],["crowded","\xFCberf\xFCllt"],["on time","p\xFCnktlich"],["delayed","versp\xE4tet"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 Verben \xEAtre, avoir, aller",flang:"fr-FR",blang:"de-DE",cards:B([["je suis","ich bin"],["tu es","du bist"],["il/elle est","er/sie ist"],["nous sommes","wir sind"],["vous \xEAtes","ihr seid / Sie sind"],["ils/elles sont","sie sind"],["j'ai","ich habe"],["tu as","du hast"],["il/elle a","er/sie hat"],["nous avons","wir haben"],["vous avez","ihr habt / Sie haben"],["ils/elles ont","sie haben"],["je vais","ich gehe"],["tu vas","du gehst"],["nous allons","wir gehen"],["ils vont","sie gehen"]])},{category:"Unterstufe 3",subject:"Franz\xF6sisch",name:"A1 \xB7 Schule & Alltag",flang:"fr-FR",blang:"de-DE",cards:B([["l'\xE9cole","die Schule"],["la classe","die Klasse"],["le professeur","der Lehrer"],["le cahier","das Heft"],["le livre","das Buch"],["le stylo","der Kugelschreiber"],["les devoirs","die Haus\xFCbungen"],["la r\xE9cr\xE9ation","die Pause"],["le sac \xE0 dos","der Rucksack"],["l'emploi du temps","der Stundenplan"],["aujourd'hui","heute"],["demain","morgen"],["hier","gestern"],["toujours","immer"],["souvent","oft"],["j'aime","ich mag"],["je n'aime pas","ich mag nicht"],["c'est facile","das ist leicht"],["c'est difficile","das ist schwierig"]])},{category:"Unterstufe 3",subject:"Latein",name:"1. Lernjahr \xB7 Grundwortschatz & Formen",flang:"de-DE",blang:"de-DE",cards:B([["servus, servi (m.)","der Sklave, der Diener"],["puella, puellae (f.)","das M\xE4dchen"],["templum, templi (n.)","der Tempel"],["amicus, amici (m.)","der Freund"],["vita, vitae (f.)","das Leben"],["terra, terrae (f.)","die Erde, das Land"],["videre","sehen"],["audire","h\xF6ren"],["dicere","sagen"],["venire","kommen"],["dare","geben"],["Wie lauten die sechs F\xE4lle im Lateinischen?","Nominativ, Genitiv, Dativ, Akkusativ, Ablativ, Vokativ."],["Woran erkennt man im Lateinischen den Fall?","An der Endung. Deshalb ist die Wortstellung viel freier als im Deutschen."],["Was bedeutet \u201Eamicus puellae\u201C?","Der Freund des M\xE4dchens \u2014 die Endung -ae zeigt hier den Genitiv."],["Welches deutsche Wort steckt in \u201Etemplum\u201C?","Tempel. Sehr viele Fremdw\xF6rter stammen direkt aus dem Lateinischen."],["Warum lohnt Latein f\xFCr andere Sprachen?","Franz\xF6sisch, Spanisch und Italienisch stammen davon ab, und im Englischen ist rund die H\xE4lfte des Wortschatzes lateinisch beeinflusst."]])},{category:"Zum Staunen",subject:"Kaum zu glauben",name:"Gr\xF6\xDFenordnungen, die niemand erwartet",flang:"de-DE",blang:"de-DE",cards:B([["Was gab es fr\xFCher: die Pyramiden von Gizeh oder Kleopatra?","Die Pyramiden \u2014 und zwar mit gro\xDFem Abstand.","Kleopatra lebte rund 2500 Jahre nach dem Bau der Gro\xDFen Pyramide, aber nur etwa 2000 Jahre vor der Mondlandung. Sie war der Mondlandung zeitlich n\xE4her als dem Pyramidenbau."],["Wie viele Zellen im menschlichen K\xF6rper sind gar keine menschlichen Zellen?","Etwa die H\xE4lfte.","Vor allem Bakterien, die meisten im Darm. Fr\xFCher hie\xDF es zehnmal so viele wie K\xF6rperzellen \u2014 eine Neuberechnung von 2016 ergab ein Verh\xE4ltnis von ungef\xE4hr eins zu eins."],["Wie viele Atemz\xFCge Luft, die Julius Caesar ausgeatmet hat, sind in deinem n\xE4chsten Atemzug?","Statistisch etwa ein paar Molek\xFCle.","Es sind so unfassbar viele Molek\xFCle in einem Atemzug \u2014 mehr als es Atemz\xFCge in der Erdatmosph\xE4re gibt \u2014 dass sich seine Luft l\xE4ngst \xFCberall verteilt hat."],["Wie lange br\xE4uchte ein Auto mit 100 km/h bis zur Sonne?","Rund 170 Jahre.","Und bis zum n\xE4chsten Stern danach \xFCber 45 Millionen Jahre. Das ist der Grund, warum interstellare Reisen so schwierig sind \u2014 nicht die Technik, sondern die Entfernung."],["Wie viel Prozent des Meeresbodens ist genauer kartiert als die Marsoberfl\xE4che?","Deutlich weniger \u2014 der Mars ist besser vermessen.","Radar durchdringt Weltraum problemlos, aber kaum Wasser. Deshalb wissen wir \xFCber die Oberfl\xE4che fremder Planeten mehr als \xFCber unseren eigenen Meeresboden."],["Wie viele Wege gibt es, ein Kartenspiel mit 52 Karten zu mischen?","Mehr, als es Atome auf der Erde gibt.","Die Zahl hat 68 Stellen. Jedes ordentlich gemischte Kartenspiel liegt fast sicher in einer Reihenfolge, in der noch nie eines lag."],["Wie alt ist der \xE4lteste bekannte lebende Baum ungef\xE4hr?","\xDCber 4800 Jahre.","Eine Grannenkiefer in Kalifornien. Sie keimte, als in \xC4gypten die ersten Pyramiden gebaut wurden \u2014 und sie lebt heute noch."],["Wie viel wiegt eine Wolke ungef\xE4hr?","Eine mittlere Sch\xF6nwetterwolke mehrere hundert Tonnen.","Sie f\xE4llt nicht herunter, weil die Tr\xF6pfchen winzig sind und die warme Luft darunter sie tr\xE4gt. Gewicht und Schweben widersprechen sich nicht."],["Was ist schwerer: alle Ameisen der Erde oder alle Menschen?","Nach heutigen Sch\xE4tzungen die Menschen.","Lange hie\xDF es, die Ameisen w\xF6gen mehr. Neuere Arbeiten sch\xE4tzen die Ameisenmasse auf einen Bruchteil der menschlichen \u2014 die alte Behauptung h\xE4lt sich trotzdem hartn\xE4ckig."],["Wie lange dauert es, bis Licht von der Sonne die Erde erreicht?","Etwa 8 Minuten und 20 Sekunden.","W\xFCrde die Sonne erl\xF6schen, bemerkten wir es erst dann. Bis dahin schiene sie am Himmel weiter \u2014 wir sehen immer die Vergangenheit."],["Wie viele Menschen haben insgesamt jemals gelebt?","Sch\xE4tzungen liegen bei rund 100 bis 110 Milliarden.","Etwa sieben Prozent davon leben heute. Die oft geh\xF6rte Behauptung, es lebten heute mehr Menschen als jemals zuvor zusammen, stimmt also nicht."],["Was war der \u201EBloop\u201C?","Ein extrem lautes Unterwasserger\xE4usch aus dem Jahr 1997 \u2014 verursacht von brechendem Eis.","Messstationen im S\xFCdpazifik zeichneten einen Ton auf, der lauter war als jedes bekannte Tier. Jahrelang wurde \xFCber ein unbekanntes Riesenwesen spekuliert. Sp\xE4ter ordnete man ihn einem Eisbeben in der Antarktis zu: Wenn ein Eisberg abbricht, ist das noch tausende Kilometer weit zu h\xF6ren."],["Wie tief ist die tiefste Stelle im Meer?","Rund 11 000 Meter \u2014 der Marianengraben.","Der Mount Everest h\xE4tte darin Platz, mit \xFCber zwei Kilometern Wasser dar\xFCber. Dort unten lastet mehr als das Tausendfache des Drucks an der Oberfl\xE4che."]])},{category:"Zum Staunen",subject:"Drau\xDFen zurechtkommen",name:"Erste Hilfe, die man wirklich braucht",flang:"de-DE",blang:"de-DE",cards:B([["Was ist die wichtigste Regel bei jedem Notfall?","Erst schauen, ob es f\xFCr einen selbst sicher ist.","Wer selbst verungl\xFCckt, hilft niemandem mehr und bindet Rettungskr\xE4fte. Deshalb bei Verkehr, Strom oder Wasser: zuerst die Lage sichern."],["Welche drei Angaben braucht die Leitstelle mindestens?","Wo, was passiert ist, und dass man erreichbar bleibt.","Die alten \u201Ef\xFCnf W-Fragen\u201C muss niemand auswendig k\xF6nnen \u2014 die Leitstelle fragt selbst. Wichtig ist nur: nicht auflegen, bis sie es sagt."],["Was tut man bei einer stark blutenden Wunde?","Fest draufdr\xFCcken \u2014 mit allem, was greifbar ist.","Druck ist entscheidend, nicht Sauberkeit. Ein Pullover tut es. Nichts abbinden, au\xDFer man ist geschult; und die Hand nicht wegnehmen, um nachzuschauen."],["Was ist die stabile Seitenlage \u2014 und wann braucht man sie?","Bei Bewusstlosen, die normal atmen.","Sie h\xE4lt die Atemwege frei, falls die Person erbricht. Auf den R\xFCcken gelegt kann die Zunge zur\xFCckfallen \u2014 das ist die eigentliche Gefahr."],["Woran erkennt man, dass jemand nicht mehr normal atmet?","Kein Heben des Brustkorbs, keine Luft an der Wange, nur Schnappatmung.","Schnappen ist keine Atmung, sondern ein Zeichen f\xFCr Herzstillstand \u2014 und wird oft f\xFCr Atmung gehalten. Im Zweifel handeln."],["Was tut man bei einem Herzstillstand?","Notruf, dann kr\xE4ftig in der Mitte des Brustkorbs dr\xFCcken, etwa zweimal pro Sekunde.","Mindestens 100 Mal pro Minute, f\xFCnf bis sechs Zentimeter tief. Beatmen ist optional \u2014 Dr\xFCcken ist das Entscheidende. Falsch machen kann man nur eines: nichts tun."],["Was tut man bei einer Verbrennung?","Zehn bis zwanzig Minuten mit lauwarmem Wasser k\xFChlen.","Kein Eis, keine Butter, keine Zahnpasta. Eis sch\xE4digt das Gewebe zus\xE4tzlich. Blasen nicht \xF6ffnen."],["Was tut man bei einem verstauchten Kn\xF6chel?","Ruhigstellen, k\xFChlen, hochlagern.","K\xFChlen nie direkt auf der Haut \u2014 immer ein Tuch dazwischen, sonst gibt es Erfrierungen. Zwanzig Minuten gen\xFCgen."],["Wann darf man einen Verletzten bewegen?","Nur wenn er sonst in Gefahr w\xE4re.","Bei Verdacht auf Wirbels\xE4ulenverletzung kann Bewegen schaden. Ausnahme: Feuer, Verkehr, Wasser \u2014 dann rettet Bewegen mehr, als sie schadet."],["Was ist der h\xE4ufigste Fehler von Ersthelfern?","Nichts tun aus Angst, etwas falsch zu machen.","In \xD6sterreich und Deutschland ist unterlassene Hilfeleistung strafbar, ein Fehler beim Helfen dagegen nicht. Wer hilft, ist rechtlich gesch\xFCtzt."]])},{category:"Zum Staunen",subject:"N\xFCtzlich zu wissen",name:"Kleine Kniffe, gro\xDFe Wirkung",flang:"de-DE",blang:"de-DE",cards:B([["Wie h\xE4lt man sich in einer Menschenmenge sicher?","Am Rand bleiben und dorthin gehen, wo Platz ist \u2014 nie gegen die Richtung.","Gef\xE4hrlich wird es durch Druck, nicht durch Panik. Wer sich diagonal mit dem Strom bewegt, kommt nach au\xDFen; wer dagegen dr\xFCckt, verliert."],["Warum sollte man bei einem Wohnungsbrand nicht durch Rauch laufen?","Zwei bis drei Atemz\xFCge Brandrauch k\xF6nnen bewusstlos machen.","Nicht die Flammen t\xF6ten die meisten Menschen, sondern der Rauch. Wenn der Fluchtweg verraucht ist: T\xFCr zu, Ritzen abdichten, ans Fenster, Notruf."],["Warum ist die T\xFCr bei einem Brand wichtiger als das Fenster?","Eine geschlossene T\xFCr h\xE4lt Feuer und Rauch minutenlang auf.","Feuerwehrleute empfehlen sogar, nachts die Zimmert\xFCr zu schlie\xDFen \u2014 das kann im Ernstfall den Unterschied machen."],["Was tut man, wenn man im Wasser in eine Str\xF6mung ger\xE4t, die vom Ufer wegzieht?","Parallel zum Ufer schwimmen, nicht dagegen.","Solche Str\xF6mungen sind schmal. Wer dagegen anschwimmt, ersch\xF6pft sich; wer seitlich herausschwimmt, ist nach wenigen Metern frei."],["Warum soll man ersch\xF6pft nicht ins kalte Wasser springen?","K\xE4lteschock l\xE4sst einen unwillk\xFCrlich einatmen.","Der erste Reflex im kalten Wasser ist ein tiefer Atemzug \u2014 unter Wasser ist das t\xF6dlich. Langsam hineingehen gibt dem K\xF6rper Zeit."],["Wie pr\xFCft man, ob Eis auf einem See tragf\xE4hig ist?","Gar nicht zuverl\xE4ssig \u2014 nur freigegebene Fl\xE4chen betreten.","Faustregeln wie \u201Ef\xFCnf Zentimeter reichen\u201C versagen bei Str\xF6mung, Zufl\xFCssen und Schnee auf dem Eis. Bricht man ein: Arme ausbreiten, in Richtung zur\xFCck, aus der man kam."],["Was hilft gegen Reisekrankheit?","Nach vorn aus dem Fenster schauen, an die frische Luft, nicht lesen.","\xDCbelkeit entsteht, wenn die Augen Stillstand melden und das Gleichgewichtsorgan Bewegung. Wer den Horizont sieht, bringt beides in Einklang."],["Wie findet man heraus, ob ein Ei noch gut ist?","In ein Glas Wasser legen: Sinkt es, ist es frisch.","Mit der Zeit dringt Luft durch die Schale und die Luftkammer w\xE4chst. Steht das Ei aufrecht, sollte man es nur noch durchgegart essen; schwimmt es oben, weg damit."],["Warum brennt scharfes Essen weniger, wenn man Milch trinkt?","Der Sch\xE4rfestoff l\xF6st sich in Fett, nicht in Wasser.","Capsaicin ist fettl\xF6slich. Wasser verteilt es nur; Milch, Joghurt oder \xD6l nehmen es auf. Deshalb steht in Indien Joghurt auf dem Tisch."],["Warum sollte man einen brennenden Fettbrand nie mit Wasser l\xF6schen?","Das Wasser verdampft schlagartig und schleudert brennendes Fett heraus.","Aus einem Glas Wasser wird ein meterhoher Feuerball. Richtig ist: Deckel drauf, Herd aus, Luft wegnehmen."],["Was ist die einfachste Art, sich einen Namen zu merken?","Ihn beim Kennenlernen einmal laut wiederholen.","\u201EFreut mich, Anna.\u201C Wer den Namen ausspricht, ruft ihn ab statt ihn nur zu h\xF6ren \u2014 und aktives Abrufen ist derselbe Effekt, auf dem diese ganze App beruht."],["Warum lernt man mit Pausen mehr als am St\xFCck?","Weil das Ged\xE4chtnis in den Pausen sortiert.","Vier mal f\xFCnfzehn Minuten \xFCber eine Woche bringen mehr als eine Stunde am St\xFCck \u2014 dasselbe Prinzip wie beim Wiederholen kurz vor dem Vergessen."]])},{category:"Zum Staunen",subject:"Drau\xDFen zurechtkommen",name:"Sich zurechtfinden ohne Handy",flang:"de-DE",blang:"de-DE",cards:B([["Wo steht die Sonne mittags in Mitteleuropa?","Im S\xFCden.","Um die Mittagszeit steht sie am h\xF6chsten und genau im S\xFCden \u2014 der Schatten zeigt dann nach Norden. Das ist die einfachste Himmelsrichtung, die man ohne Hilfsmittel bekommt."],["Wie findet man mit einer Analoguhr die Himmelsrichtung?","Stundenzeiger zur Sonne richten; die Mitte zwischen Zeiger und 12 zeigt nach S\xFCden.","Funktioniert auf der Nordhalbkugel. Bei Sommerzeit nimmt man statt der 12 die 1. Ohne Zeigeruhr kann man sich das Zifferblatt vorstellen."],["Wie findet man nachts den Norden?","\xDCber den Polarstern.","Man verl\xE4ngert die hintere Kante des Gro\xDFen Wagens etwa f\xFCnfmal \u2014 dort steht der Polarstern. Er steht fast genau \xFCber dem Nordpol und wandert deshalb praktisch nicht."],["Warum ist Moos an B\xE4umen ein schlechter Kompass?","Es w\xE4chst dort, wo es feucht ist \u2014 nicht zuverl\xE4ssig im Norden.","Das h\xE4ngt von Wind, Regenrichtung und Nachbarb\xE4umen ab. Ein h\xFCbscher Merksatz, aber im Ernstfall unbrauchbar."],["Was macht man zuerst, wenn man merkt, dass man sich verlaufen hat?","Stehen bleiben.","Weitergehen vergr\xF6\xDFert den Suchraum f\xFCr alle, die einen suchen. Kurz setzen, trinken, nachdenken \u2014 die meisten Fehler entstehen in den ersten aufgeregten Minuten."],["Warum sollte man bergab dem Wasser folgen, wenn man sich verirrt hat?","B\xE4che f\xFChren talw\xE4rts, und im Tal liegen Wege und Siedlungen.","Das gilt in Mitteleuropa gut. In Schluchten kann es allerdings gef\xE4hrlich werden \u2014 dann lieber oberhalb bleiben und dem Lauf nur mit den Augen folgen."],["Was ist das internationale Notsignal?","Sechsmal in der Minute ein Signal, eine Minute Pause, dann wiederholen.","Rufen, pfeifen oder mit Licht. Die Antwort ist dreimal pro Minute. Ein Pfiff tr\xE4gt viel weiter als ein Ruf und kostet fast keine Kraft."],["Was ist beim Absetzen eines Notrufs am wichtigsten?","Der genaue Ort.","Alles andere kann man nachfragen \u2014 ohne Ort hilft keine Information. Wenn m\xF6glich: markante Punkte nennen, H\xF6he, letzte bekannte Abzweigung."],["Welche Notrufnummer gilt in ganz Europa?","112.","Sie funktioniert auch ohne Guthaben und in vielen F\xE4llen sogar ohne eigenes Netz, wenn ein anderes Netz verf\xFCgbar ist. In \xD6sterreich ist die Bergrettung zus\xE4tzlich unter 140 erreichbar."],["Wie sch\xE4tzt man ab, wie lange es noch hell ist?","Mit der Handbreit-Regel: Finger zwischen Sonne und Horizont.","Jeder Finger entspricht etwa 15 Minuten, eine ganze Hand rund einer Stunde. Grob, aber gut genug f\xFCr die Entscheidung, ob man noch weitergeht oder ein Lager baut."],["Warum sollte man beim Wandern jemandem sagen, wohin man geht?","Damit im Notfall jemand wei\xDF, wo gesucht werden muss.","Das ist die wirksamste Sicherheitsma\xDFnahme \xFCberhaupt \u2014 und die einzige, die nichts wiegt."]])},{category:"Zum Staunen",subject:"Drau\xDFen zurechtkommen",name:"Essbares & Gef\xE4hrliches",flang:"de-DE",blang:"de-DE",cards:B([["Warum ist Hunger drau\xDFen weniger dringend als gedacht?","Der K\xF6rper kommt Wochen ohne Nahrung aus.","W\xE4rme, Wasser und Orientierung sind viel dringlicher. Wer hungrig Pilze probiert, tauscht ein kleines Problem gegen ein gro\xDFes."],["Welche Regel gilt beim Sammeln von Beeren und Pilzen?","Nur essen, was man sicher erkennt.","\u201ESieht essbar aus\u201C gen\xFCgt nie. Es gibt keine allgemeine Regel, an der man Giftiges erkennt \u2014 Tiere fressen vieles, was f\xFCr uns giftig ist."],["Welche Beeren sind in Mitteleuropa leicht sicher zu erkennen?","Brombeere, Himbeere, Heidelbeere, Hagebutte, Holunder (gekocht).","Diese f\xFCnf verwechselt man kaum. Holunder muss erhitzt werden \u2014 roh verursacht er \xDCbelkeit."],["Woran erkennt man Brennnessel \u2014 und wozu taugt sie?","Gez\xE4hnte, gegenst\xE4ndige Bl\xE4tter mit Brennhaaren; gekocht ist sie ein gutes Gem\xFCse.","Kochen oder kr\xE4ftiges Zerdr\xFCcken zerst\xF6rt die Brennhaare. Sie ist eine der nahrhaftesten Wildpflanzen \xFCberhaupt und praktisch \xFCberall zu finden."],["Warum sind Pilze f\xFCr Anf\xE4nger tabu?","Weil t\xF6dlich giftige Arten essbaren sehr \xE4hnlich sehen.","Der Gr\xFCne Knollenbl\xE4tterpilz wird mit Champignons verwechselt. Seine Vergiftung beginnt oft erst nach Stunden \u2014 wenn die Leber schon gesch\xE4digt ist."],["Was ist die Gefahr an Fuchsbandwurm-Warnungen?","Sie werden meist \xFCbersch\xE4tzt, das Grundprinzip stimmt aber.","Ansteckungen sind sehr selten. Trotzdem: bodennah gesammelte Beeren waschen oder erhitzen \u2014 das kostet ni
