f\xFCr ordentlich."],["F\xFCr wen ist das hier gedacht?","F\xFCr alle, die etwas lernen wollen \u2014 oder m\xFCssen. Schule, Lehre, Studium, Pr\xFCfung, neue Sprache, neuer Job, neues Land. Robin fragt nicht nach deinem Alter und nicht nach deinem Zeugnis."],["Und was ist eure Mission, ganz ehrlich?","Ein richtig gutes Lernsystem f\xFCr alle. \xDCberall. \u{1F30D} Ob jemand lernen kann, soll nicht davon abh\xE4ngen, wo man wohnt, was man verdient oder ob gerade Netz da ist."],["Woher wei\xDFt du, wann ich etwas wiederholen soll?","Ein Ged\xE4chtnismodell aus der Forschung sch\xE4tzt, wann eine Karte bei dir zu verblassen beginnt \u2014 und legt sie dir genau dann wieder hin."],["Warum kommt manches erst in drei Wochen wieder?","Weil du es bis dahin fast vergessen h\xE4ttest. Genau dieser Moment bringt am meisten. Fr\xFCher w\xE4re nur nett, aber Zeitverschwendung."],["Das sieht aus wie Papier. Wo ist die ganze Technik?","Unter der ruhigen Oberfl\xE4che: Ged\xE4chtnismodell, Spracherkennung, Vorlesen \u2014 alles direkt auf deinem Ger\xE4t. Gute Technik arbeitet, statt sich in den Vordergrund zu dr\xE4ngen."],["Muss ich mich anmelden?","Nein. Kein Konto, keine E-Mail, kein \u201ERegistriere dich, um fortzufahren\u201C. Wir wissen nicht, wer du bist \u2014 und wollen es ehrlich gesagt auch gar nicht wissen."],["Wo landen meine Daten?","Auf deinem Ger\xE4t. Sonst nirgends. Es gibt keinen Server, der sie einsammeln k\xF6nnte \u2014 damit beantwortet sich \u201Ewer sieht das eigentlich?\u201C von selbst."],["Was kostet das?","Einmal wenig, dann nie wieder. Kein Abo, keine Werbung, keine Bezahlschranke, die mitten im Lernen aufpoppt. Du bist hier nicht das Produkt."],["Wer steckt dahinter?","Menschen. Keine Konzernabteilung, kein Investorenplan. Angefangen hat es am K\xFCchentisch, weil ordentliches Lernen nicht am Geldbeutel h\xE4ngen sollte."],["Wie lege ich eine Karte an?","Auf \u201E+ Karte\u201C tippen, Vorderseite einsprechen oder schreiben, mit \u27F3 umdrehen, R\xFCckseite dazu. Zwanzig Sekunden, fertig."],["Ich habe hier ein ganzes Skript. Alles abtippen?","Blo\xDF nicht. \u201EFotos zu Karten\u201C: Seite fotografieren, den Text vom Handy erkennen lassen, einf\xFCgen. Klappt mit Buchseiten, Skripten und deiner eigenen Mitschrift."],["Wozu der Mikrofon-Knopf beim Lernen?","Sag die Antwort laut, bevor du umdrehst. Selbst erinnern ist m\xFChsamer als wiedererkennen \u2014 und genau deshalb bleibt es h\xE4ngen. Wer lieber still \xFCberlegt, tippt einfach auf die Karte."],["Heute habe ich ehrlich keine Lust.","Dann lass es. Keine Serie, die rei\xDFt, kein rotes Ausrufezeichen, kein schlechtes Gewissen. Ich warte. Und wenn es mal nur f\xFCnf Minuten in der Stra\xDFenbahn sind: auch gut. \u2615"],["Was ist \u201ELichter aus\u201C?","Ein kleines R\xE4tsel zum Ankommen: 25 Felder, ein Tipp schaltet Feld und Nachbarn, Ziel ist alles dunkel. Ohne Punkte, ohne Uhr, ohne tieferen Sinn."],["Was ist \u201EZum Staunen\u201C?","Fragen f\xFCrs gemeinsame Raten \u2014 Autofahrt, Wartezimmer, Abendessen. Funktioniert mit Zehnj\xE4hrigen genauso wie mit Gro\xDFeltern, und alle nehmen etwas mit. \u{1F92F}"],["Kann ich meine Karten weitergeben?","Ja, als Code \u2014 an die Lerngruppe, die Klasse, die Kollegin. Den verschickst du selbst. Ich verschicke nichts und kenne deine Kontakte nicht."],["Und wenn ich kein Internet habe?","Dann l\xE4uft trotzdem alles. Einmal geladen, funktioniert Robin im Zug, im Keller und auf der Almh\xFCtte. Nur f\xFCrs Einsprechen braucht dein Handy kurz Netz."],["Gut. Und jetzt?","Zur\xFCck zur Startseite, in die Bibliothek schauen oder gleich die erste eigene Karte anlegen. Viel Spa\xDF beim Lernen \u2014 Rock \u2019n\u2019 Roll. \u{1F918}"]]),Jm=()=>[{id:zn(),name:"Hallo! Robin in 2 Minuten",recall:!1,cards:Z0.map(e=>({id:zn(),front:e.f,back:e.b,flang:"de-DE",blang:"de-DE",due:0}))}];function V0(){let[e,n]=(0,u.useState)([]);return(0,u.useEffect)(()=>{if(typeof window>"u"||!window.speechSynthesis)return;let a=()=>n
